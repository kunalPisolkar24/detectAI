[service]
slug = "payment-webhook"

[secrets]
keys = ["PADDLE_WEBHOOK_SECRET", "NEW_RELIC_LICENSE_KEY"]

[secrets.min_lengths]
PADDLE_WEBHOOK_SECRET = 16
NEW_RELIC_LICENSE_KEY = 16

[requires]
"OTEL_EXPORTER_OTLP_ENDPOINT" = ["NEW_RELIC_LICENSE_KEY", 16]

[ssm]
keys = [
    "PORT",
    "DRAIN_TIMEOUT",
    "MAX_BODY_BYTES",
    "QUEUE_URL",
    "PUBLISH_BUDGET",
    "OTEL_EXPORTER_OTLP_ENDPOINT",
    "OTEL_SERVICE_NAME",
    "OTEL_SERVICE_VERSION",
    "OTEL_TRACE_SAMPLE_RATIO",
]
