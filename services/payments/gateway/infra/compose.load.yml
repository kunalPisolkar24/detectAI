name: gateway-load

# RabbitMQ UI port lives in standalone.yml; do not include management.yml
# alongside it (compose forbids redefining imported services).
include:
  - path: ../../../../infra/docker/rabbitmq/standalone.yml

services:
  payment-gateway:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      ENV_TYPE: dev
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
      RABBITMQ_QUEUE_TYPE: ${RABBITMQ_QUEUE_TYPE:-quorum}
      PADDLE_WEBHOOK_SECRET: ${PADDLE_WEBHOOK_SECRET:-test_webhook_secret_16chars}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-test_internal_key_16chars}
      PORT: "8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "-O", "/dev/null", "http://localhost:8080/readyz"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    depends_on:
      rabbitmq:
        condition: service_healthy

  k6:
    image: grafana/k6:latest
    command: run /scripts/scenarios/${SCENARIO:-spike}.js
    environment:
      BASE_URL: http://payment-gateway:8080
      PADDLE_WEBHOOK_SECRET: ${PADDLE_WEBHOOK_SECRET:-test_webhook_secret_16chars}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-test_internal_key_16chars}
      TARGET_VUS: ${TARGET_VUS:-20}
      RAMP_UP: ${RAMP_UP:-10s}
      RAMP_DOWN: ${RAMP_DOWN:-10s}
      DURATION: ${DURATION:-30s}
      VUS_LOW: ${VUS_LOW:-50}
      VUS_MED: ${VUS_MED:-100}
      VUS_HIGH: ${VUS_HIGH:-200}
      VUS_MAX: ${VUS_MAX:-300}
      RAMP_MED: ${RAMP_MED:-2m}
      RAMP_HIGH: ${RAMP_HIGH:-2m}
      RAMP_MAX: ${RAMP_MAX:-2m}
      SOAK_MAX_GOROUTINE_GROWTH: ${SOAK_MAX_GOROUTINE_GROWTH:-100}
      SOAK_MAX_RSS_GROWTH_PCT: ${SOAK_MAX_RSS_GROWTH_PCT:-50}
      RABBITMQ_MGMT_URL: ${RABBITMQ_MGMT_URL:-http://rabbitmq:15672}
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-guest}
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE:-payment_events}
    volumes:
      - ../test/load:/scripts:ro
    depends_on:
      payment-gateway:
        condition: service_healthy
