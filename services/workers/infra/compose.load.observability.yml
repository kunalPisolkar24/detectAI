# Observability overlay for worker load tests.
# Applied ONLY when `make load-test WORKER=<name> WITH_OBSERVABILITY=1` is used:
#   docker compose -f infra/compose.load-<worker>.yml \
#                  -f ../../infra/docker/otel/loadtest-observability.yml \
#                  -f infra/compose.load.observability.yml up
# (-f paths resolve from services/workers; the volume paths below resolve from
# services/workers/infra, which is the project directory.)
# Default runs (WITH_OBSERVABILITY=0) stay fully offline: no collector, no
# network calls, unchanged behaviour.
#
# What it adds on the existing load project network:
# - otel-collector-loadtest (shared atom at
#   infra/docker/otel/loadtest-observability.yml): scrapes the worker's
#   /metrics endpoint, collects hostmetrics + container stats, and exports
#   traces/metrics/logs to New Relic EU with deployment.environment=loadtest.
# - redis-exporter + postgres-exporter (reusable atoms at
#   infra/docker/redis-exporter + infra/docker/postgres-exporter, merged via
#   extra `-f` flags in the Makefile): datastore depth for the Infra page of
#   the workers dashboard.
#
# The worker itself needs no override here: compose.analytics|cron|payments.yml
# already pass through OTEL_EXPORTER_OTLP_ENDPOINT, OTEL_SERVICE_NAME and
# OTEL_RESOURCE_ATTRIBUTES, and the Makefile sets those when the flag is on.
# That keeps this file worker-agnostic instead of one overlay per rig.
#
# The rabbitmq exporter lives in compose.load.rabbitmq.yml instead: it needs a
# broker with the management API, and the cron rig has no broker at all.
#
# Required env (shell only, never committed):
#   NEW_RELIC_LICENSE_KEY  ingest key (eu01...)
# Empty key = exporter retries and drops; the worker keeps processing (fail-open).
services:
  redis-exporter:
    environment:
      # The redis_exporter takes host/port in REDIS_ADDR and the password
      # separately; a credentials-in-URL REDIS_ADDR is not parsed by it.
      - REDIS_ADDR=redis://redis-users:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    depends_on:
      redis-users:
        condition: service_healthy
      otel-collector-loadtest:
        condition: service_started

  postgres-exporter:
    environment:
      # Built from the stack's parts rather than DATABASE_URL: the exporter
      # needs sslmode=disable (the rig's postgres has no TLS) and DATABASE_URL
      # carries no query string. Exiting on a bad DSN aborts the whole rig
      # (compose --abort-on-container-exit), so this must be right.
      - DATA_SOURCE_NAME=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-users:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      postgres-users:
        condition: service_healthy
      otel-collector-loadtest:
        condition: service_started

  otel-collector-loadtest:
    environment:
      # In-network target, never the host-bound port: the rig remaps host ports
      # (LOAD_WORKER_PORT) to keep rigs side by side, but container ports are
      # fixed per worker (7001 analytics / 7002 cron / 7003 payments).
      - OTEL_SCRAPE_JOB=${WORKER}
      - OTEL_SCRAPE_TARGET=worker-${WORKER}:${WORKER_METRICS_PORT}
      - OTEL_SCRAPE_METRICS_PATH=/metrics
      # Datastore exporters fill the collector's spare scrape slots. The job
      # name is what the dashboard filters on, so keep it aligned with the
      # datastore it reports for.
      - OTEL_SCRAPE_JOB_2=redis-users
      - OTEL_SCRAPE_TARGET_2=redis-exporter:9121
      - OTEL_SCRAPE_JOB_3=postgres-exporter
      - OTEL_SCRAPE_TARGET_3=postgres-exporter:9187
      # A short rig is torn down before a 15s scrape can close a metric
      # series, so the cron histograms never reach New Relic at 15s. 5s gives
      # every rig several samples; raise it for long runs.
      - OTEL_SCRAPE_INTERVAL=${OTEL_SCRAPE_INTERVAL:-5s}
    volumes:
      - ../../../infra/docker/otel/otel-collector-loadtest.yaml:/etc/otelcol/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
