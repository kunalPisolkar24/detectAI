# Payments worker stack: postgres-users + redis-users + redis-events + rabbitmq.
# redis-events is Paddle-only (paddle:evt:* 7d + payment:event:ts:* 30d,
# AOF + noeviction) — required here, nowhere else.
# Self-contained: own project/network/volumes (`name:` below), so one
# stack's up/down never disturbs another. Run with:
#   make worker-up WORKER=payments   # from services/workers
name: detect-ai-workers-payments

include:
  - path: ./compose.migrate.yml
  - path: ../../../infra/docker/postgres-users/standalone.yml
  - path: ../../../infra/docker/redis-users/standalone.yml
  - path: ../../../infra/docker/redis-events/standalone.yml
  - path: ../../../infra/docker/rabbitmq/standalone.yml

services:
  worker-payments:
    container_name: worker_payments
    build:
      context: ..
      dockerfile: Dockerfile
    restart: always
    command: ["bun", "run", "start:payments"]
    stop_grace_period: 35s
    environment:
      - NODE_ENV=${NODE_ENV}
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_URL_REPLICA=${DATABASE_URL_REPLICA}
      - REDIS_URL=${REDIS_URL}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_SENTINELS=${REDIS_SENTINELS}
      - REDIS_MASTER_NAME=${REDIS_MASTER_NAME}
      - REDIS_MODE=${REDIS_MODE:-standalone}
      - RABBITMQ_URL=${RABBITMQ_URL}
      - RABBITMQ_QUEUE_TYPE=${RABBITMQ_QUEUE_TYPE:-quorum}
      - PADDLE_API_KEY=${PADDLE_API_KEY}
      - PADDLE_ENVIRONMENT=${PADDLE_ENVIRONMENT:-sandbox}
      - EVENT_REDIS_URL=${EVENT_REDIS_URL}
      - EVENT_REDIS_MODE=${EVENT_REDIS_MODE:-standalone}
      - EVENT_REDIS_SENTINELS=${EVENT_REDIS_SENTINELS:-}
      - EVENT_REDIS_MASTER_NAME=${EVENT_REDIS_MASTER_NAME:-}
      - EVENT_REDIS_PASSWORD=${EVENT_REDIS_PASSWORD}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-worker-payments}
      - OTEL_TRACES_SAMPLER=${OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
      - OTEL_TRACES_SAMPLER_ARG=${OTEL_TRACES_SAMPLER_ARG:-0.1}
      - PORT=7003
    ports:
      - "${WORKER_PAYMENTS_PORT:-7003}:7003"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      postgres-users:
        condition: service_healthy
      redis-users:
        condition: service_healthy
      redis-events:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://localhost:7003/ready'); if (!r.ok) process.exit(1);"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
