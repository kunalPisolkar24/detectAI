# Analytics worker stack: postgres + redis-cache + rabbitmq.
# Usage events flow: web INCRs redis-cache, publishes analytics.usage;
# worker-analytics dedupes (redis-cache) and UPSERTs postgres Usage.
# Self-contained: own project/network/volumes (`name:` below), so one
# stack's up/down never disturbs another. Run with:
#   make worker-up WORKER=analytics   # from services/workers
name: detect-ai-workers-analytics

include:
  - path: ./compose.migrate.yml
  - path: ../../../infra/docker/postgres/standalone.yml
  - path: ../../../infra/docker/redis/standalone.yml
  - path: ../../../infra/docker/rabbitmq/standalone.yml

services:
  worker-analytics:
    container_name: worker_analytics
    build:
      context: ..
      dockerfile: Dockerfile
    restart: always
    command: ["bun", "run", "start:analytics"]
    stop_grace_period: 35s
    environment:
      - NODE_ENV=${NODE_ENV}
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_URL_REPLICA=${DATABASE_URL_REPLICA}
      - REDIS_URL=${REDIS_URL}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_SENTINELS=${REDIS_SENTINELS}
      - REDIS_MASTER_NAME=${REDIS_MASTER_NAME}
      - REDIS_MODE=${REDIS_MODE:-standalone}
      - RABBITMQ_URL=${RABBITMQ_URL}
      - RABBITMQ_QUEUE_TYPE=${RABBITMQ_QUEUE_TYPE:-quorum}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-worker-analytics}
      - OTEL_TRACES_SAMPLER=${OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
      - OTEL_TRACES_SAMPLER_ARG=${OTEL_TRACES_SAMPLER_ARG:-0.1}
      - PORT=7001
    ports:
      - "${WORKER_ANALYTICS_PORT:-7001}:7001"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis-app:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://localhost:7001/ready'); if (!r.ok) process.exit(1);"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
