# Cron worker service definition (datastores merged via -f, see Makefile).
# Subscription sweeper + usage resetter. Needs postgres-users + redis-users
# only — no queue, no events-redis.
#
# No depends_on gates on purpose: the worker boots degraded (liveness ok,
# readiness reflects dep state) and the loop catches per-iteration errors
# with a 60s cooldown, so it self-heals with zero restarts.
# Always boot via `make worker-up WORKER=cron` (from services/workers),
# which merges this file with the needed infra atoms.
name: detect-ai-workers-cron

services:
  worker-cron:
    container_name: worker_cron
    build:
      context: ..
      dockerfile: Dockerfile
    restart: always
    command: ["bun", "run", "start:cron"]
    stop_grace_period: 40s
    environment:
      - ENV_TYPE=${ENV_TYPE:-dev}
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_URL_REPLICA=${DATABASE_URL_REPLICA}
      - REDIS_URL=${REDIS_URL}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - CRON_CHECK_INTERVAL_MS=${CRON_CHECK_INTERVAL_MS:-900000}
      - CRON_BATCH_SIZE=${CRON_BATCH_SIZE:-100}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-worker-cron}
      - OTEL_TRACES_SAMPLER=${OTEL_TRACES_SAMPLER:-parentbased_always_on}
      - AWS_REGION=${AWS_REGION:-ap-south-1}
      - AWS_ENDPOINT_URL=${AWS_ENDPOINT_URL:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - WORKERS_SECRETS_NAME=${WORKERS_SECRETS_NAME:-}
      - MQ_SECRETS_NAME=${MQ_SECRETS_NAME:-}
      - SSM_PREFIX=${SSM_PREFIX:-}
      - SSM_ENABLED=${SSM_ENABLED:-}
      - PORT=7002
    ports:
      - "${WORKER_CRON_PORT:-7002}:7002"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://localhost:7002/health'); if (!r.ok) process.exit(1);"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
