# Cron worker stack (subscription sweeper + usage resetter).
# Needs postgres-users + redis-users only — no queue, no events-redis.
# Self-contained: own project/network/volumes (`name:` below), so one
# stack's up/down never disturbs another. Run with:
#   make worker-up WORKER=cron   # from services/workers
name: detect-ai-workers-cron

include:
  - path: ./compose.migrate.yml
  - path: ../../../infra/docker/postgres-users/standalone.yml
  - path: ../../../infra/docker/redis-users/standalone.yml

services:
  worker-cron:
    container_name: worker_cron
    build:
      context: ..
      dockerfile: Dockerfile
    restart: always
    command: ["bun", "run", "start:cron"]
    stop_grace_period: 40s
    environment:
      - NODE_ENV=${NODE_ENV}
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_URL_REPLICA=${DATABASE_URL_REPLICA}
      - REDIS_URL=${REDIS_URL}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_SENTINELS=${REDIS_SENTINELS}
      - REDIS_MASTER_NAME=${REDIS_MASTER_NAME}
      - REDIS_MODE=${REDIS_MODE:-standalone}
      - CRON_CHECK_INTERVAL_MS=${CRON_CHECK_INTERVAL_MS:-900000}
      - CRON_BATCH_SIZE=${CRON_BATCH_SIZE:-100}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-worker-cron}
      - OTEL_TRACES_SAMPLER=${OTEL_TRACES_SAMPLER:-parentbased_always_on}
      - PORT=7002
    ports:
      - "${WORKER_CRON_PORT:-7002}:7002"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      postgres-users:
        condition: service_healthy
      redis-users:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://localhost:7002/health'); if (!r.ok) process.exit(1);"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
