# Shared db-migrate fragment for the workers stacks.
# Included by compose.analytics.yml / compose.cron.yml / compose.payments.yml
# (single definition, no duplication). Runs `prisma migrate deploy` from
# workers/prisma before the worker starts.
services:
  db-migrate:
    build:
      context: ..
      dockerfile: Dockerfile
      target: migrate
    restart: "no"
    environment:
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
