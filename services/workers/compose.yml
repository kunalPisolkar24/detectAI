services:
  worker-analytics:
    container_name: worker_analytics
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    command: [ "bun", "run", "start:analytics" ]
    stop_grace_period: 35s
    environment:
      - NODE_ENV=${NODE_ENV}
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_URL_REPLICA=${DATABASE_URL_REPLICA}
      - REDIS_URL=${REDIS_URL}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_SENTINELS=${REDIS_SENTINELS}
      - REDIS_MASTER_NAME=${REDIS_MASTER_NAME}
      - REDIS_MODE=${REDIS_MODE:-standalone}
      - RABBITMQ_URL=${RABBITMQ_URL}
      - RABBITMQ_QUEUE_TYPE=${RABBITMQ_QUEUE_TYPE:-quorum}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-worker-analytics}
      - OTEL_TRACES_SAMPLER=${OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
      - OTEL_TRACES_SAMPLER_ARG=${OTEL_TRACES_SAMPLER_ARG:-0.1}
      - PORT=7001
    ports:
      - "${WORKER_ANALYTICS_PORT:-7001}:7001"
    networks:
      - detectai_net
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      postgres-primary:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "bun", "-e", "const r = await fetch('http://localhost:7001/ready'); if (!r.ok) process.exit(1);" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker-cron:
    container_name: worker_cron
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    command: [ "bun", "run", "start:cron" ]
    stop_grace_period: 40s
    environment:
      - NODE_ENV=${NODE_ENV}
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_URL_REPLICA=${DATABASE_URL_REPLICA}
      - REDIS_URL=${REDIS_URL}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_SENTINELS=${REDIS_SENTINELS}
      - REDIS_MASTER_NAME=${REDIS_MASTER_NAME}
      - REDIS_MODE=${REDIS_MODE:-standalone}
      - CRON_CHECK_INTERVAL_MS=${CRON_CHECK_INTERVAL_MS:-900000}
      - CRON_BATCH_SIZE=${CRON_BATCH_SIZE:-100}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-worker-cron}
      - OTEL_TRACES_SAMPLER=${OTEL_TRACES_SAMPLER:-parentbased_always_on}
      - PORT=7002
    ports:
      - "${WORKER_CRON_PORT:-7002}:7002"
    networks:
      - detectai_net
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      postgres-primary:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "bun", "-e", "const r = await fetch('http://localhost:7002/health'); if (!r.ok) process.exit(1);" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker-payments:
    container_name: worker_payments
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    command: [ "bun", "run", "start:payments" ]
    stop_grace_period: 35s
    environment:
      - NODE_ENV=${NODE_ENV}
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_URL_REPLICA=${DATABASE_URL_REPLICA}
      - REDIS_URL=${REDIS_URL}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_SENTINELS=${REDIS_SENTINELS}
      - REDIS_MASTER_NAME=${REDIS_MASTER_NAME}
      - REDIS_MODE=${REDIS_MODE:-standalone}
      - RABBITMQ_URL=${RABBITMQ_URL}
      - RABBITMQ_QUEUE_TYPE=${RABBITMQ_QUEUE_TYPE:-quorum}
      - PADDLE_API_KEY=${PADDLE_API_KEY}
      - PADDLE_ENVIRONMENT=${PADDLE_ENVIRONMENT}
      - EVENT_REDIS_URL=${EVENT_REDIS_URL}
      - EVENT_REDIS_MODE=${EVENT_REDIS_MODE:-standalone}
      - EVENT_REDIS_SENTINELS=${EVENT_REDIS_SENTINELS}
      - EVENT_REDIS_MASTER_NAME=${EVENT_REDIS_MASTER_NAME}
      - EVENT_REDIS_PASSWORD=${EVENT_REDIS_PASSWORD}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-worker-payments}
      - OTEL_TRACES_SAMPLER=${OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
      - OTEL_TRACES_SAMPLER_ARG=${OTEL_TRACES_SAMPLER_ARG:-0.1}
      - PORT=7003
    ports:
      - "${WORKER_PAYMENTS_PORT:-7003}:7003"
    networks:
      - detectai_net
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      postgres-primary:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "bun", "-e", "const r = await fetch('http://localhost:7003/ready'); if (!r.ok) process.exit(1);" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  detectai_net:
    name: ${detect_ai_network}
    external: true
