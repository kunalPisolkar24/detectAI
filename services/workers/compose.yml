services:
  worker-analytics:
    container_name: worker_analytics
    build: 
      context: .
      dockerfile: Dockerfile
    restart: always
    command: ["bun", "run", "start:analytics"]
    networks:
      - detectai_net

  worker-cron:
    container_name: worker_cron
    build: 
      context: .
      dockerfile: Dockerfile
    restart: always
    command: ["bun", "run", "start:cron"]
    networks:
      - detectai_net

  worker-payments:
    container_name: worker_payments
    build: 
      context: .
      dockerfile: Dockerfile
    restart: always
    command: ["bun", "run", "start:payments"]
    networks:
      - detectai_net

networks:
  detectai_net:
    name: detect_ai_network
    external: true