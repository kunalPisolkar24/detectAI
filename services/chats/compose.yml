services:
  chat-redis-1:
    image: redis:7.2
    container_name: chat_redis_1
    command: >
      redis-server  --port 7010  --cluster-enabled yes  --cluster-config-file nodes.conf  --cluster-node-timeout 5000  --appendonly yes  --cluster-announce-ip chat_redis_1 --cluster-announce-port 7010  --cluster-announce-bus-port 17010
    ports:
      - "7010:7010"
      - "17010:17010"
    volumes:
      - redis-chat-1-data:/data
    networks:
      - detectai_net

  chat-redis-2:
    image: redis:7.2
    container_name: chat_redis_2
    command: >
      redis-server  --port 7011  --cluster-enabled yes  --cluster-config-file nodes.conf  --cluster-node-timeout 5000  --appendonly yes  --cluster-announce-ip chat_redis_2 --cluster-announce-port 7011  --cluster-announce-bus-port 17011
    ports:
      - "7011:7011"
      - "17011:17011"
    volumes:
      - redis-chat-2-data:/data
    networks:
      - detectai_net

  chat-redis-3:
    image: redis:7.2
    container_name: chat_redis_3
    command: >
      redis-server  --port 7012  --cluster-enabled yes  --cluster-config-file nodes.conf  --cluster-node-timeout 5000  --appendonly yes  --cluster-announce-ip chat_redis_3 --cluster-announce-port 7012  --cluster-announce-bus-port 17012
    ports:
      - "7012:7012"
      - "17012:17012"
    volumes:
      - redis-chat-3-data:/data
    networks:
      - detectai_net

  chat-cluster-initiator:
    image: redis:7.2
    container_name: chat_redis_init
    depends_on:
      - chat-redis-1
      - chat-redis-2
      - chat-redis-3
    command: >
      bash -c "sleep 5 &&  redis-cli --cluster create  chat_redis_1:7010  chat_redis_2:7011  chat_redis_3:7012  --cluster-replicas 0 --cluster-yes"
    networks:
      - detectai_net

  chat-mongo-config:
    image: mongo:6.0
    container_name: chat_mongo_config
    command: mongod --configsvr --replSet configRS --bind_ip_all --port 27017
    volumes:
      - chat-mongo-config-db:/data/db
      - chat-mongo-config-data:/data/configdb
    networks:
      - detectai_net
    healthcheck:
      test: >
        bash -c "mongosh --quiet --eval 'try { rs.status().ok } catch (e) { rs.initiate({_id: \"configRS\", configsvr: true, members: [{_id: 0, host: \"chat_mongo_config:27017\"}]}).ok }'"
      interval: 10s
      start_period: 5s

  chat-mongo-shard-1:
    image: mongo:6.0
    container_name: chat_mongo_shard_1
    command: mongod --shardsvr --replSet shardRS1 --bind_ip_all --port 27017
    volumes:
      - chat-mongo-shard-1-data:/data/db
    networks:
      - detectai_net
    healthcheck:
      test: >
        bash -c "mongosh --quiet --eval 'try { rs.status().ok } catch (e) { rs.initiate({_id: \"shardRS1\", members: [{_id: 0, host: \"chat_mongo_shard_1:27017\"}]}).ok }'"
      interval: 10s
      start_period: 5s

  chat-mongo-shard-2:
    image: mongo:6.0
    container_name: chat_mongo_shard_2
    command: mongod --shardsvr --replSet shardRS2 --bind_ip_all --port 27017
    volumes:
      - chat-mongo-shard-2-data:/data/db
    networks:
      - detectai_net
    healthcheck:
      test: >
        bash -c "mongosh --quiet --eval 'try { rs.status().ok } catch (e) { rs.initiate({_id: \"shardRS2\", members: [{_id: 0, host: \"chat_mongo_shard_2:27017\"}]}).ok }'"
      interval: 10s
      start_period: 5s

  chat-mongo-shard-3:
    image: mongo:6.0
    container_name: chat_mongo_shard_3
    command: mongod --shardsvr --replSet shardRS3 --bind_ip_all --port 27017
    volumes:
      - chat-mongo-shard-3-data:/data/db
    networks:
      - detectai_net
    healthcheck:
      test: >
        bash -c "mongosh --quiet --eval 'try { rs.status().ok } catch (e) { rs.initiate({_id: \"shardRS3\", members: [{_id: 0, host: \"chat_mongo_shard_3:27017\"}]}).ok }'"
      interval: 10s
      start_period: 5s

  chat-mongo-router:
    image: mongo:6.0
    container_name: chat_mongo_router
    command: mongos --configdb configRS/chat_mongo_config:27017 --bind_ip_all --port 27017
    ports:
      - "27018:27017"
    networks:
      - detectai_net
    depends_on:
      chat-mongo-config:
        condition: service_healthy
      chat-mongo-shard-1:
        condition: service_healthy
      chat-mongo-shard-2:
        condition: service_healthy
      chat-mongo-shard-3:
        condition: service_healthy

  chat-mongo-init:
    image: mongo:6.0
    container_name: chat_mongo_init
    networks:
      - detectai_net
    depends_on:
      - chat-mongo-router
    command: >
      bash -c "
        sleep 10 &&
        mongosh --host chat_mongo_router:27017 --eval 'try { sh.addShard(\"shardRS1/chat_mongo_shard_1:27017\"); } catch(e) {}; try { sh.addShard(\"shardRS2/chat_mongo_shard_2:27017\"); } catch(e) {}; try { sh.addShard(\"shardRS3/chat_mongo_shard_3:27017\"); } catch(e) {}; try { sh.enableSharding(\"chat_db\"); } catch(e) {}; try { sh.shardCollection(\"chat_db.messages\", { chat_id: \"hashed\" }); } catch(e) {};'
      "

  chat-service:
    build: .
    container_name: chat_api
    environment:
      - APP_ENV=${CHAT_APP_ENV:-production}
      - SERVICE_ROLE=api
      - GRPC_PORT=${CHAT_GRPC_PORT:-:50051}
      - METRICS_PORT=${CHAT_METRICS_PORT:-:9091}
      - MONGO_URI=${CHAT_MONGO_URI:-mongodb://chat_mongo_router:27017}
      - MONGO_DATABASE=${CHAT_MONGO_DB:-chat_db}
      - REDIS_CLUSTER_ADDRS=${CHAT_REDIS_CLUSTER_ADDRS:-chat_redis_1:7010,chat_redis_2:7011,chat_redis_3:7012}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_POOL_SIZE=${CHAT_REDIS_POOL_SIZE:-100}
      - WORKER_CONCURRENCY=${CHAT_WORKER_CONCURRENCY:-10}
      - STREAM_PARTITION_COUNT=${CHAT_STREAM_PARTITION_COUNT:-16}
      - CACHE_TTL=${CHAT_CACHE_TTL:-24h}
      - BATCH_SIZE=${CHAT_BATCH_SIZE:-50}
    ports:
      - "50052:50051"
      - "9095:9091"
    depends_on:
      chat-mongo-init:
        condition: service_started
      chat-cluster-initiator:
        condition: service_started
    networks:
      - detectai_net
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9091/metrics" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  chat-worker:
    build: .
    container_name: chat_worker
    environment:
      - APP_ENV=${CHAT_APP_ENV:-production}
      - SERVICE_ROLE=worker
      - METRICS_PORT=${CHAT_WORKER_METRICS_PORT:-:9099}
      - MONGO_URI=${CHAT_MONGO_URI:-mongodb://chat_mongo_router:27017}
      - MONGO_DATABASE=${CHAT_MONGO_DB:-chat_db}
      - REDIS_CLUSTER_ADDRS=${CHAT_REDIS_CLUSTER_ADDRS:-chat_redis_1:7010,chat_redis_2:7011,chat_redis_3:7012}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_POOL_SIZE=${CHAT_REDIS_POOL_SIZE:-100}
      - WORKER_CONCURRENCY=${CHAT_WORKER_CONCURRENCY:-10}
      - BATCH_SIZE=${CHAT_BATCH_SIZE:-50}
      - STREAM_PARTITION_COUNT=${CHAT_STREAM_PARTITION_COUNT:-16}
      - CACHE_TTL=${CHAT_CACHE_TTL:-24h}
      - GRPC_PORT=${CHAT_GRPC_PORT:-:50051}
    ports:
      - "9099:9099"
    depends_on:
      chat-mongo-init:
        condition: service_started
      chat-cluster-initiator:
        condition: service_started
    networks:
      - detectai_net
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9099/metrics" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  redis-chat-1-data:
  redis-chat-2-data:
  redis-chat-3-data:
  chat-mongo-config-db:
  chat-mongo-config-data:
  chat-mongo-shard-1-data:
  chat-mongo-shard-2-data:
  chat-mongo-shard-3-data:


networks:
  detectai_net:
    name: ${detect_ai_network}
    external: true
