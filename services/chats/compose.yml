version: '3.8'

services:
  redis-node-1:
    image: redis:7.2
    container_name: chat_redis_1
    command: >
      redis-server 
      --port 7001 
      --cluster-enabled yes 
      --cluster-config-file nodes.conf 
      --cluster-node-timeout 5000 
      --appendonly yes 
      --cluster-announce-ip ${HOST_IP} 
      --cluster-announce-port 7001 
      --cluster-announce-bus-port 17001
    ports:
      - "7001:7001"
      - "17001:17001"
    volumes:
      - redis-chat-1-data:/data
    networks:
      - chat_net

  redis-node-2:
    image: redis:7.2
    container_name: chat_redis_2
    command: >
      redis-server 
      --port 7002 
      --cluster-enabled yes 
      --cluster-config-file nodes.conf 
      --cluster-node-timeout 5000 
      --appendonly yes 
      --cluster-announce-ip ${HOST_IP} 
      --cluster-announce-port 7002 
      --cluster-announce-bus-port 17002
    ports:
      - "7002:7002"
      - "17002:17002"
    volumes:
      - redis-chat-2-data:/data
    networks:
      - chat_net

  redis-node-3:
    image: redis:7.2
    container_name: chat_redis_3
    command: >
      redis-server 
      --port 7003 
      --cluster-enabled yes 
      --cluster-config-file nodes.conf 
      --cluster-node-timeout 5000 
      --appendonly yes 
      --cluster-announce-ip ${HOST_IP} 
      --cluster-announce-port 7003 
      --cluster-announce-bus-port 17003
    ports:
      - "7003:7003"
      - "17003:17003"
    volumes:
      - redis-chat-3-data:/data
    networks:
      - chat_net

  cluster-initiator:
    image: redis:7.2
    container_name: chat_redis_init
    depends_on:
      - redis-node-1
      - redis-node-2
      - redis-node-3
    command: >
      bash -c "sleep 5 && 
      redis-cli --cluster create 
      ${HOST_IP}:7001 
      ${HOST_IP}:7002 
      ${HOST_IP}:7003 
      --cluster-replicas 0 --cluster-yes"
    networks:
      - chat_net

  mongo-config:
    image: mongo:6.0
    container_name: chat_mongo_config
    command: mongod --configsvr --replSet configRS --bind_ip_all --port 27017
    networks:
      - chat_net
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "rs.initiate({_id: 'configRS', configsvr: true, members: [{_id: 0, host: 'mongo-config:27017'}]})" ]
      interval: 5s
      start_period: 5s

  mongo-shard:
    image: mongo:6.0
    container_name: chat_mongo_shard
    command: mongod --shardsvr --replSet shardRS --bind_ip_all --port 27017
    networks:
      - chat_net
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "rs.initiate({_id: 'shardRS', members: [{_id: 0, host: 'mongo-shard:27017'}]})" ]
      interval: 5s
      start_period: 5s

  mongo-router:
    image: mongo:6.0
    container_name: chat_mongo_router
    command: mongos --configdb configRS/mongo-config:27017 --bind_ip_all --port 27017
    ports:
      - "27017:27017"
    networks:
      - chat_net
    depends_on:
      mongo-config:
        condition: service_healthy
      mongo-shard:
        condition: service_healthy

  mongo-init:
    image: mongo:6.0
    container_name: chat_mongo_init
    networks:
      - chat_net
    depends_on:
      - mongo-router
    command: >
      bash -c "
        sleep 10 &&
        mongosh --host mongo-router:27017 --eval 'sh.addShard(\"shardRS/mongo-shard:27017\"); sh.enableSharding(\"chat_db\"); sh.shardCollection(\"chat_db.messages\", { chat_id: \"hashed\" });'
      "

volumes:
  redis-chat-1-data:
  redis-chat-2-data:
  redis-chat-3-data:

networks:
  chat_net:
    driver: bridge