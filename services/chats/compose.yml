networks:
  detectai_net:
    name: detect_ai_network
    external: true

services:
  redis-node-1:
    image: redis:7.2
    container_name: chat_redis_1
    command: >
      redis-server 
      --port 7001 
      --cluster-enabled yes 
      --cluster-config-file nodes.conf 
      --cluster-node-timeout 5000 
      --appendonly yes 
      --cluster-announce-ip chat_redis_1
      --cluster-announce-port 7001 
      --cluster-announce-bus-port 17001
    ports:
      - "7001:7001"
      - "17001:17001"
    volumes:
      - redis-chat-1-data:/data
    networks:
      - detectai_net

  redis-node-2:
    image: redis:7.2
    container_name: chat_redis_2
    command: >
      redis-server 
      --port 7002 
      --cluster-enabled yes 
      --cluster-config-file nodes.conf 
      --cluster-node-timeout 5000 
      --appendonly yes 
      --cluster-announce-ip chat_redis_2
      --cluster-announce-port 7002 
      --cluster-announce-bus-port 17002
    ports:
      - "7002:7002"
      - "17002:17002"
    volumes:
      - redis-chat-2-data:/data
    networks:
      - detectai_net

  redis-node-3:
    image: redis:7.2
    container_name: chat_redis_3
    command: >
      redis-server 
      --port 7003 
      --cluster-enabled yes 
      --cluster-config-file nodes.conf 
      --cluster-node-timeout 5000 
      --appendonly yes 
      --cluster-announce-ip chat_redis_3
      --cluster-announce-port 7003 
      --cluster-announce-bus-port 17003
    ports:
      - "7003:7003"
      - "17003:17003"
    volumes:
      - redis-chat-3-data:/data
    networks:
      - detectai_net

  cluster-initiator:
    image: redis:7.2
    container_name: chat_redis_init
    depends_on:
      - redis-node-1
      - redis-node-2
      - redis-node-3
    command: >
      bash -c "sleep 5 && 
      redis-cli --cluster create 
      chat_redis_1:7001 
      chat_redis_2:7002 
      chat_redis_3:7003 
      --cluster-replicas 0 --cluster-yes"
    networks:
      - detectai_net

  mongo-config:
    image: mongo:6.0
    container_name: chat_mongo_config
    command: mongod --configsvr --replSet configRS --bind_ip_all --port 27017
    networks:
      - detectai_net
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "rs.initiate({_id: 'configRS', configsvr: true, members: [{_id: 0, host: 'chat_mongo_config:27017'}]})" ]
      interval: 5s
      start_period: 5s

  mongo-shard:
    image: mongo:6.0
    container_name: chat_mongo_shard
    command: mongod --shardsvr --replSet shardRS --bind_ip_all --port 27017
    networks:
      - detectai_net
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "rs.initiate({_id: 'shardRS', members: [{_id: 0, host: 'chat_mongo_shard:27017'}]})" ]
      interval: 5s
      start_period: 5s

  mongo-router:
    image: mongo:6.0
    container_name: chat_mongo_router
    command: mongos --configdb configRS/chat_mongo_config:27017 --bind_ip_all --port 27017
    ports:
      - "27017:27017"
    networks:
      - detectai_net
    depends_on:
      mongo-config:
        condition: service_healthy
      mongo-shard:
        condition: service_healthy

  mongo-init:
    image: mongo:6.0
    container_name: chat_mongo_init
    networks:
      - detectai_net
    depends_on:
      - mongo-router
    command: >
      bash -c "
        sleep 10 &&
        mongosh --host chat_mongo_router:27017 --eval 'sh.addShard(\"shardRS/chat_mongo_shard:27017\"); sh.enableSharding(\"chat_db\"); sh.shardCollection(\"chat_db.messages\", { chat_id: \"hashed\" });'
      "

  chat-service:
    build: .
    container_name: chat_api
    environment:
      - APP_ENV=production
      - SERVICE_ROLE=api
      - GRPC_PORT=:50051
      - METRICS_PORT=:9091
      - MONGO_URI=mongodb://chat_mongo_router:27017
      - MONGO_DATABASE=chat_db
      - REDIS_CLUSTER_ADDRS=chat_redis_1:7001,chat_redis_2:7002,chat_redis_3:7003
      - WORKER_CONCURRENCY=10
      - STREAM_PARTITION_COUNT=16
    ports:
      - "50051:50051"
      - "9091:9091"
    depends_on:
      mongo-init:
        condition: service_started
      cluster-initiator:
        condition: service_started
    networks:
      - detectai_net

  chat-worker:
    build: .
    container_name: chat_worker
    environment:
      - APP_ENV=production
      - SERVICE_ROLE=worker
      - METRICS_PORT=:9099
      - MONGO_URI=mongodb://chat_mongo_router:27017
      - MONGO_DATABASE=chat_db
      - REDIS_CLUSTER_ADDRS=chat_redis_1:7001,chat_redis_2:7002,chat_redis_3:7003
      - BATCH_SIZE=50
      - STREAM_PARTITION_COUNT=16
    ports:
      - "9099:9099"
    depends_on:
      mongo-init:
        condition: service_started
      cluster-initiator:
        condition: service_started
    networks:
      - detectai_net

volumes:
  redis-chat-1-data:
  redis-chat-2-data:
  redis-chat-3-data: