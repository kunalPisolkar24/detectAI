# Chats service-only stack for prod/Floci (no bundled infra).
# Datastores come from Terraform (Floci/LocalStack or real AWS) via
# Secrets Manager + SSM; point MONGO_URI/CHAT_REDIS_ADDR at Floci outputs.
# Usage:
#   docker compose -f services/chats/infra/compose.prod.yml up -d --build
# Top-level prod uses the same shape (see infra/docker/prod/compose.yml).
name: chats-prod

services:
  chat-service:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: always
    environment:
      ENV_TYPE: ${ENV_TYPE:-prod}
      SERVICE_ROLE: api
      GRPC_PORT: ${GRPC_PORT:-}
      METRICS_PORT: ${METRICS_PORT:-}
      MONGO_URI: ${MONGO_URI:-}
      MONGO_DATABASE: ${MONGO_DATABASE:-}
      MONGO_MODE: ${MONGO_MODE:-}
      MONGO_TLS_ENABLED: ${MONGO_TLS_ENABLED:-}
      MONGO_TLS_CA_FILE: ${MONGO_TLS_CA_FILE:-}
      MONGO_MAX_POOL_SIZE: ${MONGO_MAX_POOL_SIZE:-}
      MONGO_MIN_POOL_SIZE: ${MONGO_MIN_POOL_SIZE:-}
      MONGO_SERVER_SELECTION_TIMEOUT: ${MONGO_SERVER_SELECTION_TIMEOUT:-}
      CHAT_REDIS_ADDR: ${CHAT_REDIS_ADDR:-}
      REDIS_URL: ${REDIS_URL:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_TLS_ENABLED: ${REDIS_TLS_ENABLED:-}
      REDIS_TLS_CA_FILE: ${REDIS_TLS_CA_FILE:-}
      REDIS_POOL_SIZE: ${REDIS_POOL_SIZE:-}
      BATCH_SIZE: ${BATCH_SIZE:-}
      STREAM_PARTITION_COUNT: ${STREAM_PARTITION_COUNT:-}
      CACHE_TTL: ${CACHE_TTL:-}
      LOG_LEVEL: ${LOG_LEVEL:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-}
      SSM_PREFIX: ${SSM_PREFIX:-}
      SSM_ENABLED: ${SSM_ENABLED:-}
      DOCDB_URLS_SECRET_NAME: ${DOCDB_URLS_SECRET_NAME:-}
      REDIS_URLS_SECRET_NAME: ${REDIS_URLS_SECRET_NAME:-}
    ports:
      - "${CHAT_GRPC_HOST_PORT:-50052}:50051"
      - "${CHAT_METRICS_HOST_PORT:-9095}:9091"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9091/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  chat-worker:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: always
    environment:
      ENV_TYPE: ${ENV_TYPE:-prod}
      SERVICE_ROLE: worker
      GRPC_PORT: ${GRPC_PORT:-}
      METRICS_PORT: ${WORKER_METRICS_PORT:-:9099}
      MONGO_URI: ${MONGO_URI:-}
      MONGO_DATABASE: ${MONGO_DATABASE:-}
      MONGO_MODE: ${MONGO_MODE:-}
      MONGO_TLS_ENABLED: ${MONGO_TLS_ENABLED:-}
      MONGO_TLS_CA_FILE: ${MONGO_TLS_CA_FILE:-}
      MONGO_MAX_POOL_SIZE: ${MONGO_MAX_POOL_SIZE:-}
      MONGO_MIN_POOL_SIZE: ${MONGO_MIN_POOL_SIZE:-}
      MONGO_SERVER_SELECTION_TIMEOUT: ${MONGO_SERVER_SELECTION_TIMEOUT:-}
      CHAT_REDIS_ADDR: ${CHAT_REDIS_ADDR:-}
      REDIS_URL: ${REDIS_URL:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_TLS_ENABLED: ${REDIS_TLS_ENABLED:-}
      REDIS_TLS_CA_FILE: ${REDIS_TLS_CA_FILE:-}
      REDIS_POOL_SIZE: ${REDIS_POOL_SIZE:-}
      BATCH_SIZE: ${BATCH_SIZE:-}
      STREAM_PARTITION_COUNT: ${STREAM_PARTITION_COUNT:-}
      CACHE_TTL: ${CACHE_TTL:-}
      LOG_LEVEL: ${LOG_LEVEL:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-}
      SSM_PREFIX: ${SSM_PREFIX:-}
      SSM_ENABLED: ${SSM_ENABLED:-}
      DOCDB_URLS_SECRET_NAME: ${DOCDB_URLS_SECRET_NAME:-}
      REDIS_URLS_SECRET_NAME: ${REDIS_URLS_SECRET_NAME:-}
    ports:
      - "${CHAT_WORKER_METRICS_PORT_HOST:-9099}:9099"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9099/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
