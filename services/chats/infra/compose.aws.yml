name: chats-aws
services:
  chat-service:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${CHAT_APP_ENV:-production}
      SERVICE_ROLE: api
      GRPC_PORT: ${CHAT_GRPC_PORT:-:50051}
      METRICS_PORT: ${CHAT_METRICS_PORT:-:9091}
      MONGO_URI: ${MONGO_URI:?set MONGO_URI from detectai/docdb/urls}
      MONGO_DATABASE: ${MONGO_DATABASE:-chat_db}
      MONGO_MODE: ${MONGO_MODE:-standalone}
      MONGO_TLS_ENABLED: ${MONGO_TLS_ENABLED:-true}
      MONGO_TLS_CA_FILE: ${MONGO_TLS_CA_FILE:-/certs/rds-combined-ca-bundle.pem}
      MONGO_MAX_POOL_SIZE: ${MONGO_MAX_POOL_SIZE:-100}
      MONGO_MIN_POOL_SIZE: ${MONGO_MIN_POOL_SIZE:-10}
      MONGO_SERVER_SELECTION_TIMEOUT: ${MONGO_SERVER_SELECTION_TIMEOUT:-5s}
      CHAT_REDIS_ADDR: ${CHAT_REDIS_ADDR:?set CHAT_REDIS_ADDR from detectai/redis/chat/urls}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD from detectai/redis/chat/urls}
      REDIS_TLS_ENABLED: ${REDIS_TLS_ENABLED:-true}
      REDIS_TLS_CA_FILE: ${REDIS_TLS_CA_FILE:-}
      REDIS_POOL_SIZE: ${REDIS_POOL_SIZE:-100}
      BATCH_SIZE: ${BATCH_SIZE:-50}
      STREAM_PARTITION_COUNT: ${STREAM_PARTITION_COUNT:-16}
      CACHE_TTL: ${CACHE_TTL:-24h}
    volumes:
      - ${CA_BUNDLE_DIR:-./certs}:/certs:ro
  chat-worker:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${CHAT_APP_ENV:-production}
      SERVICE_ROLE: worker
      METRICS_PORT: ${CHAT_WORKER_METRICS_PORT:-:9099}
      MONGO_URI: ${MONGO_URI:?set MONGO_URI from detectai/docdb/urls}
      MONGO_DATABASE: ${MONGO_DATABASE:-chat_db}
      MONGO_MODE: ${MONGO_MODE:-standalone}
      MONGO_TLS_ENABLED: ${MONGO_TLS_ENABLED:-true}
      MONGO_TLS_CA_FILE: ${MONGO_TLS_CA_FILE:-/certs/rds-combined-ca-bundle.pem}
      CHAT_REDIS_ADDR: ${CHAT_REDIS_ADDR:?set CHAT_REDIS_ADDR from detectai/redis/chat/urls}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD from detectai/redis/chat/urls}
      REDIS_TLS_ENABLED: ${REDIS_TLS_ENABLED:-true}
      REDIS_TLS_CA_FILE: ${REDIS_TLS_CA_FILE:-}
      REDIS_POOL_SIZE: ${REDIS_POOL_SIZE:-100}
      BATCH_SIZE: ${BATCH_SIZE:-50}
      STREAM_PARTITION_COUNT: ${STREAM_PARTITION_COUNT:-16}
      CACHE_TTL: ${CACHE_TTL:-24h}
    volumes:
      - ${CA_BUNDLE_DIR:-./certs}:/certs:ro
