# Standalone chats stack (single mongo + single redis, no HA).
# Datastores are importable atoms (same pattern as rabbitmq/redis/postgres).
# Usage (from repo root or services/chats):
#   docker compose -f services/chats/infra/compose.yml up -d --build
include:
  - path: ../../../infra/docker/chat-mongo/standalone.yml
  - path: ../../../infra/docker/chat-redis/standalone.yml

services:
  chat-mongo:
    ports:
      - "${CHAT_MONGO_PORT:-27018}:27017"
  chat-redis:
    ports:
      - "${CHAT_REDIS_PORT:-6381}:6379"

  chat-service:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${CHAT_APP_ENV:-production}
      SERVICE_ROLE: api
      GRPC_PORT: ${CHAT_GRPC_PORT:-:50051}
      METRICS_PORT: ${CHAT_METRICS_PORT:-:9091}
      MONGO_URI: ${CHAT_MONGO_URI:-mongodb://chat-mongo:27017}
      MONGO_DATABASE: ${CHAT_MONGO_DB:-chat_db}
      CHAT_REDIS_MODE: ${CHAT_REDIS_MODE:-standalone}
      CHAT_REDIS_ADDRS: ${CHAT_REDIS_ADDRS:-chat-redis:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_POOL_SIZE: ${CHAT_REDIS_POOL_SIZE:-25}
      BATCH_SIZE: ${CHAT_BATCH_SIZE:-25}
      STREAM_PARTITION_COUNT: ${CHAT_STREAM_PARTITION_COUNT:-4}
      CACHE_TTL: ${CHAT_CACHE_TTL:-24h}
    ports:
      - "${CHAT_GRPC_HOST_PORT:-50052}:50051"
      - "${CHAT_METRICS_HOST_PORT:-9095}:9091"
    depends_on:
      chat-mongo:
        condition: service_healthy
      chat-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9091/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  chat-worker:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${CHAT_APP_ENV:-production}
      SERVICE_ROLE: worker
      GRPC_PORT: ${CHAT_GRPC_PORT:-:50051}
      METRICS_PORT: ${CHAT_WORKER_METRICS_PORT:-:9099}
      MONGO_URI: ${CHAT_MONGO_URI:-mongodb://chat-mongo:27017}
      MONGO_DATABASE: ${CHAT_MONGO_DB:-chat_db}
      CHAT_REDIS_MODE: ${CHAT_REDIS_MODE:-standalone}
      CHAT_REDIS_ADDRS: ${CHAT_REDIS_ADDRS:-chat-redis:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_POOL_SIZE: ${CHAT_REDIS_POOL_SIZE:-25}
      BATCH_SIZE: ${CHAT_BATCH_SIZE:-25}
      STREAM_PARTITION_COUNT: ${CHAT_STREAM_PARTITION_COUNT:-4}
      CACHE_TTL: ${CHAT_CACHE_TTL:-24h}
    ports:
      - "${CHAT_WORKER_METRICS_PORT_HOST:-9099}:9099"
    depends_on:
      chat-mongo:
        condition: service_healthy
      chat-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9099/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
