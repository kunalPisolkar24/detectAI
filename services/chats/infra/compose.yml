# Standalone chats stack (single mongo + single redis, no HA).
# Datastores are importable atoms (same pattern as gateway/workers/inference).
# Usage (from repo root or services/chats):
#   docker compose -f services/chats/infra/compose.yml up -d --build
# ENV_TYPE=dev uses env/compose defaults; ENV_TYPE=prod pulls from AWS
# Secrets Manager (detectai/docdb/urls + detectai/redis/chat/urls) + SSM /detectai/chat/.
name: chats
include:
  - path: ../../../infra/docker/mongo-chat/standalone.yml
  - path: ../../../infra/docker/redis-chat/standalone.yml

services:
  mongo-chat:
    ports:
      - "${MONGO_CHAT_PORT:-27018}:27017"
  redis-chat:
    ports:
      - "${REDIS_CHAT_PORT:-6381}:6379"

  chat-service:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ENV_TYPE: ${ENV_TYPE:-dev}
      SERVICE_ROLE: api
      GRPC_PORT: ${GRPC_PORT:-}
      METRICS_PORT: ${METRICS_PORT:-}
      MONGO_URI: ${MONGO_URI:-}
      MONGO_DATABASE: ${MONGO_DATABASE:-}
      MONGO_MODE: ${MONGO_MODE:-}
      MONGO_TLS_ENABLED: ${MONGO_TLS_ENABLED:-}
      MONGO_TLS_CA_FILE: ${MONGO_TLS_CA_FILE:-}
      MONGO_MAX_POOL_SIZE: ${MONGO_MAX_POOL_SIZE:-}
      MONGO_MIN_POOL_SIZE: ${MONGO_MIN_POOL_SIZE:-}
      MONGO_SERVER_SELECTION_TIMEOUT: ${MONGO_SERVER_SELECTION_TIMEOUT:-}
      CHAT_REDIS_ADDR: ${CHAT_REDIS_ADDR:-}
      REDIS_URL: ${REDIS_URL:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-${REDIS_CHAT_PASSWORD:-test_redis_password}}
      REDIS_TLS_ENABLED: ${REDIS_TLS_ENABLED:-}
      REDIS_TLS_CA_FILE: ${REDIS_TLS_CA_FILE:-}
      REDIS_POOL_SIZE: ${REDIS_POOL_SIZE:-}
      BATCH_SIZE: ${BATCH_SIZE:-}
      STREAM_PARTITION_COUNT: ${STREAM_PARTITION_COUNT:-}
      CACHE_TTL: ${CACHE_TTL:-}
      LOG_LEVEL: ${LOG_LEVEL:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-}
      SSM_PREFIX: ${SSM_PREFIX:-}
      SSM_ENABLED: ${SSM_ENABLED:-}
      DOCDB_URLS_SECRET_NAME: ${DOCDB_URLS_SECRET_NAME:-}
      REDIS_URLS_SECRET_NAME: ${REDIS_URLS_SECRET_NAME:-}
    ports:
      - "${CHAT_GRPC_HOST_PORT:-50052}:50051"
      - "${CHAT_METRICS_HOST_PORT:-9095}:9091"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mongo-chat:
        condition: service_healthy
      redis-chat:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9091/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  chat-worker:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ENV_TYPE: ${ENV_TYPE:-dev}
      SERVICE_ROLE: worker
      GRPC_PORT: ${GRPC_PORT:-}
      METRICS_PORT: ${WORKER_METRICS_PORT:-:9099}
      MONGO_URI: ${MONGO_URI:-}
      MONGO_DATABASE: ${MONGO_DATABASE:-}
      MONGO_MODE: ${MONGO_MODE:-}
      MONGO_TLS_ENABLED: ${MONGO_TLS_ENABLED:-}
      MONGO_TLS_CA_FILE: ${MONGO_TLS_CA_FILE:-}
      MONGO_MAX_POOL_SIZE: ${MONGO_MAX_POOL_SIZE:-}
      MONGO_MIN_POOL_SIZE: ${MONGO_MIN_POOL_SIZE:-}
      MONGO_SERVER_SELECTION_TIMEOUT: ${MONGO_SERVER_SELECTION_TIMEOUT:-}
      CHAT_REDIS_ADDR: ${CHAT_REDIS_ADDR:-}
      REDIS_URL: ${REDIS_URL:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-${REDIS_CHAT_PASSWORD:-test_redis_password}}
      REDIS_TLS_ENABLED: ${REDIS_TLS_ENABLED:-}
      REDIS_TLS_CA_FILE: ${REDIS_TLS_CA_FILE:-}
      REDIS_POOL_SIZE: ${REDIS_POOL_SIZE:-}
      BATCH_SIZE: ${BATCH_SIZE:-}
      STREAM_PARTITION_COUNT: ${STREAM_PARTITION_COUNT:-}
      CACHE_TTL: ${CACHE_TTL:-}
      LOG_LEVEL: ${LOG_LEVEL:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-}
      SSM_PREFIX: ${SSM_PREFIX:-}
      SSM_ENABLED: ${SSM_ENABLED:-}
      DOCDB_URLS_SECRET_NAME: ${DOCDB_URLS_SECRET_NAME:-}
      REDIS_URLS_SECRET_NAME: ${REDIS_URLS_SECRET_NAME:-}
    ports:
      - "${CHAT_WORKER_METRICS_PORT_HOST:-9099}:9099"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mongo-chat:
        condition: service_healthy
      redis-chat:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9099/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
