# Standalone chats stack (single mongo + single redis, no HA).
# This is the non-HA variant for local testing.
# Usage (from repo root or services/chats):
#   docker compose -f services/chats/infra/compose.standalone.yml up -d --build
# For HA (sharded mongo + cluster redis): docker compose -f services/chats/compose.yml up -d

services:
  chat-mongo:
    image: mongo:6.0
    restart: unless-stopped
    command: mongod --bind_ip_all --port 27017
    ports:
      - "27018:27017"
    volumes:
      - chat_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis-chat:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_chat_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  chat-service:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${CHAT_APP_ENV:-production}
      SERVICE_ROLE: api
      GRPC_PORT: ${CHAT_GRPC_PORT:-:50051}
      METRICS_PORT: ${CHAT_METRICS_PORT:-:9091}
      MONGO_URI: ${CHAT_MONGO_URI:-mongodb://chat-mongo:27017}
      MONGO_DATABASE: ${CHAT_MONGO_DB:-chat_db}
      CHAT_REDIS_MODE: ${CHAT_REDIS_MODE:-standalone}
      CHAT_REDIS_ADDRS: ${CHAT_REDIS_ADDRS:-redis-chat:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_POOL_SIZE: ${CHAT_REDIS_POOL_SIZE:-25}
      BATCH_SIZE: ${CHAT_BATCH_SIZE:-25}
      STREAM_PARTITION_COUNT: ${CHAT_STREAM_PARTITION_COUNT:-4}
      CACHE_TTL: ${CHAT_CACHE_TTL:-24h}
    ports:
      - "50052:50051"
      - "9095:9091"
    depends_on:
      chat-mongo:
        condition: service_healthy
      redis-chat:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9091/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  chat-worker:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${CHAT_APP_ENV:-production}
      SERVICE_ROLE: worker
      GRPC_PORT: ${CHAT_GRPC_PORT:-:50051}
      METRICS_PORT: ${CHAT_WORKER_METRICS_PORT:-:9099}
      MONGO_URI: ${CHAT_MONGO_URI:-mongodb://chat-mongo:27017}
      MONGO_DATABASE: ${CHAT_MONGO_DB:-chat_db}
      CHAT_REDIS_MODE: ${CHAT_REDIS_MODE:-standalone}
      CHAT_REDIS_ADDRS: ${CHAT_REDIS_ADDRS:-redis-chat:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_POOL_SIZE: ${CHAT_REDIS_POOL_SIZE:-25}
      BATCH_SIZE: ${CHAT_BATCH_SIZE:-25}
      STREAM_PARTITION_COUNT: ${CHAT_STREAM_PARTITION_COUNT:-4}
      CACHE_TTL: ${CHAT_CACHE_TTL:-24h}
    ports:
      - "9099:9099"
    depends_on:
      chat-mongo:
        condition: service_healthy
      redis-chat:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9099/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  chat_mongo_data:
  redis_chat_data:
