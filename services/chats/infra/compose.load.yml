name: chats-load

include:
  - compose.yml
  - compose.k6.yml

services:
  chats:
    container_name: chats-load
    restart: "no"
    ports: !override []
    environment:
      ENV_TYPE: dev
    healthcheck:
      test: ["CMD", "/app/healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks:
      - loadnet

  k6:
    depends_on:
      chats:
        condition: service_healthy

networks:
  loadnet:
