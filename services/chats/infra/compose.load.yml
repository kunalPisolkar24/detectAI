# Load-test rig for chats service (k6 only, isolated infra).
# Reuses mongo-chat/redis-chat atoms but with no host ports for datastores, so it can run
# side-by-side with the main stack (`compose.yml` publishes 27018/6381).
# Usage: make load-test SCENARIO=smoke VUS=1 DURATION=10s RPS=10
name: chats-load
include:
  - path: ../../../infra/docker/mongo-chat/standalone.yml
  - path: ../../../infra/docker/redis-chat/standalone.yml

services:
  # mongo-chat/redis-chat atoms have no host ports by default (template has no ports);
  # `compose.yml` publishes 27018/6381, load keeps internal-only for isolation
  mongo-chat:
    networks:
      - chat_loadnet

  redis-chat:
    networks:
      - chat_loadnet

  chat-service:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ENV_TYPE: ${ENV_TYPE:-dev}
      SERVICE_ROLE: api
      GRPC_PORT: ${GRPC_PORT:-:50051}
      METRICS_PORT: ${METRICS_PORT:-:9091}
      MONGO_URI: ${MONGO_URI:-mongodb://mongo-chat:27017}
      MONGO_DATABASE: ${MONGO_DATABASE:-chat_db}
      MONGO_MODE: ${MONGO_MODE:-standalone}
      CHAT_REDIS_ADDR: ${CHAT_REDIS_ADDR:-redis-chat:6379}
      REDIS_URL: ${REDIS_URL:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-test_redis_password}
      REDIS_TLS_ENABLED: ${REDIS_TLS_ENABLED:-false}
      REDIS_POOL_SIZE: ${REDIS_POOL_SIZE:-25}
      BATCH_SIZE: ${BATCH_SIZE:-25}
      STREAM_PARTITION_COUNT: ${STREAM_PARTITION_COUNT:-4}
      CACHE_TTL: ${CACHE_TTL:-24h}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-chat-service}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
    depends_on:
      mongo-chat:
        condition: service_healthy
      redis-chat:
        condition: service_healthy
    networks:
      - chat_loadnet
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9091/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  chat-worker:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ENV_TYPE: ${ENV_TYPE:-dev}
      SERVICE_ROLE: worker
      GRPC_PORT: ${GRPC_PORT:-:50051}
      METRICS_PORT: ${WORKER_METRICS_PORT:-:9099}
      MONGO_URI: ${MONGO_URI:-mongodb://mongo-chat:27017}
      MONGO_DATABASE: ${MONGO_DATABASE:-chat_db}
      MONGO_MODE: ${MONGO_MODE:-standalone}
      CHAT_REDIS_ADDR: ${CHAT_REDIS_ADDR:-redis-chat:6379}
      REDIS_URL: ${REDIS_URL:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-test_redis_password}
      REDIS_TLS_ENABLED: ${REDIS_TLS_ENABLED:-false}
      REDIS_POOL_SIZE: ${REDIS_POOL_SIZE:-25}
      BATCH_SIZE: ${BATCH_SIZE:-25}
      STREAM_PARTITION_COUNT: ${STREAM_PARTITION_COUNT:-4}
      CACHE_TTL: ${CACHE_TTL:-24h}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-chat-service}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
    depends_on:
      mongo-chat:
        condition: service_healthy
      redis-chat:
        condition: service_healthy
    networks:
      - chat_loadnet
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9099/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  k6:
    image: grafana/k6:latest
    command: run /scripts/scenarios/${SCENARIO:-smoke}.js
    environment:
      CHAT_SERVICE_ADDR: chat-service:50051
      PROTO_DIR: /proto
      # single-knob overrides (generic wins, per-scenario vars kept as fallback in config.js)
      VUS: ${VUS:-}
      DURATION: ${DURATION:-}
      RPS: ${RPS:-}
      SMOKE_VUS: ${SMOKE_VUS:-}
      SMOKE_DURATION: ${SMOKE_DURATION:-}
      LOAD_VUS: ${LOAD_VUS:-}
      LOAD_DURATION: ${LOAD_DURATION:-}
      STRESS_VUS: ${STRESS_VUS:-}
      STRESS_DURATION: ${STRESS_DURATION:-}
      SOAK_VUS: ${SOAK_VUS:-}
      SOAK_DURATION: ${SOAK_DURATION:-}
    volumes:
      - ../tests/load:/scripts:ro
      - ../api/proto:/proto:ro
    depends_on:
      chat-service:
        condition: service_healthy
    networks:
      - chat_loadnet

networks:
  chat_loadnet:

volumes:
  mongo_chat_data:
    name: chat_load_mongo_data
  redis_chat_data:
    name: chat_load_redis_data
