[service]
slug = "chats"

[secrets]
keys = ["NEW_RELIC_LICENSE_KEY"]

[secrets.min_lengths]
NEW_RELIC_LICENSE_KEY = 16

[requires]
"OTEL_EXPORTER_OTLP_ENDPOINT" = ["NEW_RELIC_LICENSE_KEY", 16]

[ssm]
keys = [
    "PORT",
    "DRAIN_TIMEOUT",
    "OTEL_EXPORTER_OTLP_ENDPOINT",
    "OTEL_SERVICE_NAME",
    "OTEL_SERVICE_VERSION",
    "OTEL_TRACE_SAMPLE_RATIO",
]
