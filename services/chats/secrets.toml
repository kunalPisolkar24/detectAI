[service]
slug = "chats"

[secrets]
keys = ["NEW_RELIC_LICENSE_KEY", "MONGO_URI", "REDIS_AUTH_TOKEN"]

[secrets.min_lengths]
NEW_RELIC_LICENSE_KEY = 16
MONGO_URI = 16
REDIS_AUTH_TOKEN = 16

[requires]
"OTEL_EXPORTER_OTLP_ENDPOINT" = ["NEW_RELIC_LICENSE_KEY", 16]

[ssm]
keys = [
    "PORT",
    "DRAIN_TIMEOUT",
    "MONGO_DATABASE",
    "REDIS_ENDPOINT",
    "OTEL_EXPORTER_OTLP_ENDPOINT",
    "OTEL_SERVICE_NAME",
    "OTEL_SERVICE_VERSION",
    "OTEL_TRACE_SAMPLE_RATIO",
]
