services:
  chat-service:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: chat_api
    restart: unless-stopped
    environment:
      - APP_ENV=${CHAT_APP_ENV:-production}
      - SERVICE_ROLE=api
      - GRPC_PORT=${CHAT_GRPC_PORT:-:50051}
      - METRICS_PORT=${CHAT_METRICS_PORT:-:9091}
      - MONGO_URI=${CHAT_MONGO_URI:-mongodb://chat_mongo_router:27017}
      - MONGO_DATABASE=${CHAT_MONGO_DB:-chat_db}
      - CHAT_REDIS_MODE=${CHAT_REDIS_MODE:-cluster}
      - CHAT_REDIS_ADDRS=${CHAT_REDIS_ADDRS:-chat_redis_1:7010,chat_redis_2:7011,chat_redis_3:7012}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_POOL_SIZE=${CHAT_REDIS_POOL_SIZE:-100}
      - WORKER_CONCURRENCY=${CHAT_WORKER_CONCURRENCY:-10}
      - STREAM_PARTITION_COUNT=${CHAT_STREAM_PARTITION_COUNT:-16}
      - CACHE_TTL=${CHAT_CACHE_TTL:-24h}
      - BATCH_SIZE=${CHAT_BATCH_SIZE:-50}
    ports:
      - "50052:50051"
      - "9095:9091"
    networks:
      - detectai_net
    depends_on:
      chat-mongo-init:
        condition: service_started
      chat-redis-cluster-init:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9091/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  chat-worker:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: chat_worker
    restart: unless-stopped
    environment:
      - APP_ENV=${CHAT_APP_ENV:-production}
      - SERVICE_ROLE=worker
      - GRPC_PORT=${CHAT_GRPC_PORT:-:50051}
      - METRICS_PORT=${CHAT_WORKER_METRICS_PORT:-:9099}
      - MONGO_URI=${CHAT_MONGO_URI:-mongodb://chat_mongo_router:27017}
      - MONGO_DATABASE=${CHAT_MONGO_DB:-chat_db}
      - CHAT_REDIS_MODE=${CHAT_REDIS_MODE:-cluster}
      - CHAT_REDIS_ADDRS=${CHAT_REDIS_ADDRS:-chat_redis_1:7010,chat_redis_2:7011,chat_redis_3:7012}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_POOL_SIZE=${CHAT_REDIS_POOL_SIZE:-100}
      - WORKER_CONCURRENCY=${CHAT_WORKER_CONCURRENCY:-10}
      - BATCH_SIZE=${CHAT_BATCH_SIZE:-50}
      - STREAM_PARTITION_COUNT=${CHAT_STREAM_PARTITION_COUNT:-16}
      - CACHE_TTL=${CHAT_CACHE_TTL:-24h}
    ports:
      - "9099:9099"
    networks:
      - detectai_net
    depends_on:
      chat-mongo-init:
        condition: service_started
      chat-redis-cluster-init:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9099/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

networks:
  detectai_net:
    name: ${detect_ai_network}
    external: true
