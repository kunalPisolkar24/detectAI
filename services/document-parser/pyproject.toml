[tool.poetry]
name = "detectai-document-parser"
version = "0.1.0"
description = "Document parser service for DetectAI"
authors = ["Your Name <you@example.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.14"
fastapi = "0.161.1"
uvicorn = "0.54.0"
pydantic = "^2.14.1"
python-dotenv = "^1.2.4"
boto3 = "^1.43.118"
python-multipart = "^0.0.32"
pypdf = "^6.21.2"
pymupdf = "^2.0"
opentelemetry-sdk = "^1.45.1"
opentelemetry-exporter-otlp-proto-http = "^1.45.1"
opentelemetry-instrumentation-fastapi = "^0.66b1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0,<10.0)",
    "ruff (>=0.17.2,<0.18.0)",
    "httpx2 (>=2.16.0,<3.0.0)"
]

[tool.ruff]
extend-exclude = ["slop"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
