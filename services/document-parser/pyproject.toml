[tool.poetry]
name = "detectai-document-parser"
version = "0.1.0"
description = "Document parser service for DetectAI"
authors = ["Your Name <you@example.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.14"
fastapi = "0.161.1"
uvicorn = "0.54.0"
pydantic-settings = "^2.16.1"
boto3 = "^1.43.118"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0,<10.0)",
    "ruff (>=0.17.2,<0.18.0)"
]

[tool.pytest.ini_options]
pythonpath = ["."]
