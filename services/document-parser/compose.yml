services:
  document-parser:
    container_name: detect_ai_doc_parser
    build: 
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - PORT=${PORT_DOC_PARSER}
      - WORKERS=4
    ports:
      - "${PORT_DOC_PARSER}:${PORT_DOC_PARSER}"
    networks:
      - detectai_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT_DOC_PARSER}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  detectai_net:
    name: ${detect_ai_network}
    external: true