# Load rig: document-parser + k6 on an isolated network. Nothing is published
# to the host: k6 reaches the parser over the rig network. Both services take
# the whole env plane from infra/.env.load (env_file), so every knob — target,
# key, shape, budgets, limits — lives in that file and nothing is hardcoded
# here. `make load-e2e` runs the k6 template alone (compose.k6.yml) against an
# external target instead.
name: document-parser-load

include:
  - compose.k6.yml

services:
  document-parser:
    build:
      context: ..
      dockerfile: Dockerfile
    stop_grace_period: 15s
    env_file:
      - .env.load
    healthcheck:
      # python-slim ships no curl; the same probe the Dockerfile uses.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - loadnet

  # The rig's only override: k6 waits for the parser to answer its probe.
  k6:
    depends_on:
      document-parser:
        condition: service_healthy

networks:
  loadnet:
