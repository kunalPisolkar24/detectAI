services:
  document-parser:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8000
      - WORKERS=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - loadnet

  k6:
    image: grafana/k6
    command: run /load/script.js
    volumes:
      - ../load:/load:ro
    environment:
      - API_URL=http://document-parser:8000
      - MODE=${MODE:-vus}
      - VUS=${VUS:-5}
      - DURATION=${DURATION:-10s}
      - RAMP_TIME=${RAMP_TIME:-5s}
      - RPS=${RPS:-10}
    depends_on:
      document-parser:
        condition: service_healthy
    networks:
      - loadnet

networks:
  loadnet:
    name: docparser_loadnet
