# Its own compose project, so two services' rigs never share one.
name: document-parser-load

services:
  document-parser:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      - PYTHONUNBUFFERED=1
      - ENV_TYPE=dev
      - PORT=8000
      - WORKERS=${WORKERS:-1}
      - WORKER_THREADS=${WORKER_THREADS:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - loadnet

  k6:
    image: grafana/k6
    command: run /load/${K6_SCRIPT:-scenarios/load.js}
    volumes:
      - ../load:/load:ro
    # Lets the k6 container reach a service published on the Docker host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - API_URL=${API_URL:-http://document-parser:8000}
      - MODE=${MODE:-vus}
      - VUS=${VUS:-5}
      - DURATION=${DURATION:-10s}
      - RAMP_TIME=${RAMP_TIME:-5s}
      - RPS=${RPS:-10}
      - SCENARIO=${SCENARIO:-load}
      - DOCPARSER_LOAD_PROFILES=${DOCPARSER_LOAD_PROFILES:-txt-small,txt-medium,txt-large,pdf-small,docx-small}
      - DOCPARSER_LOAD_REQUEST_TIMEOUT=${DOCPARSER_LOAD_REQUEST_TIMEOUT:-35s}
      - DOCPARSER_LOAD_SMOKE_VUS=${DOCPARSER_LOAD_SMOKE_VUS:-1}
      - DOCPARSER_LOAD_SMOKE_ITERATIONS=${DOCPARSER_LOAD_SMOKE_ITERATIONS:-1}
      - DOCPARSER_LOAD_STAGES=${DOCPARSER_LOAD_STAGES:-}
      - DOCPARSER_LOAD_GRACEFUL_STOP=${DOCPARSER_LOAD_GRACEFUL_STOP:-30s}
      - DOCPARSER_LOAD_P95_MS=${DOCPARSER_LOAD_P95_MS:-1500}
      - DOCPARSER_LOAD_P99_MS=${DOCPARSER_LOAD_P99_MS:-3000}
      - DOCPARSER_LOAD_TXT_P95_MS=${DOCPARSER_LOAD_TXT_P95_MS:-500}
      - DOCPARSER_LOAD_MIN_SUCCESS_RATE=${DOCPARSER_LOAD_MIN_SUCCESS_RATE:-0.99}
      - DOCPARSER_LOAD_STRESS_START_RATE=${DOCPARSER_LOAD_STRESS_START_RATE:-1}
      - DOCPARSER_LOAD_STRESS_PREALLOCATED_VUS=${DOCPARSER_LOAD_STRESS_PREALLOCATED_VUS:-20}
      - DOCPARSER_LOAD_STRESS_MAX_VUS=${DOCPARSER_LOAD_STRESS_MAX_VUS:-100}
      - DOCPARSER_LOAD_STRESS_STAGES=${DOCPARSER_LOAD_STRESS_STAGES:-10s:5,30s:10,10s:0}
      - DOCPARSER_LOAD_STRESS_GRACEFUL_STOP=${DOCPARSER_LOAD_STRESS_GRACEFUL_STOP:-30s}
      - DOCPARSER_LOAD_STRESS_P95_MS=${DOCPARSER_LOAD_STRESS_P95_MS:-3000}
      - DOCPARSER_LOAD_STRESS_P99_MS=${DOCPARSER_LOAD_STRESS_P99_MS:-6000}
      - DOCPARSER_LOAD_STRESS_MIN_SUCCESS_RATE=${DOCPARSER_LOAD_STRESS_MIN_SUCCESS_RATE:-0.95}
      - DOCPARSER_LOAD_SOAK_VUS=${DOCPARSER_LOAD_SOAK_VUS:-2}
      - DOCPARSER_LOAD_SOAK_DURATION=${DOCPARSER_LOAD_SOAK_DURATION:-5m}
      - DOCPARSER_LOAD_SOAK_GRACEFUL_STOP=${DOCPARSER_LOAD_SOAK_GRACEFUL_STOP:-30s}
      - DOCPARSER_LOAD_SOAK_P95_MS=${DOCPARSER_LOAD_SOAK_P95_MS:-3000}
      - DOCPARSER_LOAD_SOAK_P99_MS=${DOCPARSER_LOAD_SOAK_P99_MS:-5000}
      - DOCPARSER_LOAD_SOAK_MIN_SUCCESS_RATE=${DOCPARSER_LOAD_SOAK_MIN_SUCCESS_RATE:-0.99}
      - DOCPARSER_LOAD_NEGATIVE_VUS=${DOCPARSER_LOAD_NEGATIVE_VUS:-1}
      - DOCPARSER_LOAD_NEGATIVE_ITERATIONS=${DOCPARSER_LOAD_NEGATIVE_ITERATIONS:-8}
      - DOCPARSER_LOAD_NEGATIVE_MIN_SUCCESS_RATE=${DOCPARSER_LOAD_NEGATIVE_MIN_SUCCESS_RATE:-1}
    depends_on:
      document-parser:
        condition: service_healthy
    networks:
      - loadnet

networks:
  loadnet:
    name: docparser_loadnet
