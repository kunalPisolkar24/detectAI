# Load rig: the parser stack from compose.yml plus k6, on an isolated
# network, nothing published to the host. Every knob lives in infra/.env.load.
name: document-parser-load

include:
  - compose.yml
  - compose.k6.yml

services:
  document-parser:
    # Inherited restart is unless-stopped; a crashed parser must not
    # resurrect mid-run — thresholds should see the truth.
    restart: "no"
    env_file: !override
      - .env.load
    ports: !override []
    healthcheck:
      # python-slim ships no curl; thresholds stay fast so k6 gates on health.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - loadnet

  # The rig's only override: k6 waits for the parser to answer its probe.
  k6:
    depends_on:
      document-parser:
        condition: service_healthy

networks:
  loadnet:
