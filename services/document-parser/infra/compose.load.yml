name: document-parser-load

include:
  - compose.yml
  - compose.k6.yml

services:
  document-parser:
    restart: "no"
    env_file: !override
      - .env.load
    ports: !override []
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - loadnet

  k6:
    depends_on:
      document-parser:
        condition: service_healthy

networks:
  loadnet:
