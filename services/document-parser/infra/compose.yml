# Standalone stack on its default network.
name: document-parser

services:
  document-parser:
    image: detectai-document-parser:latest
    container_name: detectai-document-parser
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    # Probe policy lives here, not in the image: Lambda ignores Docker
    # HEALTHCHECK, and the load rig overrides these thresholds for k6.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3
    # Outlasts the 12 s graceful-drain bound in the Dockerfile CMD.
    stop_grace_period: 15s
    env_file:
      - .env
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    ports:
      - "${PORT:-8000}:8000"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
