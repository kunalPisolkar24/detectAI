# Standalone stack: default project network; attaches to the shared DetectAI
# network when the extract endpoint ships.
name: document-parser

services:
  document-parser:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
