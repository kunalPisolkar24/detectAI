services:
  document-parser:
    container_name: detect_ai_doc_parser
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 30s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PYTHONUNBUFFERED=1
      - ENV_TYPE=${ENV_TYPE:-dev}
      - PORT=${PORT:-8000}
      - WORKERS=${WORKERS:-}
      - WORKER_THREADS=${WORKER_THREADS:-}
      - MAX_UPLOAD_SIZE_BYTES=${MAX_UPLOAD_SIZE_BYTES:-}
      - MAX_TEXT_LENGTH=${MAX_TEXT_LENGTH:-}
      - MAX_PDF_PAGES=${MAX_PDF_PAGES:-}
      - MAX_DOCX_UNCOMPRESSED_BYTES=${MAX_DOCX_UNCOMPRESSED_BYTES:-}
      - EXTRACTION_TIMEOUT_SECONDS=${EXTRACTION_TIMEOUT_SECONDS:-}
      - READINESS_MAX_QUEUE_DEPTH=${READINESS_MAX_QUEUE_DEPTH:-}
      - HEADER_FOOTER_MARGIN_PT=${HEADER_FOOTER_MARGIN_PT:-}
      - HEADER_REPETITION_RATIO=${HEADER_REPETITION_RATIO:-}
      - ALLOWED_MIME_TYPES=${ALLOWED_MIME_TYPES:-}
      - LOG_LEVEL=${LOG_LEVEL:-}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-document-parser}
      - OTEL_SERVICE_VERSION=${OTEL_SERVICE_VERSION:-}
      - AWS_REGION=${AWS_REGION:-ap-south-1}
      - AWS_ENDPOINT_URL=${AWS_ENDPOINT_URL:-}
      - SSM_PREFIX=${SSM_PREFIX:-}
      - SSM_ENABLED=${SSM_ENABLED:-}
      - DOCUMENT_PARSER_SECRETS_NAME=${DOCUMENT_PARSER_SECRETS_NAME:-}
    ports:
      - "${PORT:-8000}:8000"
    networks:
      - detectai_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  detectai_net:
    name: ${DETECT_AI_NETWORK:-detect-ai-network}
