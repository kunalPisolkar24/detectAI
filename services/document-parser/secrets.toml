[service]
slug = "document-parser"

[secrets]
keys = ["API_KEY", "NEW_RELIC_LICENSE_KEY"]

[secrets.min_lengths]
API_KEY = 16

[requires]
"OTEL_EXPORTER_OTLP_ENDPOINT" = ["NEW_RELIC_LICENSE_KEY", 16]

[ssm]
keys = [
    "UPLOAD_LIMIT_BYTES",
    "MAX_PDF_PAGES",
    "DOCX_MAX_UNCOMPRESSED_BYTES",
    "OUTPUT_CHAR_LIMIT",
    "PROCESSING_BUDGET_SECONDS",
    "HEADER_REPETITION_RATIO",
    "REPETITION_MIN_PAGES",
    "HEADER_EDGE_ZONE_RATIO",
    "EDGE_ZONE_RATIO",
    "EDGE_TOLERANCE_RATIO",
    "FOLIO_MONOTONIC_RATIO",
    "OTEL_EXPORTER_OTLP_ENDPOINT",
    "OTEL_SERVICE_NAME",
    "OTEL_SERVICE_VERSION",
    "OTEL_TRACE_SAMPLE_RATIO",
]
