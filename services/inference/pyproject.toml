[tool.poetry]
name = "detectai-inference"
version = "0.1.0"
description = "Inference service for DetectAI"
authors = ["Your Name <you@example.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.14"
grpcio = "1.80.0"
grpcio-health-checking = "1.80.0"
protobuf = "6.33.3"
pydantic = "^2.14.1"
python-dotenv = "^1.2.4"
boto3 = "^1.43.118"
huggingface-hub = "^2.4.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0,<10.0)",
    "ruff (>=0.17.2,<0.18.0)"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
