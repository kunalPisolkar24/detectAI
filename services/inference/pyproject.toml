[tool.poetry]
name = "detectai-inference"
version = "0.1.0"
description = "Inference service for DetectAI"
authors = ["Your Name <you@example.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
grpcio = "1.80.0"
grpcio-tools = "1.80.0"
grpcio-health-checking = "1.80.0"
protobuf = "6.33.3"
transformers = "4.57.3"
scikit-learn = "1.3.2"
huggingface-hub = "0.36.2"
pydantic = "2.12.5"
pydantic-settings = "2.12.0"
structlog = "25.5.0"
numpy = "1.26.4"
prometheus-client = "0.23.1"
circuitbreaker = "2.1.3"
PyJWT = "2.10.1"
onnxruntime = { version = "1.23.2", optional = true }
onnxruntime-gpu = { version = "1.23.2", optional = true }

[tool.poetry.group.dev.dependencies]
pytest = "9.0.2"
pytest-mock = "3.15.1"
pytest-asyncio = "1.3.0"
coverage = "7.13.5"
pytest-cov = "7.1.0"
ruff = "0.1.15"

[tool.poetry.extras]
cpu = ["onnxruntime"]
gpu = ["onnxruntime-gpu"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
pythonpath = ["src"]
