name: detect_ai_inference

services:
  ai-service:
    container_name: detect_ai_inference
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "50051:50051"
      - "8333:8333"
    networks:
      - detectai_net
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - GRPC_PORT=50051
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

networks:
  detectai_net:
    name: detect_ai_network
    external: true