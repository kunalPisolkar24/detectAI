[service]
slug = "inference"

[secrets]
keys = ["API_KEY", "HF_TOKEN", "NEW_RELIC_LICENSE_KEY"]

[secrets.min_lengths]
API_KEY = 16

[requires]
"OTEL_EXPORTER_OTLP_ENDPOINT" = ["NEW_RELIC_LICENSE_KEY", 16]

[ssm]
keys = [
    "GRPC_PORT",
    "LOG_LEVEL",
    "MAX_TEXT_CHARS",
    "CHUNK_TOKEN_LIMIT",
    "CHUNK_TOKEN_OVERLAP",
    "INFERENCE_BATCH_SIZE",
    "MAX_CONCURRENT_BATCHES",
    "MAX_INFLIGHT_REQUESTS",
    "FLARE_BATCH_SIZE",
    "SPARK_BATCH_SIZE",
    "FLARE_MAX_SEQUENCE_LENGTH",
    "SPARK_MAX_SEQUENCE_LENGTH",
    "AI_DETECTION_THRESHOLD",
    "INFERENCE_PROVIDERS",
    "ORT_INTRA_OP_THREADS",
    "MODEL_CACHE_DIR",
    "FLARE_MODEL_REPO",
    "FLARE_MODEL_REVISION",
    "FLARE_MODEL_DIR",
    "SPARK_MODEL_REPO",
    "SPARK_MODEL_REVISION",
    "SPARK_MODEL_DIR",
    "OTEL_EXPORTER_OTLP_ENDPOINT",
    "OTEL_SERVICE_NAME",
    "OTEL_SERVICE_VERSION",
    "OTEL_TRACE_SAMPLE_RATIO",
]
