services:
  ai-service:
    build:
      context: ..
      dockerfile: Dockerfile.local
    environment:
      - PYTHONUNBUFFERED=1
      - ENV=test
      - LOG_LEVEL=INFO
      - GRPC_PORT=50051
      - METRICS_PORT=8333
      - API_KEY=${AI_SERVICE_API_KEY:-test-key-16chars-long}
      - MODEL_CACHE_DIR=${INFERENCE_MODEL_CACHE_DIR:-./models}
      - SPARK_MODEL_REVISION=${SPARK_MODEL_REVISION:-9a48004391c71272d6fb1d164ed7c56e1fbfe360}
      - FLARE_MODEL_REVISION=${FLARE_MODEL_REVISION:-e1911c0be59f4e10f0d120f639d1358e46bc2086}
      - BATCH_SIZE=${INFERENCE_BATCH_SIZE:-8}
      - BATCH_TIMEOUT=${INFERENCE_BATCH_TIMEOUT:-0.05}
      - MAX_TEXT_LENGTH=${INFERENCE_MAX_TEXT_CHARS:-50000}
      - BATCH_QUEUE_MAX_SIZE=${INFERENCE_BATCH_QUEUE_MAX_SIZE:-1024}
      - MAX_INFLIGHT_DOC_CHUNKS=${INFERENCE_MAX_INFLIGHT_DOC_CHUNKS:-8}
      - CHUNK_TOKEN_LIMIT=${INFERENCE_CHUNK_TOKEN_LIMIT:-256}
      - CHUNK_TOKEN_STRIDE=${INFERENCE_CHUNK_TOKEN_STRIDE:-192}
      - MAX_GLOBAL_TOKENS=${INFERENCE_MAX_GLOBAL_TOKENS:-10000}
      - MAX_CONCURRENT_BATCHES=${INFERENCE_MAX_CONCURRENT_BATCHES:-4}
      - INFERENCE_MAX_WORKERS=${INFERENCE_MAX_WORKERS:-8}
      - INFERENCE_PROVIDERS=${INFERENCE_PROVIDERS:-CPUExecutionProvider}
      - GRPC_MAX_WORKERS=${GRPC_MAX_WORKERS:-10}
    healthcheck:
      test: ["CMD", "/bin/grpc_health_probe", "-addr=:50051"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 10m
      start_interval: 5s
    networks:
      - loadnet

  k6:
    image: grafana/k6:latest
    command: run /workspace/load/scenarios/${SCENARIO:-smoke}.js
    volumes:
      - ..:/workspace:ro
    environment:
      - INFERENCE_LOAD_GRPC_TARGET=ai-service:50051
      - INFERENCE_LOAD_AUTH_TOKEN=${INFERENCE_LOAD_AUTH_TOKEN:-}
      - INFERENCE_LOAD_GRPC_PLAINTEXT=${INFERENCE_LOAD_GRPC_PLAINTEXT:-true}
      - INFERENCE_LOAD_CONNECT_TIMEOUT=${INFERENCE_LOAD_CONNECT_TIMEOUT:-5s}
      - INFERENCE_LOAD_RPC_TIMEOUT=${INFERENCE_LOAD_RPC_TIMEOUT:-30s}
      - INFERENCE_LOAD_MODELS=${INFERENCE_LOAD_MODELS:-spark,flare}
      - INFERENCE_LOAD_TEXT_PROFILES=${INFERENCE_LOAD_TEXT_PROFILES:-short,medium,large}
      - INFERENCE_LOAD_SMOKE_VUS=${INFERENCE_LOAD_SMOKE_VUS:-1}
      - INFERENCE_LOAD_SMOKE_ITERATIONS=${INFERENCE_LOAD_SMOKE_ITERATIONS:-1}
      - INFERENCE_LOAD_DETECT_START_RATE=${INFERENCE_LOAD_DETECT_START_RATE:-1}
      - INFERENCE_LOAD_DETECT_PREALLOCATED_VUS=${INFERENCE_LOAD_DETECT_PREALLOCATED_VUS:-20}
      - INFERENCE_LOAD_DETECT_MAX_VUS=${INFERENCE_LOAD_DETECT_MAX_VUS:-100}
      - INFERENCE_LOAD_DETECT_STAGES=${INFERENCE_LOAD_DETECT_STAGES:-30s:5,1m:10,30s:0}
      - INFERENCE_LOAD_DETECT_P95_MS=${INFERENCE_LOAD_DETECT_P95_MS:-1500}
      - INFERENCE_LOAD_DETECT_P99_MS=${INFERENCE_LOAD_DETECT_P99_MS:-2500}
      - INFERENCE_LOAD_DETECT_MIN_SUCCESS_RATE=${INFERENCE_LOAD_DETECT_MIN_SUCCESS_RATE:-0.99}
      - INFERENCE_LOAD_ANALYZE_VUS=${INFERENCE_LOAD_ANALYZE_VUS:-6}
      - INFERENCE_LOAD_ANALYZE_DURATION=${INFERENCE_LOAD_ANALYZE_DURATION:-5m}
      - INFERENCE_LOAD_ANALYZE_GRACEFUL_STOP=${INFERENCE_LOAD_ANALYZE_GRACEFUL_STOP:-30s}
      - INFERENCE_LOAD_ANALYZE_P95_MS=${INFERENCE_LOAD_ANALYZE_P95_MS:-5000}
      - INFERENCE_LOAD_ANALYZE_P99_MS=${INFERENCE_LOAD_ANALYZE_P99_MS:-10000}
      - INFERENCE_LOAD_ANALYZE_FIRST_EVENT_P95_MS=${INFERENCE_LOAD_ANALYZE_FIRST_EVENT_P95_MS:-1500}
      - INFERENCE_LOAD_ANALYZE_MIN_SUCCESS_RATE=${INFERENCE_LOAD_ANALYZE_MIN_SUCCESS_RATE:-0.99}
      - INFERENCE_LOAD_SOAK_VUS=${INFERENCE_LOAD_SOAK_VUS:-2}
      - INFERENCE_LOAD_SOAK_DURATION=${INFERENCE_LOAD_SOAK_DURATION:-30m}
      - INFERENCE_LOAD_SOAK_GRACEFUL_STOP=${INFERENCE_LOAD_SOAK_GRACEFUL_STOP:-1m}
      - INFERENCE_LOAD_SOAK_P95_MS=${INFERENCE_LOAD_SOAK_P95_MS:-7000}
      - INFERENCE_LOAD_SOAK_P99_MS=${INFERENCE_LOAD_SOAK_P99_MS:-12000}
      - INFERENCE_LOAD_SOAK_FIRST_EVENT_P95_MS=${INFERENCE_LOAD_SOAK_FIRST_EVENT_P95_MS:-2000}
      - INFERENCE_LOAD_SOAK_MIN_SUCCESS_RATE=${INFERENCE_LOAD_SOAK_MIN_SUCCESS_RATE:-0.99}
    depends_on:
      ai-service:
        condition: service_healthy
    networks:
      - loadnet

networks:
  loadnet:
    name: inference_loadnet
