services:
  ai-service:
    container_name: detect_ai_inference
    build:
      context: ..
      dockerfile: Dockerfile.local
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "/bin/grpc_health_probe", "-addr=:50051"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10m
      start_interval: 5s
    ports:
      - "${PORT_INFERENCE:-50051}:50051"
      - "${PORT_INFERENCE_METRICS:-8333}:8333"
    networks:
      - detectai_net
    environment:
      - PYTHONUNBUFFERED=1
      - ENV=${ENV:-production}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - GRPC_PORT=50051
      - METRICS_PORT=8333
      - API_KEY=${AI_SERVICE_API_KEY:?AI_SERVICE_API_KEY is required}
      - MODEL_CACHE_DIR=${INFERENCE_MODEL_CACHE_DIR:-./models}
      - SPARK_MODEL_REVISION=${INFERENCE_SPARK_MODEL_REVISION:-9a48004391c71272d6fb1d164ed7c56e1fbfe360}
      - FLARE_MODEL_REVISION=${INFERENCE_FLARE_MODEL_REVISION:-e1911c0be59f4e10f0d120f639d1358e46bc2086}
      - BATCH_SIZE=${INFERENCE_BATCH_SIZE:-32}
      - BATCH_TIMEOUT=${INFERENCE_BATCH_TIMEOUT:-0.05}
      - MAX_TEXT_LENGTH=${INFERENCE_MAX_TEXT_CHARS:-50000}
      - BATCH_QUEUE_MAX_SIZE=${INFERENCE_BATCH_QUEUE_MAX_SIZE:-1024}
      - MAX_INFLIGHT_DOC_CHUNKS=${INFERENCE_MAX_INFLIGHT_DOC_CHUNKS:-8}
      - CHUNK_TOKEN_LIMIT=${INFERENCE_CHUNK_TOKEN_LIMIT:-256}
      - CHUNK_TOKEN_STRIDE=${INFERENCE_CHUNK_TOKEN_STRIDE:-192}
      - MAX_GLOBAL_TOKENS=${INFERENCE_MAX_GLOBAL_TOKENS:-10000}
      - MAX_CONCURRENT_BATCHES=${INFERENCE_MAX_CONCURRENT_BATCHES:-4}
      - INFERENCE_MAX_WORKERS=${INFERENCE_MAX_WORKERS:-32}
      - INFERENCE_PROVIDERS=${INFERENCE_PROVIDERS:-CPUExecutionProvider}
      - GRPC_MAX_WORKERS=${INFERENCE_GRPC_MAX_WORKERS:-50}

networks:
  detectai_net:
    name: ${detect_ai_network:-detect-ai-network}
