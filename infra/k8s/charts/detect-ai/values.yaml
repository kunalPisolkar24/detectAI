global:
  environment: "production"
  secretName: "detect-ai-secrets"
  detectAiNetwork: "detect-ai-network"
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL

secrets:
  DATABASE_URL: "postgresql://detect_ai:CHANGE_ME@detect-ai-postgres:5432/detect_ai"
  DATABASE_URL_REPLICA: "postgresql://detect_ai:CHANGE_ME@detect-ai-postgres:5432/detect_ai"
  POSTGRES_PASSWORD: "CHANGE_ME"
  REDIS_PASSWORD: "CHANGE_ME"
  REDIS_URL: "redis://:CHANGE_ME@detect-ai-redis-usercache:6379"
  REDIS_USAGE_URL: "redis://:CHANGE_ME@detect-ai-redis-usage:6379"
  REDIS_USAGE_PASSWORD: "CHANGE_ME"
  EVENT_REDIS_URL: "redis://:CHANGE_ME@detect-ai-redis-events:6379"
  EVENT_REDIS_PASSWORD: "CHANGE_ME"
  RABBITMQ_URL: "amqp://guest:guest@detect-ai-rabbitmq:5672/"
  RABBITMQ_DEFAULT_USER: "guest"
  RABBITMQ_DEFAULT_PASS: "CHANGE_ME"
  AI_SERVICE_API_KEY: "CHANGE_ME"
  INTERNAL_API_KEY: "CHANGE_ME"
  NEXTAUTH_SECRET: "CHANGE_ME"
  NEXTAUTH_URL: "http://detect-ai-web:3000/"
  TURNSTILE_SECRET_KEY: ""
  PADDLE_API_KEY: ""
  PADDLE_ENVIRONMENT: "sandbox"
  PADDLE_WEBHOOK_SECRET: ""

migration:
  image: "your-registry/detect-ai-migrate:latest"
  pullPolicy: "IfNotPresent"
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "100m"
      memory: "256Mi"

fullnameOverride: "detect-ai"
# Frontend Next.js Web App
web:
  replicaCount: 2
  image:
    repository: "localhost:5001/detect-ai-web"
    pullPolicy: "IfNotPresent"
    tag: "latest"
  service:
    type: "ClusterIP"
    port: 80
    targetPort: 3000
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "200m"
      memory: "512Mi"
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

# FastAPI Document Parser Service
documentParser:
  replicaCount: 1
  image:
    repository: "kunalpisolkar/detect-ai-doc-parser"
    pullPolicy: "IfNotPresent"
    tag: "latest"
  service:
    type: "ClusterIP"
    port: 8000
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "200m"
      memory: "512Mi"
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 75

# ML Inference Service (Python + GPU Option)
inference:
  replicaCount: 1
  image:
    repository: "kunalpisolkar/detect-ai-inference"
    pullPolicy: "IfNotPresent"
    tag: "latest"
  service:
    type: "ClusterIP"
    port: 50051
    metricsPort: 8333
  gpu:
    enabled: false
    limit: 1
  resources:
    limits:
      cpu: "4.0"
      memory: "8Gi"
    requests:
      cpu: "2.0"
      memory: "4Gi"
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80

# Go Chats Service (API and Worker roles)
chats:
  image:
    repository: "kunalpisolkar/detect-ai-chats"
    pullPolicy: "IfNotPresent"
    tag: "latest"
  api:
    replicaCount: 2
    service:
      type: "ClusterIP"
      grpcPort: 50051
      metricsPort: 9091
    resources:
      limits:
        cpu: "500m"
        memory: "512Mi"
      requests:
        cpu: "200m"
        memory: "512Mi"
    autoscaling:
      enabled: false
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 75
  worker:
    replicaCount: 1
    metricsPort: 9099
    resources:
      limits:
        cpu: "300m"
        memory: "256Mi"
      requests:
        cpu: "100m"
        memory: "256Mi"

# Go Payment Gateway Service
payments:
  replicaCount: 2
  image:
    repository: "kunalpisolkar/detect-ai-payments-gateway"
    pullPolicy: "IfNotPresent"
    tag: "latest"
  service:
    type: "ClusterIP"
    port: 8080
  resources:
    limits:
      cpu: "300m"
      memory: "256Mi"
    requests:
      cpu: "100m"
      memory: "256Mi"

# Bun Workers
workers:
  image:
    repository: "kunalpisolkar/detect-ai-workers"
    pullPolicy: "IfNotPresent"
    tag: "latest"
  analytics:
    replicaCount: 1
    port: 7001
    resources:
      limits:
        cpu: "300m"
        memory: "256Mi"
      requests:
        cpu: "100m"
        memory: "128Mi"
    keda:
      enabled: false
      minReplicas: 1
      maxReplicas: 10
      queueLength: 50
  cron:
    replicaCount: 1
    port: 7002
    resources:
      limits:
        cpu: "200m"
        memory: "128Mi"
      requests:
        cpu: "100m"
        memory: "64Mi"
  payments:
    replicaCount: 1
    port: 7003
    resources:
      limits:
        cpu: "300m"
        memory: "256Mi"
      requests:
        cpu: "100m"
        memory: "128Mi"
    keda:
      enabled: false
      minReplicas: 1
      maxReplicas: 10
      queueLength: 50

# Self-Hosted Databases & Stateful Services
databases:
  storageClass: "local-path"
  postgres:
    enabled: true
    storageSize: "5Gi"
    resources:
      limits:
        cpu: "1.0"
        memory: "1Gi"
      requests:
        cpu: "500m"
        memory: "512Mi"
  mongo:
    sharded: false
    database: "chats"
    replicaCount: 1
    storageSize: "5Gi"
    resources:
      limits:
        cpu: "1.0"
        memory: "1Gi"
      requests:
        cpu: "500m"
        memory: "512Mi"
  rabbitmq:
    replicaCount: 1
    storageSize: "5Gi"
    resources:
      limits:
        cpu: "1.0"
        memory: "1Gi"
      requests:
        cpu: "500m"
        memory: "512Mi"
  redis:
    passwordSecretName: "detect-ai-secrets"
    image: "quay.io/opstree/redis:v7.0.15"
    sentinel:
      image: "quay.io/opstree/redis-sentinel"
      tag: "v7.0.15"
    exporter:
      image: "quay.io/opstree/redis-exporter"
      tag: "v1.44.0"
    userCache:
      sentinel:
        enabled: false
      clusterSize: 3
      sentinelSize: 3
      storageSize: "2Gi"
    usage:
      storageSize: "1Gi"
    events:
      storageSize: "1Gi"
    chat:
      cluster:
        enabled: false
      leaderReplicas: 3
      followerReplicas: 3
      storageSize: "2Gi"

# NGINX Ingress Controller Routing
ingress:
  enabled: true
  className: "nginx"
  host: "detect-ai.local"
  tls:
    # Set to true in production with a cert-manager ClusterIssuer configured
    enabled: false
    clusterIssuer: "letsencrypt-prod"
  rateLimit:
    # Enable in production to protect against DDoS and endpoint abuse
    enabled: false
    rps: "50"
    burstMultiplier: "2"

# LGTM Observability Stack Integration
monitoring:
  enabled: true
  prometheus:
    release: "monitoring"
    prometheusSpec:
      storageSpec:
        volumeClaimTemplate:
          spec:
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 5Gi
  grafana:
    enabled: true
    adminPassword: "prom-operator"
    sidecar:
      dashboards:
        enabled: true
        label: grafana_dashboard
        labelValue: "1"
        searchNamespace: ALL
        provider:
          foldersFromFilesStructure: true
    additionalDataSources:
      - name: Tempo
        type: tempo
        uid: tempo
        url: http://detect-ai-tempo:3100
        access: proxy
        jsonData:
          httpMethod: GET
          serviceMap:
            datasourceUid: prometheus
          lokiSearch:
            datasourceUid: loki
  loki:
    enabled: true
    storageSize: "5Gi"
  promtail:
    enabled: true
  tracing:
    enabled: true
    tempo:
      storageSize: "10Gi"
      retention: "48h"
      resources:
        limits:
          cpu: "500m"
          memory: "1Gi"
        requests:
          cpu: "200m"
          memory: "512Mi"
    otelCollector:
      replicaCount: 1
      resources:
        limits:
          cpu: "500m"
          memory: "512Mi"
        requests:
          cpu: "100m"
          memory: "128Mi"

# Zero-Trust Network Policies
networkPolicies:
  # Set to true once you have confirmed the ingress-nginx namespace label is correct
  enabled: false