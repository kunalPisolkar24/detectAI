global:
  environment: "production"
  secretName: "detect-ai-secrets"
  detectAiNetwork: "detect-ai-network"

# Frontend Next.js Web App
web:
  replicaCount: 2
  image:
    repository: "localhost:5001/detect-ai-web"
    pullPolicy: "IfNotPresent"
    tag: "latest"
  service:
    type: "ClusterIP"
    port: 80
    targetPort: 3000
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "200m"
      memory: "256Mi"
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

# FastAPI Document Parser Service
documentParser:
  replicaCount: 1
  image:
    repository: "kunalpisolkar/detect-ai-doc-parser"
    pullPolicy: "IfNotPresent"
    tag: "latest"
  service:
    type: "ClusterIP"
    port: 8000
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "200m"
      memory: "256Mi"

# ML Inference Service (Python + GPU Option)
inference:
  replicaCount: 1
  image:
    repository: "kunalpisolkar/detect-ai-inference"
    pullPolicy: "IfNotPresent"
    tag: "latest"
  service:
    type: "ClusterIP"
    port: 50051
    metricsPort: 8333
  gpu:
    enabled: false
    limit: 1
  resources:
    limits:
      cpu: "4.0"
      memory: "8Gi"
    requests:
      cpu: "2.0"
      memory: "4Gi"
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80

# Go Chats Service (API and Worker roles)
chats:
  image:
    repository: "kunalpisolkar/detect-ai-chats"
    pullPolicy: "IfNotPresent"
    tag: "latest"
  api:
    replicaCount: 2
    service:
      type: "ClusterIP"
      grpcPort: 50051
      metricsPort: 9091
    resources:
      limits:
        cpu: "500m"
        memory: "512Mi"
      requests:
        cpu: "200m"
        memory: "256Mi"
  worker:
    replicaCount: 1
    metricsPort: 9099
    resources:
      limits:
        cpu: "300m"
        memory: "256Mi"
      requests:
        cpu: "100m"
        memory: "128Mi"

# Go Payment Gateway Service
payments:
  replicaCount: 2
  image:
    repository: "kunalpisolkar/detect-ai-payments-gateway"
    pullPolicy: "IfNotPresent"
    tag: "latest"
  service:
    type: "ClusterIP"
    port: 8080
  resources:
    limits:
      cpu: "300m"
      memory: "256Mi"
    requests:
      cpu: "100m"
      memory: "128Mi"

# Bun Workers
workers:
  image:
    repository: "kunalpisolkar/detect-ai-workers"
    pullPolicy: "IfNotPresent"
    tag: "latest"
  analytics:
    replicaCount: 1
    port: 7001
    resources:
      limits:
        cpu: "300m"
        memory: "256Mi"
      requests:
        cpu: "100m"
        memory: "128Mi"
  cron:
    replicaCount: 1
    port: 7002
    resources:
      limits:
        cpu: "200m"
        memory: "128Mi"
      requests:
        cpu: "100m"
        memory: "64Mi"
  payments:
    replicaCount: 1
    port: 7003
    resources:
      limits:
        cpu: "300m"
        memory: "256Mi"
      requests:
        cpu: "100m"
        memory: "128Mi"
    keda:
      enabled: false
      minReplicas: 1
      maxReplicas: 10
      queueLength: 50

# Self-Hosted Databases & Stateful Services
databases:
  storageClass: "local-path"
  postgres:
    storageSize: "5Gi"
    resources:
      limits:
        cpu: "1.0"
        memory: "1Gi"
      requests:
        cpu: "500m"
        memory: "512Mi"
  mongo:
    sharded: false
    replicaCount: 1
    storageSize: "5Gi"
    resources:
      limits:
        cpu: "1.0"
        memory: "1Gi"
      requests:
        cpu: "500m"
        memory: "512Mi"
  rabbitmq:
    replicaCount: 1
    storageSize: "5Gi"
    resources:
      limits:
        cpu: "1.0"
        memory: "1Gi"
      requests:
        cpu: "500m"
        memory: "512Mi"
  redis:
    sentinel:
      enabled: false
      replicaCount: 3
      storageSize: "2Gi"
    cluster:
      enabled: false
      replicaCount: 6
      storageSize: "2Gi"

# NGINX Ingress Controller Routing
ingress:
  enabled: true
  className: "nginx"
  host: "detect-ai.local"

# LGTM Observability Stack Integration
monitoring:
  enabled: true
  kube-prometheus-stack:
    enabled: true
    prometheus:
      prometheusSpec:
        storageSpec:
          volumeClaimTemplate:
            spec:
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 5Gi
    grafana:
      enabled: true
      adminPassword: "prom-operator"
  loki:
    enabled: true
    storageSize: "5Gi"
  promtail:
    enabled: true