apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-document-parser-service
  namespace: {{ .Release.Namespace }}
  labels:
    app: document-parser
spec:
  type: {{ .Values.documentParser.service.type | default "ClusterIP" }}
  ports:
    - port: {{ .Values.documentParser.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: document-parser
    release: {{ .Release.Name }}
