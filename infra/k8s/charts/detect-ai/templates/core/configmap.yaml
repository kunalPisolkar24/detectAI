apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "detect-ai.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "detect-ai.labels" . | nindent 4 }}
data:
  NODE_ENV: {{ .Values.global.environment | quote }}
  SKIP_ENV_VALIDATION: "true"
  
  # Service Inter-communication Endpoints
  AI_SERVICE_URL: "{{ include "detect-ai.fullname" . }}-inference-service:50051"
  FILE_EXTRACTOR_API_URL: "http://{{ include "detect-ai.fullname" . }}-document-parser-service:8000"
  
  # Databases and Broker Endpoints
  {{- if .Values.databases.redis.userCache.sentinel.enabled }}
  REDIS_MASTER_NAME: "mymaster"
  REDIS_SENTINELS: "{{ include "detect-ai.fullname" . }}-redis-usercache:26379"
  {{- else }}
  REDIS_URL: "redis://{{ include "detect-ai.fullname" . }}-redis-usercache:6379"
  {{- end }}
  
  REDIS_USAGE_URL: "redis://{{ include "detect-ai.fullname" . }}-redis-usage:6379"
  REDIS_USAGE_MODE: "standalone"
  
  EVENT_REDIS_URL: "redis://{{ include "detect-ai.fullname" . }}-redis-events:6379"
  EVENT_REDIS_MODE: "standalone"
  
  {{- if .Values.databases.redis.chat.cluster.enabled }}
  CHAT_REDIS_MODE: "cluster"
  CHAT_REDIS_ADDRS: "{{ include "detect-ai.fullname" . }}-redis-chat-leader:6379"
  {{- else }}
  CHAT_REDIS_MODE: "standalone"
  CHAT_REDIS_ADDRS: "{{ include "detect-ai.fullname" . }}-redis-chat:6379"
  {{- end }}
  
  {{- $mongoDb := .Values.databases.mongo.database | default "chats" }}
  {{- if .Values.databases.mongo.sharded }}
  MONGO_URL: "mongodb://{{ include "detect-ai.fullname" . }}-mongodb-router-service:27017/{{ $mongoDb }}"
  {{- else }}
  MONGO_URL: "mongodb://{{ include "detect-ai.fullname" . }}-mongodb-standalone-service:27017/{{ $mongoDb }}"
  {{- end }}

  POSTGRES_HOST: "{{ include "detect-ai.fullname" . }}-postgres"
  POSTGRES_DB: "detect-ai"
  POSTGRES_PORT: "5432"
  # NOTE: RABBITMQ_URL must be injected via the detect-ai-secrets Secret (key: RABBITMQ_URL)
  # to avoid leaking credentials in plaintext via the ConfigMap.

  # OpenTelemetry Distributed Tracing Configs
  {{- if and .Values.monitoring.enabled .Values.monitoring.tracing.enabled }}
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://{{ include "detect-ai.fullname" . }}-otel-collector:4318"
  OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
  {{- end }}
