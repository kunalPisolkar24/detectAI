{{- if .Values.global.secretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.global.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "detect-ai.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $val := .Values.secrets }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
{{- end }}
