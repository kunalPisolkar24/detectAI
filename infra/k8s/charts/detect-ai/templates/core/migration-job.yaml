{{- if or .Values.databases.postgres.enabled (and .Values.global (eq .Values.global.environment "production")) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migration-job
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    helm.sh/chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  template:
    metadata:
      name: "{{ .Release.Name }}-migration"
      labels:
        app.kubernetes.io/instance: {{ .Release.Name | quote }}
    spec:
      restartPolicy: Never
      {{- if .Values.global.secretName }}
      imagePullSecrets:
        - name: {{ .Values.global.secretName }}
      {{- end }}
      containers:
        - name: prisma-migrate
          image: "{{ .Values.web.image.repository }}-migrate:{{ .Values.web.image.tag | default "latest" }}"
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          envFrom:
            - secretRef:
                name: {{ .Values.global.secretName | default .Values.secretName }}
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "100m"
              memory: "256Mi"
  backoffLimit: 2
{{- end }}
