apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-chats-worker
  namespace: {{ .Release.Namespace }}
  labels:
    app: chats-worker
spec:
  replicas: {{ .Values.chats.worker.replicaCount }}
  selector:
    matchLabels:
      app: chats-worker
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: chats-worker
        release: {{ .Release.Name }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.chats.worker.metricsPort }}"
    spec:
      {{- if .Values.global.secretName }}
      imagePullSecrets:
        - name: {{ .Values.global.secretName }}
      {{- end }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: chats-worker
          image: "{{ .Values.chats.image.repository }}:{{ .Values.chats.image.tag }}"
          imagePullPolicy: {{ .Values.chats.image.pullPolicy }}
          command: ["/app/chats"]
          args: ["worker"]
          ports:
            - name: metrics
              containerPort: {{ .Values.chats.worker.metricsPort }}
              protocol: TCP
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
            - secretRef:
                name: {{ .Values.global.secretName | default .Values.secretName }}
          resources:
            {{- toYaml .Values.chats.worker.resources | nindent 12 }}
