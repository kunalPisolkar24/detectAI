        app: worker-payments
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.workers.payments.port }}"
    spec:
      {{- if .Values.global.secretName }}
      imagePullSecrets:
        - name: {{ .Values.global.secretName }}
      {{- end }}
      terminationGracePeriodSeconds: 45
      {{- with .Values.global.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: worker-payments
          {{- with .Values.global.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.workers.image.repository }}:{{ .Values.workers.image.tag }}"
          imagePullPolicy: {{ .Values.workers.image.pullPolicy }}
          command: ["bun", "run", "src/cmd/payments/index.ts"]
          ports:
            - name: metrics
              containerPort: {{ .Values.workers.payments.port }}
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 20
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 15"]
          {{- if and .Values.monitoring.enabled .Values.monitoring.tracing.enabled }}
          env:
            - name: OTEL_SERVICE_NAME
              value: "{{ include "detect-ai.fullname" . }}-worker-payments"
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "detect-ai.fullname" . }}-config
            - secretRef:
