# 1. Bun Analytics Worker
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "detect-ai.fullname" . }}-worker-analytics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "detect-ai.labels" . | nindent 4 }}
    app: worker-analytics
spec:
  {{- if not .Values.workers.analytics.keda.enabled }}
  replicas: {{ .Values.workers.analytics.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "detect-ai.selectorLabels" . | nindent 6 }}
      app: worker-analytics
  template:
    metadata:
      labels:
        {{- include "detect-ai.selectorLabels" . | nindent 8 }}
        app: worker-analytics
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.workers.analytics.port }}"
    spec:
      {{- if .Values.global.secretName }}
      imagePullSecrets:
        - name: {{ .Values.global.secretName }}
      {{- end }}
      terminationGracePeriodSeconds: 30
      {{- with .Values.global.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: worker-analytics
          {{- with .Values.global.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.workers.image.repository }}:{{ .Values.workers.image.tag }}"
          imagePullPolicy: {{ .Values.workers.image.pullPolicy }}
          command: ["bun", "run", "src/cmd/analytics/index.ts"]
          ports:
            - name: metrics
              containerPort: {{ .Values.workers.analytics.port }}
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 20
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
          {{- if and .Values.monitoring.enabled .Values.monitoring.tracing.enabled }}
          env:
            - name: OTEL_SERVICE_NAME
              value: "{{ include "detect-ai.fullname" . }}-worker-analytics"
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "detect-ai.fullname" . }}-config
            - secretRef:
                name: {{ .Values.global.secretName }}
          resources:
            {{- toYaml .Values.workers.analytics.resources | nindent 12 }}

