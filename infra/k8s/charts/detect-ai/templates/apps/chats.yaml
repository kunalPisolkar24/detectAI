# 1. Chats API gRPC Server
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "detect-ai.fullname" . }}-chats-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "detect-ai.labels" . | nindent 4 }}
    app: chats-api
spec:
  replicas: {{ .Values.chats.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "detect-ai.selectorLabels" . | nindent 6 }}
      app: chats-api
  template:
    metadata:
      labels:
        {{- include "detect-ai.selectorLabels" . | nindent 8 }}
        app: chats-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.chats.api.service.metricsPort }}"
    spec:
      {{- if .Values.global.secretName }}
      imagePullSecrets:
        - name: {{ .Values.global.secretName }}
      {{- end }}
      terminationGracePeriodSeconds: 30
      {{- with .Values.global.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "detect-ai.selectorLabels" . | nindent 20 }}
                    app: chats-api
                topologyKey: "kubernetes.io/hostname"
      containers:
        - name: chats-api
          {{- with .Values.global.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.chats.image.repository }}:{{ .Values.chats.image.tag }}"
          imagePullPolicy: {{ .Values.chats.image.pullPolicy }}
          command: ["/app/chat-service"]
          args: ["server"]
          ports:
            - name: grpc
              containerPort: {{ .Values.chats.api.service.grpcPort }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.chats.api.service.metricsPort }}
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: grpc
            initialDelaySeconds: 15
            periodSeconds: 20
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
          env:
            - name: SERVICE_ROLE
              value: "api"
            {{- if and .Values.monitoring.enabled .Values.monitoring.tracing.enabled }}
            - name: OTEL_SERVICE_NAME
              value: "{{ include "detect-ai.fullname" . }}-chats-api"
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "detect-ai.fullname" . }}-config
            - secretRef:
                name: {{ .Values.global.secretName }}
          resources:
            {{- toYaml .Values.chats.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "detect-ai.fullname" . }}-chats-service
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "detect-ai.labels" . | nindent 4 }}
    app: chats-api
spec:
  type: {{ .Values.chats.api.service.type | default "ClusterIP" }}
  ports:
    - port: {{ .Values.chats.api.service.grpcPort }}
      targetPort: grpc
      protocol: TCP
      name: grpc
    - port: {{ .Values.chats.api.service.metricsPort }}
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "detect-ai.selectorLabels" . | nindent 4 }}
    app: chats-api

---
# 2. Chats Background Event Worker
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "detect-ai.fullname" . }}-chats-worker
