spec:
  replicas: {{ .Values.chats.worker.replicaCount }}
  selector:
    matchLabels:
      {{- include "detect-ai.selectorLabels" . | nindent 6 }}
      app: chats-worker
  template:
    metadata:
      labels:
        {{- include "detect-ai.selectorLabels" . | nindent 8 }}
        app: chats-worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.chats.worker.metricsPort }}"
    spec:
      {{- if .Values.global.secretName }}
      imagePullSecrets:
        - name: {{ .Values.global.secretName }}
      {{- end }}
      terminationGracePeriodSeconds: 30
      {{- with .Values.global.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: chats-worker
          {{- with .Values.global.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.chats.image.repository }}:{{ .Values.chats.image.tag }}"
          imagePullPolicy: {{ .Values.chats.image.pullPolicy }}
          command: ["/app/chat-service"]
          args: ["worker"]
          ports:
            - name: metrics
              containerPort: {{ .Values.chats.worker.metricsPort }}
              protocol: TCP
          lifecycle:
