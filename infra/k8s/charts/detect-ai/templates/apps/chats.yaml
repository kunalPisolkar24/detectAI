# 1. Chats API gRPC Server
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-chats-api
  namespace: {{ .Release.Namespace }}
  labels:
    app: chats-api
spec:
  replicas: {{ .Values.chats.api.replicaCount }}
  selector:
    matchLabels:
      app: chats-api
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: chats-api
        release: {{ .Release.Name }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.chats.api.service.metricsPort }}"
    spec:
      {{- if .Values.global.secretName }}
      imagePullSecrets:
        - name: {{ .Values.global.secretName }}
      {{- end }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: chats-api
          image: "{{ .Values.chats.image.repository }}:{{ .Values.chats.image.tag }}"
          imagePullPolicy: {{ .Values.chats.image.pullPolicy }}
          command: ["/app/chats"]
          args: ["server"]
          ports:
            - name: grpc
              containerPort: {{ .Values.chats.api.service.grpcPort }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.chats.api.service.metricsPort }}
              protocol: TCP
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
            - secretRef:
                name: {{ .Values.global.secretName | default .Values.secretName }}
          resources:
            {{- toYaml .Values.chats.api.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-chats-service
  namespace: {{ .Release.Namespace }}
  labels:
    app: chats-api
spec:
  type: {{ .Values.chats.api.service.type | default "ClusterIP" }}
  ports:
    - port: {{ .Values.chats.api.service.grpcPort }}
      targetPort: grpc
      protocol: TCP
      name: grpc
    - port: {{ .Values.chats.api.service.metricsPort }}
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    app: chats-api
    release: {{ .Release.Name }}

---
# 2. Chats Background Event Worker
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-chats-worker
  namespace: {{ .Release.Namespace }}
  labels:
    app: chats-worker
spec:
  replicas: {{ .Values.chats.worker.replicaCount }}
  selector:
    matchLabels:
      app: chats-worker
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: chats-worker
        release: {{ .Release.Name }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.chats.worker.metricsPort }}"
    spec:
      {{- if .Values.global.secretName }}
      imagePullSecrets:
        - name: {{ .Values.global.secretName }}
      {{- end }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: chats-worker
          image: "{{ .Values.chats.image.repository }}:{{ .Values.chats.image.tag }}"
          imagePullPolicy: {{ .Values.chats.image.pullPolicy }}
          command: ["/app/chats"]
          args: ["worker"]
          ports:
            - name: metrics
              containerPort: {{ .Values.chats.worker.metricsPort }}
              protocol: TCP
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
            - secretRef:
                name: {{ .Values.global.secretName | default .Values.secretName }}
          resources:
            {{- toYaml .Values.chats.worker.resources | nindent 12 }}
