            - secretRef:
                name: {{ .Values.global.secretName }}
          resources:
            {{- toYaml .Values.chats.worker.resources | nindent 12 }}

---
# 3. Chats API Optional HPA
{{- if .Values.chats.api.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "detect-ai.fullname" . }}-chats-api-hpa
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "detect-ai.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "detect-ai.fullname" . }}-chats-api
  minReplicas: {{ .Values.chats.api.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.chats.api.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.chats.api.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
