apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "detect-ai.fullname" . }}-document-parser
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "detect-ai.labels" . | nindent 4 }}
    app: document-parser
spec:
  replicas: {{ .Values.documentParser.replicaCount }}
  selector:
    matchLabels:
      {{- include "detect-ai.selectorLabels" . | nindent 6 }}
      app: document-parser
  template:
    metadata:
      labels:
        {{- include "detect-ai.selectorLabels" . | nindent 8 }}
        app: document-parser
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      {{- if .Values.global.secretName }}
      imagePullSecrets:
        - name: {{ .Values.global.secretName }}
      {{- end }}
      terminationGracePeriodSeconds: 30
      {{- with .Values.global.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "detect-ai.selectorLabels" . | nindent 20 }}
                    app: document-parser
                topologyKey: "kubernetes.io/hostname"
      containers:
        - name: document-parser
          {{- with .Values.global.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.documentParser.image.repository }}:{{ .Values.documentParser.image.tag }}"
          imagePullPolicy: {{ .Values.documentParser.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          {{- if and .Values.monitoring.enabled .Values.monitoring.tracing.enabled }}
          env:
            - name: OTEL_SERVICE_NAME
              value: "{{ include "detect-ai.fullname" . }}-document-parser"
          {{- end }}
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          envFrom:
            - configMapRef:
                name: {{ include "detect-ai.fullname" . }}-config
            - secretRef:
                name: {{ .Values.global.secretName }}
          resources:
            {{- toYaml .Values.documentParser.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "detect-ai.fullname" . }}-document-parser-service
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "detect-ai.labels" . | nindent 4 }}
    app: document-parser
spec:
  type: {{ .Values.documentParser.service.type | default "ClusterIP" }}
  ports:
    - port: {{ .Values.documentParser.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "detect-ai.selectorLabels" . | nindent 4 }}
    app: document-parser

---
# Optional HPA for document-parser
{{- if .Values.documentParser.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "detect-ai.fullname" . }}-document-parser-hpa
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "detect-ai.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "detect-ai.fullname" . }}-document-parser
  minReplicas: {{ .Values.documentParser.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.documentParser.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.documentParser.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
