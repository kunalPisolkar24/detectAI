{{- if .Values.databases.mongo.sharded }}

# 1. MongoDB Config Server StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-mongodb-config
  namespace: {{ .Release.Namespace }}
  labels:
    app: mongodb-config
spec:
  serviceName: {{ .Release.Name }}-mongodb-config
  replicas: 1
  selector:
    matchLabels:
      app: mongodb-config
  template:
    metadata:
      labels:
        app: mongodb-config
    spec:
      containers:
        - name: mongodb-config
          image: "mongo:6.0"
          command: ["mongod", "--configsvr", "--replSet", "configRS", "--bind_ip_all", "--port", "27017"]
          ports:
            - name: mongo
              containerPort: 27017
              protocol: TCP
          resources:
            {{- toYaml .Values.databases.mongo.resources | nindent 12 }}
          volumeMounts:
            - name: mongo-config-data
              mountPath: /data/db
  volumeClaimTemplates:
    - metadata:
        name: mongo-config-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: {{ .Values.databases.storageClass | quote }}
        resources:
          requests:
            storage: "2Gi"
---
# Config Service
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-mongodb-config
  namespace: {{ .Release.Namespace }}
spec:
  clusterIP: None
  ports:
    - port: 27017
      targetPort: mongo
      name: mongo
  selector:
    app: mongodb-config

---
