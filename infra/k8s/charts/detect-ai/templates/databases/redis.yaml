{{- $fullname := include "detect-ai.fullname" . }}
{{- $sc := .Values.databases.storageClass | quote }}
{{- $redisImage := .Values.databases.redis.image }}
{{- $sentinelImage := .Values.databases.redis.sentinel.image }}
{{- $sentinelTag := .Values.databases.redis.sentinel.tag }}
{{- $exporterImage := .Values.databases.redis.exporter.image }}
{{- $exporterTag := .Values.databases.redis.exporter.tag }}
{{- $redisSecret := .Values.databases.redis.passwordSecretName }}
{{- $psc := .Values.global.podSecurityContext }}

---
# 1. User Cache Redis — Sentinel HA (prod) or Standalone (dev)
{{- if .Values.databases.redis.userCache.sentinel.enabled }}
apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: RedisReplication
metadata:
  name: {{ $fullname }}-redis-usercache
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "detect-ai.labels" . | nindent 4 }}
spec:
  clusterSize: {{ .Values.databases.redis.userCache.clusterSize }}
  kubernetesConfig:
    image: {{ $redisImage | quote }}
    imagePullPolicy: IfNotPresent
    {{- if $redisSecret }}
    redisSecret:
      name: {{ $redisSecret }}
    {{- end }}
    service:
      serviceType: ClusterIP
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
  redisExporter:
    enabled: true
    image: {{ $exporterImage | quote }}
    tag: {{ $exporterTag | quote }}
    imagePullPolicy: IfNotPresent
  sentinel:
    enabled: true
    image: {{ $sentinelImage | quote }}
    tag: {{ $sentinelTag | quote }}
    imagePullPolicy: IfNotPresent
    size: {{ .Values.databases.redis.userCache.sentinelSize }}
    parallelSyncs: "1"
    failoverTimeout: "60000"
    downAfterMilliseconds: "5000"
  storage:
    volumeClaimTemplate:
      spec:
        storageClassName: {{ $sc }}
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.databases.redis.userCache.storageSize }}
  podSecurityContext:
    {{- toYaml $psc | nindent 4 }}
{{- else }}
apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: Redis
metadata:
  name: {{ $fullname }}-redis-usercache
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "detect-ai.labels" . | nindent 4 }}
spec:
  kubernetesConfig:
    image: {{ $redisImage | quote }}
    imagePullPolicy: IfNotPresent
    {{- if $redisSecret }}
    redisSecret:
      name: {{ $redisSecret }}
    {{- end }}
    service:
      serviceType: ClusterIP
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "100m"
        memory: "128Mi"
  redisExporter:
    enabled: true
    image: {{ $exporterImage | quote }}
    tag: {{ $exporterTag | quote }}
    imagePullPolicy: IfNotPresent
  storage:
    volumeClaimTemplate:
      spec:
        storageClassName: {{ $sc }}
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.databases.redis.userCache.storageSize }}
  podSecurityContext:
    {{- toYaml $psc | nindent 4 }}
{{- end }}

---
# 2. Usage Redis — Standalone
apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: Redis
metadata:
  name: {{ $fullname }}-redis-usage
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "detect-ai.labels" . | nindent 4 }}
spec:
  kubernetesConfig:
    image: {{ $redisImage | quote }}
    imagePullPolicy: IfNotPresent
    {{- if $redisSecret }}
    redisSecret:
      name: {{ $redisSecret }}
    {{- end }}
    service:
      serviceType: ClusterIP
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "100m"
        memory: "128Mi"
  redisExporter:
    enabled: true
    image: {{ $exporterImage | quote }}
    tag: {{ $exporterTag | quote }}
    imagePullPolicy: IfNotPresent
  storage:
    volumeClaimTemplate:
      spec:
        storageClassName: {{ $sc }}
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.databases.redis.usage.storageSize }}
  podSecurityContext:
    {{- toYaml $psc | nindent 4 }}

---
# 3. Events Redis — Standalone
apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: Redis
metadata:
  name: {{ $fullname }}-redis-events
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "detect-ai.labels" . | nindent 4 }}
spec:
  kubernetesConfig:
    image: {{ $redisImage | quote }}
    imagePullPolicy: IfNotPresent
    {{- if $redisSecret }}
    redisSecret:
      name: {{ $redisSecret }}
    {{- end }}
    service:
      serviceType: ClusterIP
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "100m"
        memory: "128Mi"
  redisExporter:
    enabled: true
    image: {{ $exporterImage | quote }}
    tag: {{ $exporterTag | quote }}
    imagePullPolicy: IfNotPresent
  redisConfig:
    appendonly: {{ .Values.databases.redis.events.appendonly | quote }}
    save: {{ .Values.databases.redis.events.save | quote }}
    maxmemory-policy: {{ .Values.databases.redis.events.maxmemoryPolicy | quote }}
  storage:
    volumeClaimTemplate:
      spec:
        storageClassName: {{ $sc }}
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.databases.redis.events.storageSize }}
  podSecurityContext:
    {{- toYaml $psc | nindent 4 }}

---
# 4. Chat Redis — Cluster (prod) or Standalone (dev)
{{- if .Values.databases.redis.chat.cluster.enabled }}
apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: RedisCluster
metadata:
  name: {{ $fullname }}-redis-chat
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "detect-ai.labels" . | nindent 4 }}
spec:
  clusterSize: {{ .Values.databases.redis.chat.leaderReplicas }}
  kubernetesConfig:
    image: {{ $redisImage | quote }}
    imagePullPolicy: IfNotPresent
    {{- if $redisSecret }}
    redisSecret:
      name: {{ $redisSecret }}
    {{- end }}
    service:
      serviceType: ClusterIP
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
  redisExporter:
    enabled: true
    image: {{ $exporterImage | quote }}
    tag: {{ $exporterTag | quote }}
    imagePullPolicy: IfNotPresent
  storage:
    nodeConfVolume: true
    nodeConfVolumeClaimTemplate:
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: "1Gi"
    volumeClaimTemplate:
      spec:
        storageClassName: {{ $sc }}
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.databases.redis.chat.storageSize }}
  redisLeader:
    replicas: {{ .Values.databases.redis.chat.leaderReplicas }}
    serviceType: ClusterIP
  redisFollower:
    replicas: {{ .Values.databases.redis.chat.followerReplicas }}
    serviceType: ClusterIP
  podSecurityContext:
    {{- toYaml $psc | nindent 4 }}
{{- else }}
apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: Redis
metadata:
  name: {{ $fullname }}-redis-chat
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "detect-ai.labels" . | nindent 4 }}
spec:
  kubernetesConfig:
    image: {{ $redisImage | quote }}
    imagePullPolicy: IfNotPresent
    {{- if $redisSecret }}
    redisSecret:
      name: {{ $redisSecret }}
    {{- end }}
    service:
      serviceType: ClusterIP
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "100m"
        memory: "128Mi"
  redisExporter:
    enabled: true
    image: {{ $exporterImage | quote }}
    tag: {{ $exporterTag | quote }}
    imagePullPolicy: IfNotPresent
  storage:
    volumeClaimTemplate:
      spec:
        storageClassName: {{ $sc }}
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.databases.redis.chat.storageSize }}
  podSecurityContext:
    {{- toYaml $psc | nindent 4 }}
{{- end }}