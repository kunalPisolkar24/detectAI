{{- $fullname := include "detect-ai.fullname" . }}
{{- $sc := .Values.databases.storageClass | quote }}

---
# 1. User Cache Redis — Sentinel HA (prod) or Standalone (dev)
{{- if .Values.databases.redis.userCache.sentinel.enabled }}
apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: RedisReplication
metadata:
  name: {{ $fullname }}-redis-usercache
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "detect-ai.labels" . | nindent 4 }}
spec:
  clusterSize: {{ .Values.databases.redis.userCache.clusterSize }}
  kubernetesConfig:
    image: "quay.io/opstree/redis:v7.0.15"
    imagePullPolicy: IfNotPresent
    service:
      serviceType: ClusterIP
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
  redisExporter:
    enabled: true
    image: quay.io/opstree/redis-exporter
    tag: v1.44.0
    imagePullPolicy: IfNotPresent
  sentinel:
    enabled: true
    image: quay.io/opstree/redis-sentinel
    tag: v7.0.15
    imagePullPolicy: IfNotPresent
    size: {{ .Values.databases.redis.userCache.sentinelSize }}
    parallelSyncs: "1"
    failoverTimeout: "60000"
    downAfterMilliseconds: "5000"
  storage:
    volumeClaimTemplate:
      spec:
        storageClassName: {{ $sc }}
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.databases.redis.userCache.storageSize }}
  podSecurityContext:
    runAsUser: 1000
    fsGroup: 1000
{{- else }}
apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: Redis
metadata:
  name: {{ $fullname }}-redis-usercache
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "detect-ai.labels" . | nindent 4 }}
spec:
  kubernetesConfig:
    image: "quay.io/opstree/redis:v7.0.15"
    imagePullPolicy: IfNotPresent
    service:
      serviceType: ClusterIP
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "100m"
        memory: "128Mi"
  redisExporter:
    enabled: true
    image: quay.io/opstree/redis-exporter
    tag: v1.44.0
    imagePullPolicy: IfNotPresent
  storage:
    volumeClaimTemplate:
      spec:
        storageClassName: {{ $sc }}
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.databases.redis.userCache.storageSize }}
  podSecurityContext:
    runAsUser: 1000
    fsGroup: 1000
{{- end }}

