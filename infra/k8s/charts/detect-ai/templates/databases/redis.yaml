---
# 4. Chat Redis — Cluster (prod) or Standalone (dev)
{{- if .Values.databases.redis.chat.cluster.enabled }}
apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: RedisCluster
metadata:
  name: {{ $fullname }}-redis-chat
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "detect-ai.labels" . | nindent 4 }}
spec:
  clusterSize: {{ .Values.databases.redis.chat.leaderReplicas }}
  kubernetesConfig:
    image: "quay.io/opstree/redis:v7.0.15"
    imagePullPolicy: IfNotPresent
    service:
      serviceType: ClusterIP
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
  redisExporter:
    enabled: true
    image: quay.io/opstree/redis-exporter
    tag: v1.44.0
    imagePullPolicy: IfNotPresent
  storage:
    nodeConfVolume: true
    nodeConfVolumeClaimTemplate:
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: "1Gi"
    volumeClaimTemplate:
      spec:
        storageClassName: {{ $sc }}
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.databases.redis.chat.storageSize }}
  redisLeader:
    replicas: {{ .Values.databases.redis.chat.leaderReplicas }}
    serviceType: ClusterIP
  redisFollower:
    replicas: {{ .Values.databases.redis.chat.followerReplicas }}
    serviceType: ClusterIP
  podSecurityContext:
    runAsUser: 1000
    fsGroup: 1000
{{- else }}
apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: Redis
metadata:
  name: {{ $fullname }}-redis-chat
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "detect-ai.labels" . | nindent 4 }}
spec:
  kubernetesConfig:
    image: "quay.io/opstree/redis:v7.0.15"
    imagePullPolicy: IfNotPresent
    service:
      serviceType: ClusterIP
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "100m"
        memory: "128Mi"
  redisExporter:
    enabled: true
    image: quay.io/opstree/redis-exporter
    tag: v1.44.0
    imagePullPolicy: IfNotPresent
  storage:
    volumeClaimTemplate:
      spec:
        storageClassName: {{ $sc }}
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.databases.redis.chat.storageSize }}
  podSecurityContext:
    runAsUser: 1000
    fsGroup: 1000
{{- end }}