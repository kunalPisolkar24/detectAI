apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "detect-ai.fullname" . }}-postgres-users
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "detect-ai.labels" . | nindent 4 }}
    app: postgres-users
spec:
  serviceName: {{ include "detect-ai.fullname" . }}-postgres-users-headless
  replicas: 1
  selector:
    matchLabels:
      {{- include "detect-ai.selectorLabels" . | nindent 6 }}
      app: postgres-users
  template:
    metadata:
      labels:
        {{- include "detect-ai.selectorLabels" . | nindent 8 }}
        app: postgres-users
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9187"
    spec:
      containers:
        # Postgres Database Container
        - name: postgres
          image: "postgres:16-alpine"
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_DB
              value: "detect-ai"
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secretName }}
                  key: POSTGRES_PASSWORD
          # Native Liveness, Readiness and Startup probes
          startupProbe:
            exec:
              command:
                - "sh"
                - "-c"
                - "pg_isready -U postgres -d detect-ai"
            failureThreshold: 15
            periodSeconds: 2
          readinessProbe:
            exec:
              command:
                - "sh"
                - "-c"
                - "pg_isready -U postgres -d detect-ai"
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - "sh"
                - "-c"
                - "pg_isready -U postgres -d detect-ai"
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.databases.postgresUsers.resources | nindent 12 }}
          volumeMounts:
            - name: postgres-users-data
              mountPath: /var/lib/postgresql/data
        # sidecar postgres-exporter for Prometheus scraping
        - name: postgres-exporter
          image: "prometheuscommunity/postgres-exporter:v0.15.0"
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 9187
              protocol: TCP
          env:
            - name: DATA_SOURCE_NAME
              value: "postgresql://postgres:$(POSTGRES_PASSWORD)@localhost:5432/detect-ai?sslmode=disable"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.secretName }}
                  key: POSTGRES_PASSWORD
          resources:
            limits:
              cpu: "100m"
              memory: "128Mi"
            requests:
              cpu: "50m"
              memory: "64Mi"
  volumeClaimTemplates:
    - metadata:
        name: postgres-users-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: {{ .Values.databases.storageClass | quote }}
        resources:
          requests:
            storage: {{ .Values.databases.postgresUsers.storageSize }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "detect-ai.fullname" . }}-postgres-users
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "detect-ai.labels" . | nindent 4 }}
    app: postgres-users
spec:
  ports:
    - port: 5432
      targetPort: postgres
      protocol: TCP
      name: postgres
    - port: 9187
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "detect-ai.selectorLabels" . | nindent 4 }}
    app: postgres-users
---
# Headless service for stable pod DNS identities (required by StatefulSet)
apiVersion: v1
kind: Service
metadata:
  name: {{ include "detect-ai.fullname" . }}-postgres-users-headless
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "detect-ai.labels" . | nindent 4 }}
    app: postgres-users
spec:
  clusterIP: None
  ports:
    - port: 5432
      targetPort: postgres
      protocol: TCP
      name: postgres
  selector:
    {{- include "detect-ai.selectorLabels" . | nindent 4 }}
    app: postgres-users
