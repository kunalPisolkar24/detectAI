{{- if .Values.monitoring.enabled }}

# Helper template to generate ServiceMonitors dynamically
{{- $fullname := include "detect-ai.fullname" . }}
{{- $prometheusRelease := .Values.monitoring.prometheus.release | default "prometheus" }}

# 1. Stateless App & Worker Monitors
{{- range $app := list "web" "chats-api" "chats-worker" "payments-gateway" "inference" "worker-analytics" "worker-cron" "worker-payments" }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $fullname }}-{{ $app }}-monitor
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "detect-ai.labels" $ | nindent 4 }}
    release: {{ $prometheusRelease }}
spec:
  selector:
    matchLabels:
      {{- include "detect-ai.selectorLabels" $ | nindent 6 }}
      app: {{ $app }}
  endpoints:
    - port: {{ if eq $app "web" }}http{{ else if eq $app "payments-gateway" }}http{{ else if eq $app "chats-api" }}metrics{{ else }}metrics{{ end }}
      interval: 15s
{{- end }}

# 2. Database Exporter Monitors
{{- range $db := list "postgres" "rabbitmq" "mongodb-router" "mongodb-standalone" }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $fullname }}-{{ $db }}-monitor
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "detect-ai.labels" $ | nindent 4 }}
    release: {{ $prometheusRelease }}
spec:
  selector:
    matchLabels:
      {{- include "detect-ai.selectorLabels" $ | nindent 6 }}
      app: {{ if contains "mongodb" $db }}mongodb{{ else }}{{ $db }}{{ end }}
  endpoints:
    - port: metrics
      interval: 15s
{{- end }}

# 3. Redis Exporter Monitors (operator-managed)
{{- range $redis := list "redis-usercache" "redis-usage" "redis-events" "redis-chat-leader" "redis-chat-follower" }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $fullname }}-{{ $redis }}-monitor
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "detect-ai.labels" $ | nindent 4 }}
    release: {{ $prometheusRelease }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $fullname }}-{{ $redis }}
  endpoints:
    - port: redis-exporter
      interval: 15s
  relabelings:
    - sourceLabels: [__meta_kubernetes_service_label_app_kubernetes_io_name]
      targetLabel: app
      replacement: ${1}
{{- end }}

{{- end }}
