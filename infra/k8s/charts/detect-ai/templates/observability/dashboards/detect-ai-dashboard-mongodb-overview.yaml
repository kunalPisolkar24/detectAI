{{- if and .Values.monitoring.enabled .Values.monitoring.kube-prometheus-stack.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "detect-ai.fullname" . }}-db-mongodb-overview
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "detect-ai.labels" . | nindent 4 }}
    grafana_dashboard: "1"
  annotations:
    grafana_dashboard_folder: "Infrastructure"
data:
