            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "100 * avg(up{job=~\"postgres-primary|postgres-replica\"})",
              "legendFormat": "",
              "range": true,
              "refId": "A"
