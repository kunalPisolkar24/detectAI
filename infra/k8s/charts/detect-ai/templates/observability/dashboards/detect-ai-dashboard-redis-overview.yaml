            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "auto"
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "100 * avg(up{job=~\".*redis.*\"})",
              "legendFormat": "",
              "range": true,
              "refId": "A"
            }
