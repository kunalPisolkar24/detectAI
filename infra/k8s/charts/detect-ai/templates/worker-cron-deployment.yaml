apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-worker-cron
  namespace: {{ .Release.Namespace }}
  labels:
    app: worker-cron
spec:
  replicas: {{ .Values.workers.cron.replicaCount }}
  selector:
    matchLabels:
      app: worker-cron
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: worker-cron
        release: {{ .Release.Name }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.workers.cron.port }}"
    spec:
      {{- if .Values.global.secretName }}
      imagePullSecrets:
        - name: {{ .Values.global.secretName }}
      {{- end }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: worker-cron
          image: "{{ .Values.workers.image.repository }}:{{ .Values.workers.image.tag }}"
          imagePullPolicy: {{ .Values.workers.image.pullPolicy }}
          command: ["bun", "run", "src/modules/cron/index.ts"]
          ports:
            - name: metrics
              containerPort: {{ .Values.workers.cron.port }}
              protocol: TCP
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
            - secretRef:
                name: {{ .Values.global.secretName | default .Values.secretName }}
          resources:
            {{- toYaml .Values.workers.cron.resources | nindent 12 }}
