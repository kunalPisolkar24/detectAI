services:
  postgres-primary:
    image: postgres:15-alpine
    container_name: detect_ai_pg_primary
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: detect_ai
      POSTGRES_HOST_AUTH_METHOD: md5
      POSTGRES_INITDB_ARGS: "--auth-host=md5"
    command: |
      postgres 
      -c wal_level=replica 
      -c hot_standby=on 
      -c max_wal_senders=10 
      -c max_replication_slots=10 
      -c hot_standby_feedback=on
    networks:
      - detectai_net
    volumes:
      - pg_primary_data:/var/lib/postgresql/data
      - ./scripts/init_replication.sql:/docker-entrypoint-initdb.d/init_replication.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d detect_ai"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-replica:
    image: postgres:15-alpine
    container_name: detect_ai_pg_replica
    restart: unless-stopped
    environment:
      PGUSER: replicator
      PGPASSWORD: replicator_password
    depends_on:
      postgres-primary:
        condition: service_healthy
    networks:
      - detectai_net
    volumes:
      - pg_replica_data:/var/lib/postgresql/data
    command: |
      bash -c "
      until pg_isready -h postgres-primary -p 5432 -U replicator; do
        sleep 1
      done
      if [ ! -s /var/lib/postgresql/data/PG_VERSION ]; then
        pg_basebackup -h postgres-primary -D /var/lib/postgresql/data -U replicator -v -P -R -X stream -C -S replica_slot_node_1
      fi
      chmod 0700 /var/lib/postgresql/data
      postgres -c hot_standby=on
      "
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U replicator -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg_primary_data:
  pg_replica_data: