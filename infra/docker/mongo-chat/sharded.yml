# Sharded mongo-chat (throwaway verification for DocumentDB elastic sharding).
# Mirrors Floci's mongo:7.0 image but with mongos/configsvr/shardsvr topology.
# Usage:
#   docker compose -f services/chats/infra/compose.sharded.yml up -d --build
#   mongosh mongodb://localhost:27017/chat_db --eval 'db.messages.getShardDistribution()'
#   mongosh mongodb://localhost:27017/chat_db --eval 'db.messages.find({chat_id:"..."}).explain()'
# Verify then delete: docker compose -f services/chats/infra/compose.sharded.yml down -v && rm this file + compose.sharded.yml
# chats stays UNSHARDED; messages sharded on {chat_id:hashed} only.
x-mongo-sharded-base: &mongo-sharded-base
  image: mongo:7.0
  restart: unless-stopped

services:
  mongo-configsvr:
    <<: *mongo-sharded-base
    command: mongod --configsvr --replSet cfg-rs --bind_ip_all --port 27017
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      - mongo_config_data:/data/db

  mongo-shard1:
    <<: *mongo-sharded-base
    command: mongod --shardsvr --replSet shard1-rs --bind_ip_all --port 27017
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      - mongo_shard1_data:/data/db

  mongo-shard2:
    <<: *mongo-sharded-base
    command: mongod --shardsvr --replSet shard2-rs --bind_ip_all --port 27017
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      - mongo_shard2_data:/data/db

  mongos:
    <<: *mongo-sharded-base
    command: mongos --configdb cfg-rs/mongo-configsvr:27017 --bind_ip_all --port 27017
    depends_on:
      mongo-configsvr:
        condition: service_healthy
      mongo-shard1:
        condition: service_healthy
      mongo-shard2:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    ports:
      - "${MONGO_SHARDED_PORT:-27019}:27017"

  mongo-sharded-init:
    <<: *mongo-sharded-base
    depends_on:
      mongos:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/scripts/init-sharding.sh"]
    volumes:
      - ./scripts/init-sharding.sh:/scripts/init-sharding.sh:ro

volumes:
  mongo_config_data:
  mongo_shard1_data:
  mongo_shard2_data:
