version: '3.8'
services:
  rabbitmq:
    image: rabbitmq:3-management
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - detectai_net

  detect-ai-web:
    build:
      context: ../../
      dockerfile: apps/web/Dockerfile
    restart: always
    ports:
      - "3000:3000"
    networks:
      - detectai_net
    env_file:
      - ../../apps/web/.env
    volumes:
      - ../../:/app
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/packages/ui/node_modules
    command: sh -c "pnpm --filter web run prisma:migrate && pnpm --filter web run dev"
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  gateway:
    build: 
      context: ../../services/payment-service/gateway-go
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8080:8080"
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - PORT=8080
    env_file:
      - ../../services/payment-service/gateway-go/.env
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - detectai_net

  worker:
    build: 
      context: ../../services/payment-service/worker-bun
      dockerfile: Dockerfile
    restart: always
    ports:
      - "7777:7777"
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    env_file:
      - ../../services/payment-service/worker-bun/.env
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - detectai_net

networks:
  detectai_net:
    driver: bridge