version: '3.8'
services:
  ml-http:
    image: kunalpisolkar/detect-ai:latest
    restart: always
    ports:
      - "5001:5000"
    networks:
      - detectai_net
    env_file:
      - ../../services/ml-http/.env

  detect-ai-web:
    build:
      context: ../../
      dockerfile: apps/web/Dockerfile
    restart: always
    ports:
      - "3000:3000"
    networks:
      - detectai_net
    env_file:
      - ../../apps/web/.env
    volumes:
      - ../../:/app
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/packages/ui/node_modules
    command: sh -c "pnpm --filter web run prisma:migrate && pnpm --filter web run dev"
    depends_on:
      ml-http:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  detectai_net:
    driver: bridge