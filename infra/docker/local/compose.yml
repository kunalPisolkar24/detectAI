# Full-stack DEV compose: all app services + standalone infra atoms.
#
# Usage (from repo root):
#   cp infra/docker/local/.env.example infra/docker/local/.env
#   make local-up        # or: make local-build / make local-config
#
# Single-stack rule: never run `local` and `prod` at the same time
# (Makefile guards this). `down -v` on one stack never touches the other
# (project names differ: detectai-local vs detectai-prod).
#
# Infra comes from the importable atoms (single definition each, no
# duplication). Host-port map (defaults, all overridable via .env):
#   3000 web | 8080 gateway | 8000 doc-parser | 50051+8333 inference
#   50052+9095 chat-api | 9099 chat-worker | 7001/7002/7003 workers
#   5432 pg | 6379 redis-users | 6381 redis-chat | 6382 redis-events
#   27018 mongo | 5672 mq + 15672 mq UI
# NOTE: redis-events is remapped to 6382 here (upstream atom defaults to
# 6381, which collides with redis-chat).
name: detectai-local

include:
  - path: ../postgres-users/standalone.yml
  - path: ../redis-users/standalone.yml
  - path: ../redis-chat/standalone.yml
  - path: ../redis-events/standalone.yml
  - path: ../mongo-chat/standalone.yml
  - path: ../rabbitmq/standalone.yml
  - path: ../rabbitmq/management.yml

services:
  # -- infra host-port bindings (atoms publish pg/redis-users/mq themselves) --
  mongo-chat:
    ports:
      - "${MONGO_CHAT_PORT:-27018}:27017"

  redis-chat:
    ports:
      - "${REDIS_CHAT_PORT:-6381}:6379"

  redis-events:
    ports:
      - "${EVENT_REDIS_PORT:-6382}:6379"

  # -- web ------------------------------------------------------------------
  db-migrate:
    build:
      context: ../../../apps/web
      dockerfile: Dockerfile
      target: migrate
    restart: "no"
    environment:
      - DATABASE_URL=${DATABASE_URL}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres-users:
        condition: service_healthy

  frontend:
    container_name: detect_ai_frontend
    build:
      context: ../../../apps/web
      dockerfile: Dockerfile
      args:
        ENV_TYPE: ${ENV_TYPE:-dev}
        NEXT_PUBLIC_ENV_TYPE: ${NEXT_PUBLIC_ENV_TYPE:-${ENV_TYPE:-dev}}
        NEXT_PUBLIC_PREVIEW_MODE: ${NEXT_PUBLIC_PREVIEW_MODE:-false}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY}
        NEXT_PUBLIC_PADDLE_CLIENT_TOKEN: ${NEXT_PUBLIC_PADDLE_CLIENT_TOKEN}
    restart: always
    environment:
      - ENV_TYPE=${ENV_TYPE:-dev}
      - NEXT_PUBLIC_ENV_TYPE=${NEXT_PUBLIC_ENV_TYPE:-${ENV_TYPE:-dev}}
      - NEXT_PUBLIC_PREVIEW_MODE=${NEXT_PUBLIC_PREVIEW_MODE:-false}
      - NODE_ENV=${NODE_ENV}
      - LOG_LEVEL=${LOG_LEVEL}
      - DB_POOL_MAX=${DB_POOL_MAX:-}
      - GITHUB_ID=${GITHUB_ID:-}
      - GITHUB_SECRET=${GITHUB_SECRET:-}
      - GOOGLE_ID=${GOOGLE_ID:-}
      - GOOGLE_SECRET=${GOOGLE_SECRET:-}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-}
      - DATABASE_URL=${DATABASE_URL:-}
      - DATABASE_URL_REPLICA=${DATABASE_URL_REPLICA:-}
      - REDIS_URL=${REDIS_URL:-}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - NEXT_PUBLIC_TURNSTILE_SITE_KEY=${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY:-}
      - NEXT_PUBLIC_PADDLE_CLIENT_TOKEN=${NEXT_PUBLIC_PADDLE_CLIENT_TOKEN:-}
      - PAYMENT_GATEWAY_URL=${PAYMENT_GATEWAY_URL:-}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-}
      - PROMETHEUS_WEB_SCRAPE_TOKEN=${PROMETHEUS_WEB_SCRAPE_TOKEN:-}
      - AI_SERVICE_URL=${AI_SERVICE_URL:-}
      - AI_SERVICE_API_KEY=${AI_SERVICE_API_KEY:-}
      - CHAT_SERVICE_URL=${CHAT_SERVICE_URL:-}
      - FILE_EXTRACTOR_API_URL=${FILE_EXTRACTOR_API_URL:-}
      - RABBITMQ_URL=${RABBITMQ_URL:-}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-}
    ports:
      - "${PORT_FRONTEND:-3000}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      postgres-users:
        condition: service_healthy
      redis-users:
        condition: service_healthy

  # -- payments gateway ------------------------------------------------------
  payment-gateway:
    container_name: payment_gateway
    build:
      context: ../../../services/payments/gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - ENV_TYPE=${ENV_TYPE:-dev}
      - RABBITMQ_URL=${RABBITMQ_URL:-}
      - RABBITMQ_QUEUE_TYPE=${RABBITMQ_QUEUE_TYPE:-quorum}
      - PADDLE_WEBHOOK_SECRET=${PADDLE_WEBHOOK_SECRET:-}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-}
      - PORT=8080
      - GIN_MODE=${GIN_MODE:-release}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-payment-gateway}
    ports:
      - "${PORT_GATEWAY:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/readyz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # -- workers (no depends_on by design: boot degraded, self-heal) -----------
  worker-analytics:
    container_name: worker_analytics
    build:
      context: ../../../services/workers
      dockerfile: Dockerfile
    restart: always
    command: ["bun", "run", "start:analytics"]
    stop_grace_period: 35s
    environment:
      - ENV_TYPE=${ENV_TYPE:-dev}
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_URL_REPLICA=${DATABASE_URL_REPLICA}
      - REDIS_URL=${REDIS_URL}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - RABBITMQ_URL=${RABBITMQ_URL}
      - RABBITMQ_PREFETCH=${RABBITMQ_PREFETCH:-1}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-worker-analytics}
      - OTEL_TRACES_SAMPLER=${OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
      - OTEL_TRACES_SAMPLER_ARG=${OTEL_TRACES_SAMPLER_ARG:-0.1}
      - PORT=7001
    ports:
      - "${WORKER_ANALYTICS_PORT:-7001}:7001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://localhost:7001/ready'); if (!r.ok) process.exit(1);"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker-cron:
    container_name: worker_cron
    build:
      context: ../../../services/workers
      dockerfile: Dockerfile
    restart: always
    command: ["bun", "run", "start:cron"]
    stop_grace_period: 40s
    environment:
      - ENV_TYPE=${ENV_TYPE:-dev}
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_URL_REPLICA=${DATABASE_URL_REPLICA}
      - REDIS_URL=${REDIS_URL}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - CRON_CHECK_INTERVAL_MS=${CRON_CHECK_INTERVAL_MS:-900000}
      - CRON_BATCH_SIZE=${CRON_BATCH_SIZE:-100}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-worker-cron}
      - OTEL_TRACES_SAMPLER=${OTEL_TRACES_SAMPLER:-parentbased_always_on}
      - PORT=7002
    ports:
      - "${WORKER_CRON_PORT:-7002}:7002"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://localhost:7002/health'); if (!r.ok) process.exit(1);"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker-payments:
    container_name: worker_payments
    build:
      context: ../../../services/workers
      dockerfile: Dockerfile
    restart: always
    command: ["bun", "run", "start:payments"]
    stop_grace_period: 35s
    environment:
      - ENV_TYPE=${ENV_TYPE:-dev}
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_URL_REPLICA=${DATABASE_URL_REPLICA}
      - REDIS_URL=${REDIS_URL}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - RABBITMQ_URL=${RABBITMQ_URL}
      - RABBITMQ_PREFETCH=${RABBITMQ_PREFETCH:-1}
      - PADDLE_API_KEY=${PADDLE_API_KEY}
      - PADDLE_ENVIRONMENT=${PADDLE_ENVIRONMENT:-sandbox}
      - EVENT_REDIS_URL=${EVENT_REDIS_URL}
      - EVENT_REDIS_PASSWORD=${EVENT_REDIS_PASSWORD}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-worker-payments}
      - OTEL_TRACES_SAMPLER=${OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
      - OTEL_TRACES_SAMPLER_ARG=${OTEL_TRACES_SAMPLER_ARG:-0.1}
      - PORT=7003
    ports:
      - "${WORKER_PAYMENTS_PORT:-7003}:7003"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://localhost:7003/ready'); if (!r.ok) process.exit(1);"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # -- inference (CPU image for dev) -----------------------------------------
  ai-service:
    container_name: detect_ai_inference
    build:
      context: ../../../services/inference
      dockerfile: Dockerfile.local
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "/bin/grpc_health_probe -addr=:$${GRPC_PORT:-50051}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10m
      start_interval: 5s
    ports:
      - "${GRPC_PORT:-50051}:${GRPC_PORT:-50051}"
      - "${METRICS_PORT:-8333}:${METRICS_PORT:-8333}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PYTHONUNBUFFERED=1
      - ENV_TYPE=${ENV_TYPE:-dev}
      - LOG_LEVEL=${LOG_LEVEL:-}
      - GRPC_PORT=${GRPC_PORT:-}
      - METRICS_PORT=${METRICS_PORT:-}
      - API_KEY=${API_KEY:-${AI_SERVICE_API_KEY:-}}
      - MODEL_CACHE_DIR=${MODEL_CACHE_DIR:-}
      - SPARK_MODEL_REVISION=${SPARK_MODEL_REVISION:-}
      - FLARE_MODEL_REVISION=${FLARE_MODEL_REVISION:-}
      - BATCH_SIZE=${BATCH_SIZE:-}
      - BATCH_TIMEOUT=${BATCH_TIMEOUT:-}
      - MAX_TEXT_CHARS=${MAX_TEXT_CHARS:-}
      - BATCH_QUEUE_MAX_SIZE=${BATCH_QUEUE_MAX_SIZE:-}
      - MAX_INFLIGHT_DOC_CHUNKS=${MAX_INFLIGHT_DOC_CHUNKS:-}
      - CHUNK_TOKEN_LIMIT=${CHUNK_TOKEN_LIMIT:-}
      - CHUNK_TOKEN_STRIDE=${CHUNK_TOKEN_STRIDE:-}
      - MAX_GLOBAL_TOKENS=${MAX_GLOBAL_TOKENS:-}
      - MAX_CONCURRENT_BATCHES=${MAX_CONCURRENT_BATCHES:-}
      - INFERENCE_MAX_WORKERS=${INFERENCE_MAX_WORKERS:-}
      - INFERENCE_PROVIDERS=${INFERENCE_PROVIDERS:-CPUExecutionProvider}
      - GRPC_MAX_WORKERS=${GRPC_MAX_WORKERS:-}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-}
      - OTEL_SERVICE_VERSION=${OTEL_SERVICE_VERSION:-}
      - HF_TOKEN=${HF_TOKEN:-}

  # -- document parser --------------------------------------------------------
  document-parser:
    container_name: detect_ai_doc_parser
    build:
      context: ../../../services/document-parser
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 30s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PYTHONUNBUFFERED=1
      - ENV_TYPE=${ENV_TYPE:-dev}
      - PORT=8000
      - WORKERS=${WORKERS:-}
      - WORKER_THREADS=${WORKER_THREADS:-}
      - MAX_UPLOAD_SIZE_BYTES=${MAX_UPLOAD_SIZE_BYTES:-}
      - MAX_TEXT_LENGTH=${MAX_TEXT_LENGTH:-}
      - MAX_PDF_PAGES=${MAX_PDF_PAGES:-}
      - MAX_DOCX_UNCOMPRESSED_BYTES=${MAX_DOCX_UNCOMPRESSED_BYTES:-}
      - EXTRACTION_TIMEOUT_SECONDS=${EXTRACTION_TIMEOUT_SECONDS:-}
      - READINESS_MAX_QUEUE_DEPTH=${READINESS_MAX_QUEUE_DEPTH:-}
      - HEADER_FOOTER_MARGIN_PT=${HEADER_FOOTER_MARGIN_PT:-}
      - HEADER_REPETITION_RATIO=${HEADER_REPETITION_RATIO:-}
      - ALLOWED_MIME_TYPES=${ALLOWED_MIME_TYPES:-}
      - LOG_LEVEL=${LOG_LEVEL:-}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-document-parser}
      - OTEL_SERVICE_VERSION=${OTEL_SERVICE_VERSION:-}
    ports:
      - "${DOC_PARSER_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # -- chats ------------------------------------------------------------------
  chat-service:
    build:
      context: ../../../services/chats
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ENV_TYPE: ${ENV_TYPE:-dev}
      SERVICE_ROLE: api
      GRPC_PORT: ${CHAT_GRPC_PORT:-}
      METRICS_PORT: ${CHAT_METRICS_PORT:-:9091}
      MONGO_URI: ${MONGO_URI:-}
      MONGO_DATABASE: ${MONGO_DATABASE:-}
      MONGO_MODE: ${MONGO_MODE:-}
      MONGO_TLS_ENABLED: ${MONGO_TLS_ENABLED:-}
      MONGO_TLS_CA_FILE: ${MONGO_TLS_CA_FILE:-}
      MONGO_MAX_POOL_SIZE: ${MONGO_MAX_POOL_SIZE:-}
      MONGO_MIN_POOL_SIZE: ${MONGO_MIN_POOL_SIZE:-}
      MONGO_SERVER_SELECTION_TIMEOUT: ${MONGO_SERVER_SELECTION_TIMEOUT:-}
      CHAT_REDIS_ADDR: ${CHAT_REDIS_ADDR:-}
      REDIS_URL: ${CHAT_REDIS_URL:-}
      REDIS_PASSWORD: ${REDIS_CHAT_PASSWORD:-test_redis_password}
      REDIS_TLS_ENABLED: ${REDIS_TLS_ENABLED:-}
      REDIS_TLS_CA_FILE: ${REDIS_TLS_CA_FILE:-}
      REDIS_POOL_SIZE: ${REDIS_POOL_SIZE:-}
      BATCH_SIZE: ${CHAT_BATCH_SIZE:-}
      STREAM_PARTITION_COUNT: ${STREAM_PARTITION_COUNT:-}
      CACHE_TTL: ${CACHE_TTL:-}
      LOG_LEVEL: ${LOG_LEVEL:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-}
    ports:
      - "${CHAT_GRPC_HOST_PORT:-50052}:50051"
      - "${CHAT_METRICS_HOST_PORT:-9095}:9091"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mongo-chat:
        condition: service_healthy
      redis-chat:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9091/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  chat-worker:
    build:
      context: ../../../services/chats
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ENV_TYPE: ${ENV_TYPE:-dev}
      SERVICE_ROLE: worker
      GRPC_PORT: ${CHAT_GRPC_PORT:-}
      METRICS_PORT: ${CHAT_WORKER_METRICS_PORT:-:9099}
      MONGO_URI: ${MONGO_URI:-}
      MONGO_DATABASE: ${MONGO_DATABASE:-}
      MONGO_MODE: ${MONGO_MODE:-}
      MONGO_TLS_ENABLED: ${MONGO_TLS_ENABLED:-}
      MONGO_TLS_CA_FILE: ${MONGO_TLS_CA_FILE:-}
      MONGO_MAX_POOL_SIZE: ${MONGO_MAX_POOL_SIZE:-}
      MONGO_MIN_POOL_SIZE: ${MONGO_MIN_POOL_SIZE:-}
      MONGO_SERVER_SELECTION_TIMEOUT: ${MONGO_SERVER_SELECTION_TIMEOUT:-}
      CHAT_REDIS_ADDR: ${CHAT_REDIS_ADDR:-}
      REDIS_URL: ${CHAT_REDIS_URL:-}
      REDIS_PASSWORD: ${REDIS_CHAT_PASSWORD:-test_redis_password}
      REDIS_TLS_ENABLED: ${REDIS_TLS_ENABLED:-}
      REDIS_TLS_CA_FILE: ${REDIS_TLS_CA_FILE:-}
      REDIS_POOL_SIZE: ${REDIS_POOL_SIZE:-}
      BATCH_SIZE: ${CHAT_BATCH_SIZE:-}
      STREAM_PARTITION_COUNT: ${STREAM_PARTITION_COUNT:-}
      CACHE_TTL: ${CACHE_TTL:-}
      LOG_LEVEL: ${LOG_LEVEL:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-}
    ports:
      - "${CHAT_WORKER_METRICS_PORT_HOST:-9099}:9099"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mongo-chat:
        condition: service_healthy
      redis-chat:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9099/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
