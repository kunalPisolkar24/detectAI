# Shared OTEL collector for loadtests (all services).
# Imported via compose `include:` from each service's
# `infra/compose.load.observability.yml`, e.g.:
#   include:
#     - path: ../../../infra/docker/otel/loadtest-observability.yml
# (paths resolve relative to the including file; gateway uses one more `../`
# because it lives at services/payments/gateway/infra/).
# Everything varying is a variable; importing projects isolate volumes and
# networks by project name. No `volumes:` / `networks:` / `container_name`
# here so document-parser (explicit `loadnet`) and gateway (default network)
# can both run side by side. Per-service overlays add the config mount,
# docker.sock, networks, and OTEL_SCRAPE_* env (see .env.example).
# Same New Relic EU endpoint as prod.
#
# Required env (shell only, never committed):
#   NEW_RELIC_LICENSE_KEY  ingest key (eu01...)
# Empty key = exporter retries and drops; apps keep running (fail-open SDKs).
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  prometheus:
    config:
      scrape_configs:
        - job_name: otel-collector
          static_configs:
            - targets: ["localhost:8888"]
        - job_name: ${env:OTEL_SCRAPE_JOB:-app}
          scrape_interval: ${env:OTEL_SCRAPE_INTERVAL:-15s}
          metrics_path: ${env:OTEL_SCRAPE_METRICS_PATH:-/metrics}
          static_configs:
            - targets: ["${env:OTEL_SCRAPE_TARGET:-app:8080}"]
        # Optional extra scrape targets (chats loadtest uses all three:
        # worker :9099, redis-exporter :9121, mongo-exporter :9216).
        # Single-target services leave these unset; the discard-port target
        # fails closed in the receiver and changes nothing for them.
        - job_name: ${env:OTEL_SCRAPE_JOB_2:-unused-2}
          scrape_interval: ${env:OTEL_SCRAPE_INTERVAL:-15s}
          metrics_path: ${env:OTEL_SCRAPE_METRICS_PATH:-/metrics}
          static_configs:
            - targets: ["${env:OTEL_SCRAPE_TARGET_2:-localhost:9}"]
        - job_name: ${env:OTEL_SCRAPE_JOB_3:-unused-3}
          scrape_interval: ${env:OTEL_SCRAPE_INTERVAL:-15s}
          metrics_path: ${env:OTEL_SCRAPE_METRICS_PATH:-/metrics}
          static_configs:
            - targets: ["${env:OTEL_SCRAPE_TARGET_3:-localhost:9}"]
        - job_name: ${env:OTEL_SCRAPE_JOB_4:-unused-4}
          scrape_interval: ${env:OTEL_SCRAPE_INTERVAL:-15s}
          metrics_path: ${env:OTEL_SCRAPE_METRICS_PATH:-/metrics}
          static_configs:
            - targets: ["${env:OTEL_SCRAPE_TARGET_4:-localhost:9}"]

  hostmetrics:
    collection_interval: 30s
    scrapers:
      cpu: {}
      memory: {}
      disk: {}
      filesystem: {}
      load: {}
      network: {}

  # Per-container CPU/mem/net/throttling from the Docker daemon. Needs
  # /var/run/docker.sock mounted (see per-service overlay).
  # Unlike hostmetrics (whole shared host), these attribute to container.name.
  # api_version: the daemon rejects older clients since Docker 29 (min 1.40,
  # repo hosts run 29.x; a rejected request fails the whole pipeline graph at
  # startup). 1.40 also works back to Docker 20.10.
  docker_stats:
    endpoint: unix:///var/run/docker.sock
    api_version: "1.40"
    collection_interval: 15s
    metrics:
      container.cpu.throttling_data.throttled_time:
        enabled: true
      container.cpu.throttling_data.throttled_periods:
        enabled: true

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

  batch:
    send_batch_size: 512
    timeout: 10s

  # Drop noisy health/readiness spans before export (cost control).
  # Only STATUS_CODE_OK spans are dropped: non-OK spans (e.g. readiness
  # 503s under pool saturation) are kept so loadtest dashboard
  # "readiness 503s" panels keep working. Union of document-parser
  # (/api/v1/*) and payment-gateway (/healthz, /readyz) routes; entries
  # that do not exist for a given service are harmless.
  filter/drop-health:
    error_mode: ignore
    traces:
      span:
        - 'attributes["http.route"] == "/api/v1/health" and status.code == STATUS_CODE_OK'
        - 'attributes["http.route"] == "/api/v1/ready" and status.code == STATUS_CODE_OK'
        - 'attributes["http.route"] == "/api/v1/metrics"'
        - 'attributes["http.route"] == "/healthz" and status.code == STATUS_CODE_OK'
        - 'attributes["http.route"] == "/readyz" and status.code == STATUS_CODE_OK'
        - 'attributes["http.target"] == "/metrics"'

  resource/env:
    attributes:
      - key: deployment.environment
        value: loadtest
        action: upsert

exporters:
  otlphttp/newrelic:
    # Fallback default only; compose always sets NEW_RELIC_OTLP_ENDPOINT.
    # Keep :443 (not :4318): port 4318 is blocked on this egress path, :443
    # is verified to reach NR EU ingest. See the guard comment in
    # loadtest-observability.yml and commit 95c27f20.
    endpoint: ${env:NEW_RELIC_OTLP_ENDPOINT:-https://otlp.eu01.nr-data.net:443}
    headers:
      api-key: ${env:NEW_RELIC_LICENSE_KEY}
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 5000

  debug:
    verbosity: basic

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  telemetry:
    metrics:
      address: 0.0.0.0:8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, filter/drop-health, resource/env, batch]
      exporters: [otlphttp/newrelic]
    metrics:
      receivers: [otlp, prometheus, hostmetrics, docker_stats]
      processors: [memory_limiter, resource/env, batch]
      exporters: [otlphttp/newrelic]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource/env, batch]
      exporters: [otlphttp/newrelic]
