# OTEL collector for the prod stack only (Floci emulator AND real AWS).
# Never add to infra/docker/local/compose.yml. Apps send OTLP here
# (OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318); the collector
# batches and exports to New Relic EU over OTLP/HTTP.
#
# Required env (from infra/docker/prod/.env, never committed):
#   NEW_RELIC_LICENSE_KEY  ingest key (eu01...)
#   NEW_RELIC_OTLP_ENDPOINT  default https://otlp.eu01.nr-data.net:4318
#   DEPLOYMENT_ENV  prod | floci, stamped on scraped metrics
# Empty NEW_RELIC_LICENSE_KEY = exporter fails closed with retry; apps keep
# running (their SDKs are fail-open when this collector is unreachable).
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  prometheus:
    config:
      scrape_configs:
        - job_name: otel-collector
          static_configs:
            - targets: ["localhost:8888"]
        - job_name: chat-service
          static_configs:
            - targets: ["chat-service:9091"]
        - job_name: chat-worker
          static_configs:
            - targets: ["chat-worker:9099"]
        - job_name: inference
          static_configs:
            - targets: ["ai-service:8333"]
        - job_name: postgres-exporter
          static_configs:
            - targets: ["postgres-exporter:9187"]
        - job_name: redis-users
          static_configs:
            - targets: ["redis-exporter-users:9121"]
        - job_name: redis-chat
          static_configs:
            - targets: ["redis-exporter-chat:9121"]
        - job_name: redis-events
          static_configs:
            - targets: ["redis-exporter-events:9121"]
        - job_name: mongo-exporter
          static_configs:
            - targets: ["mongo-exporter:9216"]
        - job_name: rabbitmq-exporter
          static_configs:
            - targets: ["rabbitmq-exporter:9419"]

  hostmetrics:
    collection_interval: 30s
    scrapers:
      cpu: {}
      memory: {}
      disk: {}
      filesystem: {}
      load: {}
      network: {}

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

  batch:
    send_batch_size: 512
    timeout: 10s

  # Drop noisy health/readiness spans before export (cost control).
  filter/drop-health:
    error_mode: ignore
    traces:
      span:
        - 'attributes["http.route"] == "/api/healthz"'
        - 'attributes["http.route"] == "/readyz"'
        - 'attributes["http.route"] == "/ready"'
        - 'attributes["http.route"] == "/health"'
        - 'attributes["http.target"] == "/metrics"'

  resource/env:
    attributes:
      - key: deployment.environment
        value: ${env:DEPLOYMENT_ENV:-prod}
        action: upsert

exporters:
  otlphttp/newrelic:
    endpoint: ${env:NEW_RELIC_OTLP_ENDPOINT:-https://otlp.eu01.nr-data.net:4318}
    headers:
      api-key: ${env:NEW_RELIC_LICENSE_KEY}
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 5000

  # Local fallback for debugging (disabled by default via pipeline below).
  debug:
    verbosity: basic

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, filter/drop-health, resource/env, batch]
      exporters: [otlphttp/newrelic]
    metrics:
      receivers: [otlp, prometheus, hostmetrics]
      processors: [memory_limiter, resource/env, batch]
      exporters: [otlphttp/newrelic]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource/env, batch]
      exporters: [otlphttp/newrelic]
