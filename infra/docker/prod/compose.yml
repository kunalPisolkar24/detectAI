# Full-stack PROD compose: app services only, datastores from Terraform.
#
# Usage (from repo root), Floci-first:
#   1. Boot the emulator: Floci/LocalStack on http://localhost:4566
#   2. terraform -chdir=infra/terraform apply -var-file=envs/floci-local.tfvars
#   3. make floci-seed          # app-only secrets Floci doesn't TF-manage
#   4. cp infra/docker/prod/.env.example infra/docker/prod/.env  # then fill
#      DATABASE_URL* (/workers + db-migrate) from `terraform output -raw`
#   5. make prod-up
#
# How wiring works (ENV_TYPE=prod + AWS SDK at runtime):
#   web/chats/gateway  fetch URLs from Floci Secrets Manager
#     (detectai/pg/urls, detectai/docdb/urls, detectai/redis/{users,chat}/urls,
#      detectai/mq/urls) via AWS_ENDPOINT_URL=http://host.docker.internal:4566.
#   db-migrate + workers need DATABASE_URL* as env (migrate is plain Prisma;
#     workers only fetch RABBITMQ_URL/PADDLE_* from AWS, the rest is env/SSM).
#   Tunables come from SSM /detectai/<service>/ (SSM_ENABLED=true).
# For real AWS: AWS_ENDPOINT_URL empty + TLS vars true (see .env.example).
#
# Single-stack rule: never run `prod` and `local` at the same time
# (Makefile guards this).
name: detectai-prod

services:
  db-migrate:
    build:
      context: ../../../apps/web
      dockerfile: Dockerfile
      target: migrate
    restart: "no"
    environment:
      - DATABASE_URL=${DATABASE_URL}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    container_name: detect_ai_frontend
    build:
      context: ../../../apps/web
      dockerfile: Dockerfile
      args:
        ENV_TYPE: ${ENV_TYPE:-prod}
        NEXT_PUBLIC_ENV_TYPE: ${NEXT_PUBLIC_ENV_TYPE:-${ENV_TYPE:-prod}}
        NEXT_PUBLIC_PREVIEW_MODE: ${NEXT_PUBLIC_PREVIEW_MODE:-false}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY}
        NEXT_PUBLIC_PADDLE_CLIENT_TOKEN: ${NEXT_PUBLIC_PADDLE_CLIENT_TOKEN}
    restart: always
    environment:
      - ENV_TYPE=${ENV_TYPE:-prod}
      - NEXT_PUBLIC_ENV_TYPE=${NEXT_PUBLIC_ENV_TYPE:-${ENV_TYPE:-prod}}
      - NEXT_PUBLIC_PREVIEW_MODE=${NEXT_PUBLIC_PREVIEW_MODE:-false}
      - NODE_ENV=${NODE_ENV}
      - LOG_LEVEL=${LOG_LEVEL}
      - DB_POOL_MAX=${DB_POOL_MAX:-}
      - GITHUB_ID=${GITHUB_ID:-}
      - GITHUB_SECRET=${GITHUB_SECRET:-}
      - GOOGLE_ID=${GOOGLE_ID:-}
      - GOOGLE_SECRET=${GOOGLE_SECRET:-}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-}
      - DATABASE_URL=${DATABASE_URL:-}
      - DATABASE_URL_REPLICA=${DATABASE_URL_REPLICA:-}
      - REDIS_URL=${REDIS_URL:-}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - NEXT_PUBLIC_TURNSTILE_SITE_KEY=${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY:-}
      - NEXT_PUBLIC_PADDLE_CLIENT_TOKEN=${NEXT_PUBLIC_PADDLE_CLIENT_TOKEN:-}
      - PAYMENT_GATEWAY_URL=${PAYMENT_GATEWAY_URL:-}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-}
      - PROMETHEUS_WEB_SCRAPE_TOKEN=${PROMETHEUS_WEB_SCRAPE_TOKEN:-}
      - AI_SERVICE_URL=${AI_SERVICE_URL:-}
      - AI_SERVICE_API_KEY=${AI_SERVICE_API_KEY:-}
      - CHAT_SERVICE_URL=${CHAT_SERVICE_URL:-}
      - FILE_EXTRACTOR_API_URL=${FILE_EXTRACTOR_API_URL:-}
      - RABBITMQ_URL=${RABBITMQ_URL:-}
      - AWS_REGION=${AWS_REGION:-ap-south-1}
      - AWS_ENDPOINT_URL=${AWS_ENDPOINT_URL:-}
      - SSM_PREFIX=${WEB_SSM_PREFIX:-/detectai/web/}
      - SSM_ENABLED=${SSM_ENABLED:-true}
      - PG_URLS_SECRET_NAME=${PG_URLS_SECRET_NAME:-detectai/pg/urls}
      - REDIS_URLS_SECRET_NAME=${REDIS_URLS_SECRET_NAME:-detectai/redis/users/urls}
      - MQ_URLS_SECRET_NAME=${MQ_URLS_SECRET_NAME:-detectai/mq/urls}
      - WEB_SECRETS_NAME=${WEB_SECRETS_NAME:-detectai/web/secrets}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-web}
    ports:
      - "${PORT_FRONTEND:-3000}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      db-migrate:
        condition: service_completed_successfully

  payment-gateway:
    container_name: payment_gateway
    build:
      context: ../../../services/payments/gateway
      dockerfile: Dockerfile
    restart: always
    environment:
      - ENV_TYPE=${ENV_TYPE:-prod}
      - RABBITMQ_URL=${RABBITMQ_URL:-}
      - RABBITMQ_QUEUE_TYPE=${RABBITMQ_QUEUE_TYPE:-quorum}
      - PADDLE_WEBHOOK_SECRET=${PADDLE_WEBHOOK_SECRET:-}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-}
      - PORT=8080
      - GIN_MODE=${GIN_MODE:-release}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-payment-gateway}
      - AWS_REGION=${AWS_REGION:-ap-south-1}
      - AWS_ENDPOINT_URL=${AWS_ENDPOINT_URL:-}
      - SSM_PREFIX=${GATEWAY_SSM_PREFIX:-/detectai/gateway/}
      - SSM_ENABLED=${SSM_ENABLED:-true}
      - MQ_URLS_SECRET_NAME=${MQ_URLS_SECRET_NAME:-detectai/mq/urls}
      - MQ_SECRETS_NAME=${MQ_SECRETS_NAME:-detectai/mq/urls}
      - GATEWAY_SECRETS_NAME=${GATEWAY_SECRETS_NAME:-detectai/gateway/secrets}
    ports:
      - "${PORT_GATEWAY:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/readyz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  worker-analytics:
    container_name: worker_analytics
    build:
      context: ../../../services/workers
      dockerfile: Dockerfile
    restart: always
    command: ["bun", "run", "start:analytics"]
    stop_grace_period: 35s
    environment:
      - ENV_TYPE=${ENV_TYPE:-prod}
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_URL_REPLICA=${DATABASE_URL_REPLICA}
      - REDIS_URL=${REDIS_URL:-}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - RABBITMQ_URL=${RABBITMQ_URL:-}
      - RABBITMQ_PREFETCH=${RABBITMQ_PREFETCH:-1}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-worker-analytics}
      - OTEL_TRACES_SAMPLER=${OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
      - OTEL_TRACES_SAMPLER_ARG=${OTEL_TRACES_SAMPLER_ARG:-0.1}
      - AWS_REGION=${AWS_REGION:-ap-south-1}
      - AWS_ENDPOINT_URL=${AWS_ENDPOINT_URL:-}
      - MQ_SECRETS_NAME=${MQ_SECRETS_NAME:-detectai/mq/urls}
      - WORKERS_SECRETS_NAME=${WORKERS_SECRETS_NAME:-detectai/workers/secrets}
      - SSM_PREFIX=${WORKERS_SSM_PREFIX:-/detectai/workers/}
      - SSM_ENABLED=${SSM_ENABLED:-true}
      - PORT=7001
    ports:
      - "${WORKER_ANALYTICS_PORT:-7001}:7001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://localhost:7001/ready'); if (!r.ok) process.exit(1);"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker-cron:
    container_name: worker_cron
    build:
      context: ../../../services/workers
      dockerfile: Dockerfile
    restart: always
    command: ["bun", "run", "start:cron"]
    stop_grace_period: 40s
    environment:
      - ENV_TYPE=${ENV_TYPE:-prod}
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_URL_REPLICA=${DATABASE_URL_REPLICA}
      - REDIS_URL=${REDIS_URL:-}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - CRON_CHECK_INTERVAL_MS=${CRON_CHECK_INTERVAL_MS:-900000}
      - CRON_BATCH_SIZE=${CRON_BATCH_SIZE:-100}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-worker-cron}
      - OTEL_TRACES_SAMPLER=${OTEL_TRACES_SAMPLER:-parentbased_always_on}
      - AWS_REGION=${AWS_REGION:-ap-south-1}
      - AWS_ENDPOINT_URL=${AWS_ENDPOINT_URL:-}
      - WORKERS_SECRETS_NAME=${WORKERS_SECRETS_NAME:-detectai/workers/secrets}
      - MQ_SECRETS_NAME=${MQ_SECRETS_NAME:-detectai/mq/urls}
      - SSM_PREFIX=${WORKERS_SSM_PREFIX:-/detectai/workers/}
      - SSM_ENABLED=${SSM_ENABLED:-true}
      - PORT=7002
    ports:
      - "${WORKER_CRON_PORT:-7002}:7002"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://localhost:7002/health'); if (!r.ok) process.exit(1);"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker-payments:
    container_name: worker_payments
    build:
      context: ../../../services/workers
      dockerfile: Dockerfile
    restart: always
    command: ["bun", "run", "start:payments"]
    stop_grace_period: 35s
    environment:
      - ENV_TYPE=${ENV_TYPE:-prod}
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_URL_REPLICA=${DATABASE_URL_REPLICA}
      - REDIS_URL=${REDIS_URL:-}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - RABBITMQ_URL=${RABBITMQ_URL:-}
      - RABBITMQ_PREFETCH=${RABBITMQ_PREFETCH:-1}
      - PADDLE_API_KEY=${PADDLE_API_KEY:-}
      - PADDLE_ENVIRONMENT=${PADDLE_ENVIRONMENT:-sandbox}
      - EVENT_REDIS_URL=${EVENT_REDIS_URL:-}
      - EVENT_REDIS_PASSWORD=${EVENT_REDIS_PASSWORD:-}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-worker-payments}
      - OTEL_TRACES_SAMPLER=${OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
      - OTEL_TRACES_SAMPLER_ARG=${OTEL_TRACES_SAMPLER_ARG:-0.1}
      - AWS_REGION=${AWS_REGION:-ap-south-1}
      - AWS_ENDPOINT_URL=${AWS_ENDPOINT_URL:-}
      - MQ_SECRETS_NAME=${MQ_SECRETS_NAME:-detectai/mq/urls}
      - WORKERS_SECRETS_NAME=${WORKERS_SECRETS_NAME:-detectai/workers/secrets}
      - SSM_PREFIX=${WORKERS_SSM_PREFIX:-/detectai/workers/}
      - SSM_ENABLED=${SSM_ENABLED:-true}
      - PORT=7003
    ports:
      - "${WORKER_PAYMENTS_PORT:-7003}:7003"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://localhost:7003/ready'); if (!r.ok) process.exit(1);"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # -- inference (GPU image; needs nvidia runtime, see compose.gpu note) ------
  ai-service:
    container_name: detect_ai_inference
    build:
      context: ../../../services/inference
      dockerfile: Dockerfile
    restart: always
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 16G
          cpus: "8.0"
        reservations:
          memory: 4G
          cpus: "2.0"
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "/bin/grpc_health_probe -addr=:$${GRPC_PORT:-50051}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10m
      start_interval: 5s
    ports:
      - "${GRPC_PORT:-50051}:${GRPC_PORT:-50051}"
      - "${METRICS_PORT:-8333}:${METRICS_PORT:-8333}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PYTHONUNBUFFERED=1
      - ENV_TYPE=${ENV_TYPE:-prod}
      - LOG_LEVEL=${LOG_LEVEL:-}
      - GRPC_PORT=${GRPC_PORT:-}
      - METRICS_PORT=${METRICS_PORT:-}
      - API_KEY=${API_KEY:-}
      - MODEL_CACHE_DIR=${MODEL_CACHE_DIR:-}
      - SPARK_MODEL_REVISION=${SPARK_MODEL_REVISION:-}
      - FLARE_MODEL_REVISION=${FLARE_MODEL_REVISION:-}
      - BATCH_SIZE=${BATCH_SIZE:-}
      - BATCH_TIMEOUT=${BATCH_TIMEOUT:-}
      - MAX_TEXT_CHARS=${MAX_TEXT_CHARS:-}
      - BATCH_QUEUE_MAX_SIZE=${BATCH_QUEUE_MAX_SIZE:-}
      - MAX_INFLIGHT_DOC_CHUNKS=${MAX_INFLIGHT_DOC_CHUNKS:-}
      - CHUNK_TOKEN_LIMIT=${CHUNK_TOKEN_LIMIT:-}
      - CHUNK_TOKEN_STRIDE=${CHUNK_TOKEN_STRIDE:-}
      - MAX_GLOBAL_TOKENS=${MAX_GLOBAL_TOKENS:-}
      - MAX_CONCURRENT_BATCHES=${MAX_CONCURRENT_BATCHES:-}
      - INFERENCE_MAX_WORKERS=${INFERENCE_MAX_WORKERS:-}
      - INFERENCE_PROVIDERS=${INFERENCE_PROVIDERS:-CUDAExecutionProvider,CPUExecutionProvider}
      - GRPC_MAX_WORKERS=${GRPC_MAX_WORKERS:-}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-inference}
      - OTEL_SERVICE_VERSION=${OTEL_SERVICE_VERSION:-}
      - HF_TOKEN=${HF_TOKEN:-}
      - AWS_REGION=${AWS_REGION:-ap-south-1}
      - AWS_ENDPOINT_URL=${AWS_ENDPOINT_URL:-}
      - SSM_PREFIX=${INFERENCE_SSM_PREFIX:-/detectai/inference/}
      - SSM_ENABLED=${SSM_ENABLED:-true}
      - INFERENCE_SECRETS_NAME=${INFERENCE_SECRETS_NAME:-detectai/inference/secrets}

  document-parser:
    container_name: detect_ai_doc_parser
    build:
      context: ../../../services/document-parser
      dockerfile: Dockerfile
    restart: always
    stop_grace_period: 30s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PYTHONUNBUFFERED=1
      - ENV_TYPE=${ENV_TYPE:-prod}
      - PORT=8000
      - WORKERS=${WORKERS:-}
      - WORKER_THREADS=${WORKER_THREADS:-}
      - MAX_UPLOAD_SIZE_BYTES=${MAX_UPLOAD_SIZE_BYTES:-}
      - MAX_TEXT_LENGTH=${MAX_TEXT_LENGTH:-}
      - MAX_PDF_PAGES=${MAX_PDF_PAGES:-}
      - MAX_DOCX_UNCOMPRESSED_BYTES=${MAX_DOCX_UNCOMPRESSED_BYTES:-}
      - EXTRACTION_TIMEOUT_SECONDS=${EXTRACTION_TIMEOUT_SECONDS:-}
      - READINESS_MAX_QUEUE_DEPTH=${READINESS_MAX_QUEUE_DEPTH:-}
      - HEADER_FOOTER_MARGIN_PT=${HEADER_FOOTER_MARGIN_PT:-}
      - HEADER_REPETITION_RATIO=${HEADER_REPETITION_RATIO:-}
      - ALLOWED_MIME_TYPES=${ALLOWED_MIME_TYPES:-}
      - LOG_LEVEL=${LOG_LEVEL:-}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-document-parser}
      - OTEL_SERVICE_VERSION=${OTEL_SERVICE_VERSION:-}
      - AWS_REGION=${AWS_REGION:-ap-south-1}
      - AWS_ENDPOINT_URL=${AWS_ENDPOINT_URL:-}
      - SSM_PREFIX=${DOC_PARSER_SSM_PREFIX:-/detectai/document-parser/}
      - SSM_ENABLED=${SSM_ENABLED:-true}
      - DOCUMENT_PARSER_SECRETS_NAME=${DOCUMENT_PARSER_SECRETS_NAME:-detectai/document-parser/secrets}
    ports:
      - "${DOC_PARSER_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # -- chats (datastores via Floci Secrets Manager, no local deps) -------------
  chat-service:
    build:
      context: ../../../services/chats
      dockerfile: Dockerfile
    restart: always
    environment:
      ENV_TYPE: ${ENV_TYPE:-prod}
      SERVICE_ROLE: api
      GRPC_PORT: ${CHAT_GRPC_PORT:-}
      METRICS_PORT: ${CHAT_METRICS_PORT:-:9091}
      MONGO_URI: ${MONGO_URI:-}
      MONGO_DATABASE: ${MONGO_DATABASE:-chat_db}
      MONGO_MODE: ${MONGO_MODE:-standalone}
      MONGO_TLS_ENABLED: ${MONGO_TLS_ENABLED:-false}
      MONGO_TLS_CA_FILE: ${MONGO_TLS_CA_FILE:-}
      CHAT_REDIS_ADDR: ${CHAT_REDIS_ADDR:-}
      REDIS_URL: ${CHATS_REDIS_URL:-}
      REDIS_PASSWORD: ${CHATS_REDIS_PASSWORD:-}
      REDIS_TLS_ENABLED: ${REDIS_TLS_ENABLED:-false}
      REDIS_TLS_CA_FILE: ${REDIS_TLS_CA_FILE:-}
      LOG_LEVEL: ${LOG_LEVEL:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-chat-service}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-}
      SSM_PREFIX: ${CHAT_SSM_PREFIX:-/detectai/chat/}
      SSM_ENABLED: ${SSM_ENABLED:-true}
      DOCDB_URLS_SECRET_NAME: ${DOCDB_URLS_SECRET_NAME:-detectai/docdb/urls}
      REDIS_URLS_SECRET_NAME: ${REDIS_URLS_SECRET_NAME:-detectai/redis/chat/urls}
    ports:
      - "${CHAT_GRPC_HOST_PORT:-50052}:50051"
      - "${CHAT_METRICS_HOST_PORT:-9095}:9091"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9091/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  chat-worker:
    build:
      context: ../../../services/chats
      dockerfile: Dockerfile
    restart: always
    environment:
      ENV_TYPE: ${ENV_TYPE:-prod}
      SERVICE_ROLE: worker
      GRPC_PORT: ${CHAT_GRPC_PORT:-}
      METRICS_PORT: ${CHAT_WORKER_METRICS_PORT:-:9099}
      MONGO_URI: ${MONGO_URI:-}
      MONGO_DATABASE: ${MONGO_DATABASE:-chat_db}
      MONGO_MODE: ${MONGO_MODE:-standalone}
      MONGO_TLS_ENABLED: ${MONGO_TLS_ENABLED:-false}
      MONGO_TLS_CA_FILE: ${MONGO_TLS_CA_FILE:-}
      CHAT_REDIS_ADDR: ${CHAT_REDIS_ADDR:-}
      REDIS_URL: ${CHATS_REDIS_URL:-}
      REDIS_PASSWORD: ${CHATS_REDIS_PASSWORD:-}
      REDIS_TLS_ENABLED: ${REDIS_TLS_ENABLED:-false}
      REDIS_TLS_CA_FILE: ${REDIS_TLS_CA_FILE:-}
      LOG_LEVEL: ${LOG_LEVEL:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-chat-worker}
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-}
      SSM_PREFIX: ${CHAT_SSM_PREFIX:-/detectai/chat/}
      SSM_ENABLED: ${SSM_ENABLED:-true}
      DOCDB_URLS_SECRET_NAME: ${DOCDB_URLS_SECRET_NAME:-detectai/docdb/urls}
      REDIS_URLS_SECRET_NAME: ${REDIS_URLS_SECRET_NAME:-detectai/redis/chat/urls}
    ports:
      - "${CHAT_WORKER_METRICS_PORT_HOST:-9099}:9099"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9099/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
