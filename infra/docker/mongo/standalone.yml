# Standalone mongo template (single instance, no HA).
#
# Importable atom: reference it from a stack via compose `include:`
# (paths resolve relative to the including file), e.g.:
#   include:
#     - path: ../../../infra/docker/mongo/standalone.yml
# or merge it with `-f`. Everything varying is a variable (see
# infra/docker/mongo/.env.example or the aggregate
# infra/docker/data/.env.example); importing projects isolate volumes
# and networks by project name. No `networks:` / `container_name` here
# so multiple projects can run side by side.
# Services that need chat-specific names (chat-mongo/chat-redis to avoid
# port/DNS collision) can extend the anchor:
#   chat-mongo:
#     <<: *mongo
#     ports: ["${CHAT_MONGO_PORT:-27018}:27017"]
#     volumes: [chat_mongo_data:/data/db]
x-mongo: &mongo
  image: mongo:6.0
  restart: unless-stopped
  command: mongod --bind_ip_all --port 27017
  healthcheck:
    test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
    interval: 10s
    timeout: 5s
    retries: 10
    start_period: 10s

services:
  mongo:
    <<: *mongo
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
