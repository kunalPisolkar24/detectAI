# Reusable postgres-exporter template (Prometheus exporter for PostgreSQL).
#
# Merge it into a stack with an extra `-f` flag, then point it at the stack's
# database from the service overlay, e.g.:
#   docker compose -f compose.load.yml \
#     -f ../../../infra/docker/postgres-exporter/standalone.yml \
#     -f compose.load.observability.yml up
#   services:
#     postgres-exporter:
#       environment:
#         - DATA_SOURCE_NAME=postgresql://user:password@postgres-users:5432/detect_ai?sslmode=disable
# Everything varying is a variable; importing projects isolate volumes and
# networks by project name. No `volumes:` / `networks:` / `container_name`
# here so multiple projects can run side by side. Serves /metrics for the
# shared OTEL collector (see infra/docker/otel/otel-collector-loadtest.yaml).
services:
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    restart: unless-stopped
    environment:
      - DATA_SOURCE_NAME=${DATA_SOURCE_NAME:-postgresql://user:password@localhost:5432/detect_ai?sslmode=disable}
