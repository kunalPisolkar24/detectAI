services:
  redis-master:
    image: redis:7.2-alpine
    container_name: detect_ai_redis_master
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass "user_cache_password" --masterauth "user_cache_password"
    networks:
      - detectai_net
    volumes:
      - redis_master_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "user_cache_password", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-slave-1:
    image: redis:7.2-alpine
    container_name: detect_ai_redis_slave_1
    restart: unless-stopped
    command: redis-server --replicaof redis-master 6379 --masterauth "user_cache_password" --requirepass "user_cache_password"
    depends_on:
      redis-master:
        condition: service_healthy
    networks:
      - detectai_net

  redis-slave-2:
    image: redis:7.2-alpine
    container_name: detect_ai_redis_slave_2
    restart: unless-stopped
    command: redis-server --replicaof redis-master 6379 --masterauth "user_cache_password" --requirepass "user_cache_password"
    depends_on:
      redis-master:
        condition: service_healthy
    networks:
      - detectai_net

  redis-sentinel-1:
    image: redis:7.2-alpine
    container_name: detect_ai_redis_sentinel_1
    restart: unless-stopped
    command: >
      sh -c "echo 'Waiting for master...' && sleep 10 &&
      echo 'sentinel resolve-hostnames yes' > /tmp/sentinel.conf &&
      echo 'sentinel monitor mymaster redis-master 6379 2' >> /tmp/sentinel.conf &&
      echo 'sentinel down-after-milliseconds mymaster 5000' >> /tmp/sentinel.conf &&
      echo 'sentinel failover-timeout mymaster 60000' >> /tmp/sentinel.conf &&
      echo 'sentinel parallel-syncs mymaster 1' >> /tmp/sentinel.conf &&
      echo 'sentinel auth-pass mymaster user_cache_password' >> /tmp/sentinel.conf &&
      redis-sentinel /tmp/sentinel.conf"
    networks:
      - detectai_net
    depends_on:
      redis-master:
        condition: service_healthy

  redis-sentinel-2:
    image: redis:7.2-alpine
    container_name: detect_ai_redis_sentinel_2
    restart: unless-stopped
    command: >
      sh -c "echo 'Waiting for master...' && sleep 10 &&
      echo 'sentinel resolve-hostnames yes' > /tmp/sentinel.conf &&
      echo 'sentinel monitor mymaster redis-master 6379 2' >> /tmp/sentinel.conf &&
      echo 'sentinel down-after-milliseconds mymaster 5000' >> /tmp/sentinel.conf &&
      echo 'sentinel failover-timeout mymaster 60000' >> /tmp/sentinel.conf &&
      echo 'sentinel parallel-syncs mymaster 1' >> /tmp/sentinel.conf &&
      echo 'sentinel auth-pass mymaster user_cache_password' >> /tmp/sentinel.conf &&
      redis-sentinel /tmp/sentinel.conf"
    networks:
      - detectai_net
    depends_on:
      redis-master:
        condition: service_healthy

  redis-sentinel-3:
    image: redis:7.2-alpine
    container_name: detect_ai_redis_sentinel_3
    restart: unless-stopped
    command: >
      sh -c "echo 'Waiting for master...' && sleep 10 &&
      echo 'sentinel resolve-hostnames yes' > /tmp/sentinel.conf &&
      echo 'sentinel monitor mymaster redis-master 6379 2' >> /tmp/sentinel.conf &&
      echo 'sentinel down-after-milliseconds mymaster 5000' >> /tmp/sentinel.conf &&
      echo 'sentinel failover-timeout mymaster 60000' >> /tmp/sentinel.conf &&
      echo 'sentinel parallel-syncs mymaster 1' >> /tmp/sentinel.conf &&
      echo 'sentinel auth-pass mymaster user_cache_password' >> /tmp/sentinel.conf &&
      redis-sentinel /tmp/sentinel.conf"
    networks:
      - detectai_net
    depends_on:
      redis-master:
        condition: service_healthy

  redis-ratelimit:
    image: redis:7.2-alpine
    container_name: detect_ai_redis_ratelimit
    restart: unless-stopped
    command: redis-server --save "" --appendonly no --requirepass "worker_password" --maxmemory 512mb --maxmemory-policy allkeys-lru
    networks:
      - detectai_net
    volumes:
      - redis_worker_data:/data

volumes:
  redis_master_data:
  redis_worker_data: