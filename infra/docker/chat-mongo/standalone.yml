# Standalone chat-mongo template (single instance, no HA).
#
# Importable atom: reference it from a stack via compose `include:`
# (paths resolve relative to the including file), e.g.:
#   include:
#     - path: ../../../infra/docker/chat-mongo/standalone.yml
# or merge it with `-f`. Everything varying is a variable (see
# infra/docker/chat-mongo/.env.example); importing projects isolate
# volumes and networks by project name. No `networks:` / `container_name`
# here so multiple projects can run side by side. Isolated from generic
# `mongo` (27017) via host port 27018 and volume `chat_mongo_data`.
x-chat-mongo: &chat-mongo
  image: mongo:6.0
  restart: unless-stopped
  command: mongod --bind_ip_all --port 27017
  healthcheck:
    test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
    interval: 10s
    timeout: 5s
    retries: 10
    start_period: 10s

services:
  chat-mongo:
    <<: *chat-mongo
    volumes:
      - chat_mongo_data:/data/db

volumes:
  chat_mongo_data:
