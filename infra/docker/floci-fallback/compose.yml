# Fallback data-plane for local prod testing (no real Floci available).
# Moto only mocks AWS APIs; these real OSS containers provide the actual
# Postgres/Redis/Mongo/RabbitMQ behind the Floci hostnames that
# infra/docker/prod/.env expects. TF URL secrets are overwritten to match
# (see prod bootstrap notes). Run before prod-up-floci:
#   docker compose -f infra/docker/floci-fallback/compose.yml up -d
# Single-stack rule: never run this alongside the local stack.
name: floci-fallback

networks:
  floci:
    name: ${FLOCI_NETWORK:-documents_default}
    external: true

services:
  moto:
    image: motoserver/moto:latest
    container_name: moto-floci
    command: ["-H", "0.0.0.0", "-p", "5000"]
    ports:
      - "4566:5000"
    networks:
      - floci
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/moto-api/')\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  floci-pg:
    image: postgres:16-alpine
    container_name: floci-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: detect_ai
    networks:
      - floci
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d detect_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-users:
    image: redis:7-alpine
    container_name: floci-valkey-detectai-redis-users-local
    restart: unless-stopped
    command: redis-server --appendonly yes
    networks:
      - floci
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-chat:
    image: redis:7-alpine
    container_name: floci-valkey-detectai-redis-chat-local
    restart: unless-stopped
    command: redis-server --appendonly yes
    networks:
      - floci
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-events:
    image: redis:7-alpine
    container_name: floci-valkey-detectai-redis-events-local
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    networks:
      - floci
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    image: mongo:6.0
    container_name: floci-mongo
    restart: unless-stopped
    command: mongod --bind_ip_all --port 27017
    networks:
      - floci
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: floci-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - floci
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 10s
