# Composable from consumer compose files: no networks/container_name, everything varying is a variable.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-users}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-local-dev-password-16-chars}"
      POSTGRES_DB: "${POSTGRES_DB:-users_db}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
