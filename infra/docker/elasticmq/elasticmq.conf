# Mirrors specification/messaging.md; retention stays IaC-only, not a config knob.
include classpath("application.conf")

node-address {
  protocol = http
  host = localhost
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

aws {
  region = ap-southeast-2
  accountId = "000000000000"
}

queues {
  "payment_events.fifo" {
    fifo = true
    contentBasedDeduplication = true
    defaultVisibilityTimeout = 300 seconds
    delay = 0 seconds
    receiveMessageWait = 0 seconds
    deadLettersQueue {
      name = "payment_events_dlq.fifo"
      maxReceiveCount = 5
    }
  }
  "payment_events_dlq.fifo" {
    fifo = true
    contentBasedDeduplication = true
    defaultVisibilityTimeout = 300 seconds
    delay = 0 seconds
    receiveMessageWait = 0 seconds
  }
}
