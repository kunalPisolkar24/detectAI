# tfctl's infra kind: the shared fabric ledger. Each section is optional —
# declare [[queues]], [[elasticache]] and/or [[atlas]]; only declared fabrics
# land. Atlas has no emulator, so it is skipped on the floci plane.

[service]
slug = "infra"
region = "ap-southeast-2"

[[queues]]
name = "payment_events.fifo"
dlq = "payment_events_dlq.fifo"
max_receive_count = 5

[[queues]]
name = "payment_events_dlq.fifo"

[[elasticache]]
name = "detectai-dev-cache"
engine = "redis"
engine_version = "7.0"
node_type = "cache.t3.micro"
num_cache_nodes = 1
port = 6379

[[atlas]]
name = "detectai-dev-mongo"
region = "AP_SOUTHEAST_2"
tier = "M0"
