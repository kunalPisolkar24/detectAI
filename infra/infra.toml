# tfctl's infra kind: the shared fabric ledger. Each section is optional —
# declare [[queues]], [[elasticache]], [[atlas]] and/or [[aurora]]; only declared
# fabrics land. Atlas has no emulator, so it is always a real MongoDB Cloud API.

[service]
slug = "infra"
region = "ap-southeast-2"

[[queues]]
name = "payment_events.fifo"
dlq = "payment_events_dlq.fifo"
max_receive_count = 5

[[queues]]
name = "payment_events_dlq.fifo"

[[elasticache]]
name = "detectai-dev-cache"
engine = "redis"
major_engine_version = "7"
max_data_storage_gb = 5
max_ecpu_per_second = 5000

[[atlas]]
name = "detectai-dev-mongo"
region = "AP_SOUTHEAST_2"
tier = "M0"

[[aurora]]
name = "detectai-dev-users"
engine = "aurora-postgresql"
engine_version = "16.4"
database_name = "users_db"
port = 5432
min_acu = 0.5
max_acu = 1
num_read_replicas = 0
storage_encrypted = true
backup_retention_days = 7
deletion_protection = false
skip_final_snapshot = true
