# Reusable mongo-exporter template (Prometheus exporter for self-hosted MongoDB).
#
# Merge it into a stack with an extra `-f` flag, then override the endpoint
# from the service overlay, e.g.:
#   docker compose -f compose.load.yml \
#     -f ../../../infra/docker/mongo-exporter/standalone.yml \
#     -f compose.load.observability.yml up
#   services:
#     mongo-exporter:
#       command: ["--mongodb.uri=mongodb://mongo-chat:27017/chat_db", "--collect-all"]
# Everything varying is a variable; importing projects isolate volumes and
# networks by project name. No `volumes:` / `networks:` / `container_name`
# here so multiple projects can run side by side. Serves /metrics for the
# shared OTEL collector (see infra/docker/otel/otel-collector-loadtest.yaml).
services:
  mongo-exporter:
    image: percona/mongodb_exporter:0.40.0
    restart: unless-stopped
    command: ["--mongodb.uri=${MONGO_EXPORTER_URI:-mongodb://localhost:27017}", "--collect-all"]
