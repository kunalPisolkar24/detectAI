apiVersion: 1

groups:
  - orgId: 1
    name: worker-analytics
    folder: Detect-AI
    interval: 1m
    rules:
      - title: WorkerAnalyticsDown
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 120
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: up{job="worker-analytics"} == 0 or worker_active_instances{service="worker-analytics"} == 0
              instant: true
              range: false
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: C
              type: reduce
        for: 2m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: worker-analytics target unreachable or no active instance for 2 minutes
        labels:
          severity: critical
      - title: AnalyticsHighErrorRate
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: 100 * sum(rate(worker_job_errors_total{service="worker-analytics"}[5m])) / clamp_min(sum(rate(worker_jobs_processed_total{service="worker-analytics"}[5m])), 0.001) > 5
              instant: true
              range: false
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: C
              type: reduce
        for: 10m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: worker-analytics error rate above 5% for 10 minutes
        labels:
          severity: critical
      - title: AnalyticsHighLatency
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: histogram_quantile(0.95, sum by (le) (rate(worker_job_duration_seconds_bucket{service="worker-analytics"}[5m]))) > 2
              instant: true
              range: false
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: C
              type: reduce
        for: 10m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: worker-analytics p95 job duration above 2s for 10 minutes
        labels:
          severity: warning
      - title: AnalyticsRabbitDown
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 120
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: rabbitmq_connection_status{service="worker-analytics"} == 0
              instant: true
              range: false
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: C
              type: reduce
        for: 2m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: worker-analytics RabbitMQ disconnected for 2 minutes
        labels:
          severity: critical
      - title: AnalyticsRedisDown
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 120
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: redis_connection_status{service="worker-analytics"} == 0
              instant: true
              range: false
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: C
              type: reduce
        for: 2m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: worker-analytics Redis disconnected (AnalyticsMain or AnalyticsDedup) for 2 minutes
        labels:
          severity: critical
      - title: AnalyticsRabbitFlapping
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: rate(rabbitmq_reconnections_total{service="worker-analytics"}[10m]) > 0
              instant: true
              range: false
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: C
              type: reduce
        for: 15m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: worker-analytics reconnecting to RabbitMQ repeatedly for 15 minutes
        labels:
          severity: warning
      - title: AnalyticsDBPoolWaiting
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: db_pool_connections{service="worker-analytics", state="waiting"} > 0
              instant: true
              range: false
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: C
              type: reduce
        for: 5m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: worker-analytics DB pool waiting connections for 5 minutes
        labels:
          severity: warning
      - title: AnalyticsQueueBacklog
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: rabbitmq_queue_messages_ready{queue="analytics.usage"} > 100
              instant: true
              range: false
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: C
              type: reduce
        for: 10m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: analytics.usage queue backlog above 100 ready messages for 10 minutes
        labels:
          severity: warning
      - title: AnalyticsQueueNoConsumer
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: rabbitmq_queue_consumers{queue="analytics.usage"} == 0
              instant: true
              range: false
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: C
              type: reduce
        for: 5m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: analytics.usage queue has had no consumer for 5 minutes
        labels:
          severity: critical
      - title: AnalyticsQueueUnackedHigh
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: rabbitmq_queue_messages_unacknowledged{queue="analytics.usage"} > 50
              instant: true
              range: false
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: C
              type: reduce
        for: 10m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: analytics.usage queue unacknowledged messages above 50 for 10 minutes
        labels:
          severity: warning
      - title: AnalyticsDLQGrowth
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: rate(worker_dead_lettered_total{service="worker-analytics"}[5m]) > 0
              instant: true
              range: false
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: C
              type: reduce
        for: 5m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: worker-analytics DLQ growth detected for 5 minutes
        labels:
          severity: critical
      - title: AnalyticsRetryStorm
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: rate(worker_retry_total{service="worker-analytics"}[5m]) > 0.5
              instant: true
              range: false
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
              datasource:
                type: __expr__
