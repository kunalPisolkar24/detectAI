apiVersion: 1

groups:
  - orgId: 1
    name: chat-worker
    folder: Detect-AI
    interval: 1m
    rules:
      - title: ChatWorkerDown
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 120
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: up{job=~".*(chat-worker|chats-worker).*"} == 0
              instant: true
              range: false
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: C
              type: reduce
        for: 2m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: chat-worker target unreachable for 2 minutes
        labels:
          severity: critical
      - title: ChatWorkerStreamLagHigh
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: max(chat_redis_stream_lag{job=~".*(chat-worker|chats-worker).*"} ) > 100
              instant: true
              range: false
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: C
              type: reduce
        for: 10m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: chat-worker stream lag max >100 pending messages for 10 minutes (persistence falling behind)
        labels:
          severity: warning
      - title: ChatWorkerIngestStall
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: (sum(rate(chat_messages_published_total{job=~".*(chat-service|chats-api).*"}[5m])) > bool 0.05) * (sum(rate(chat_messages_ingested_total{job=~".*(chat-worker|chats-worker).*"}[5m])) == bool 0)
              instant: true
              range: false
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: C
              type: reduce
        for: 10m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: chat-worker ingest stall for 10 minutes (API publishing >0.05/sec but worker ingested ==0)
        labels:
          severity: critical
      - title: ChatWorkerDatabaseErrors
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: sum(rate(chat_database_errors_total{job=~".*(chat-worker|chats-worker).*",operation="bulk_upsert"}[5m])) > 0.02
              instant: true
              range: false
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: C
              type: reduce
        for: 10m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: chat-worker Mongo bulk_upsert errors >0.02/sec for 10 minutes
        labels:
          severity: critical
      - title: ChatWorkerStreamErrors
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: sum(rate(chat_stream_errors_total{job=~".*(chat-worker|chats-worker).*"}[5m])) > 0.05
              instant: true
              range: false
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: C
              type: reduce
        for: 10m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: chat-worker stream errors (read/ack/autoclaim/unmarshal) >0.05/sec for 10 minutes
        labels:
          severity: warning
      - title: ChatWorkerDLQGrowth
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: sum(increase(chat_dlq_messages_total{job=~".*(chat-worker|chats-worker).*"}[15m])) > 3
              instant: true
              range: false
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: C
              type: reduce
        for: 15m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: chat-worker DLQ grew by >3 messages in last 15 minutes (poison pills or persistent DB failure)
        labels:
          severity: warning
