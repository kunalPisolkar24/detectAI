                    params:
                      - A
                  reducer:
                    params: []
                    type: last
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: C
              type: reduce
        for: 15m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: worker-payments reconnecting to RabbitMQ repeatedly for 15 minutes
        labels:
          severity: warning
      - title: PaymentsDBPoolWaiting
        condition: C
