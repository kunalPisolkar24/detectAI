                    params: []
                    type: last
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: C
              type: reduce
        for: 5m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: worker-payments Paddle cancel failing (non-2xx/404/409) for 5 minutes
        labels:
          severity: critical
      - title: PaymentsPaddleSlow
