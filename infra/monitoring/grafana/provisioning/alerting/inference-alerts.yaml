apiVersion: 1

groups:
  - orgId: 1
    name: inference
    folder: Detect-AI
    interval: 1m
    rules:
      - title: InferenceTargetDown
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 120
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: up{job=~".*inference.*"} == 0
              instant: true
              range: false
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: C
              type: reduce
        for: 2m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: inference target unreachable for 2 minutes
        labels:
          severity: critical
      - title: InferenceHighErrorRate
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: 100 * sum(rate(grpc_requests_total{job=~".*inference.*",code!="OK"}[5m])) / clamp_min(sum(rate(grpc_requests_total{job=~".*inference.*"}[5m])), 0.001)
              instant: true
              range: false
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 5
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: C
              type: reduce
        for: 10m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: inference error rate above 5% for 10 minutes
        labels:
          severity: critical
      - title: InferenceHighLatency
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: histogram_quantile(0.95, sum by (le) (rate(grpc_latency_seconds_bucket{job=~".*inference.*"}[5m])))
              instant: true
              range: false
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: C
              type: reduce
        for: 10m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: inference p95 latency above 1 second for 10 minutes
        labels:
          severity: warning
      - title: InferenceQueueShedding
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: sum(rate(inference_batch_queue_rejected_total{job=~".*inference.*"}[5m])) > 0 or histogram_quantile(0.95, sum by (le) (rate(model_batch_queue_wait_seconds_bucket{job=~".*inference.*"}[5m]))) > 0.04
              instant: true
              range: false
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: C
              type: reduce
        for: 5m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: inference queue shedding or p95 wait above 40ms for 5 minutes
        labels:
          severity: warning
      - title: InferenceDegradedProvider
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: increase(inference_engine_provider_fallback_total{job=~".*inference.*"}[1h]) > 0
              instant: true
              range: false
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: C
              type: reduce
        for: 15m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: inference provider fallback (GPU missing or offline) in last hour
        labels:
          severity: warning
