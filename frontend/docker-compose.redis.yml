version: '3.8'

services:
  redis-master:
    image: redis:7.2-alpine
    container_name: detect_ai_redis_master
    command: redis-server --appendonly yes --requirepass "user_cache_password" --maxmemory 256mb --maxmemory-policy volatile-lru
    ports:
      - "6379:6379"
    networks:
      - app-net
    volumes:
      - redis_master_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "user_cache_password", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-slave-1:
    image: redis:7.2-alpine
    container_name: detect_ai_redis_slave_1
    command: redis-server --replicaof redis-master 6379 --masterauth "user_cache_password" --requirepass "user_cache_password" --maxmemory 256mb --maxmemory-policy volatile-lru
    depends_on:
      redis-master:
        condition: service_healthy
    networks:
      - app-net

  redis-slave-2:
    image: redis:7.2-alpine
    container_name: detect_ai_redis_slave_2
    command: redis-server --replicaof redis-master 6379 --masterauth "user_cache_password" --requirepass "user_cache_password" --maxmemory 256mb --maxmemory-policy volatile-lru
    depends_on:
      redis-master:
        condition: service_healthy
    networks:
      - app-net

  redis-ratelimit:
    image: redis:7.2-alpine
    container_name: detect_ai_redis_ratelimit
    command: redis-server --save "" --appendonly no --requirepass "worker_password" --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6380:6379"
    networks:
      - app-net
    volumes:
      - redis_worker_data:/data

networks:
  app-net:
    driver: bridge

volumes:
  redis_master_data:
  redis_worker_data: