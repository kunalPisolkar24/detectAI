services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    command: pnpm dev
    restart: no
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - USE_REDIS_CLUSTER=true
      - REDIS_USAGE_URL=redis-cluster-node-0:6379,redis-cluster-node-1:6379,redis-cluster-node-2:6379
      - DATABASE_URL=postgresql://user:password@postgres-primary:5432/detect_ai
      - DATABASE_URL_REPLICA=postgresql://user:password@postgres-replica:5432/detect_ai
      - REDIS_PASSWORD=user_cache_password
      - REDIS_USAGE_PASSWORD=
      - FILE_EXTRACTOR_API_URL=http://document-parser:8000
      - AI_SERVICE_URL=detect_ai_inference:50051
      - AI_SERVICE_API_KEY=dev-secret-key

  worker-analytics:
    command: /bin/sh -c "bunx prisma generate && bun --watch src/workers/analytics/index.ts"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://user:password@postgres-primary:5432/detect_ai
      - DATABASE_URL_REPLICA=postgresql://user:password@postgres-replica:5432/detect_ai
      - REDIS_URL=redis://:user_cache_password@redis-master:6379
      - REDIS_USAGE_URL=redis-cluster-node-0:6379,redis-cluster-node-1:6379,redis-cluster-node-2:6379
      - REDIS_MODE=standalone
    volumes:
      - ../../services/workers:/app
      - /app/node_modules

  worker-cron:
    command: /bin/sh -c "bunx prisma generate && bun --watch src/workers/cron/index.ts"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://user:password@postgres-primary:5432/detect_ai
      - DATABASE_URL_REPLICA=postgresql://user:password@postgres-replica:5432/detect_ai
      - REDIS_URL=redis://:user_cache_password@redis-master:6379
      - REDIS_USAGE_URL=redis-cluster-node-0:6379,redis-cluster-node-1:6379,redis-cluster-node-2:6379
      - REDIS_MODE=standalone
    volumes:
      - ../../services/workers:/app
      - /app/node_modules

  worker-payments:
    command: /bin/sh -c "bunx prisma generate && bun --watch src/workers/payments/index.ts"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://user:password@postgres-primary:5432/detect_ai
      - DATABASE_URL_REPLICA=postgresql://user:password@postgres-replica:5432/detect_ai
      - REDIS_URL=redis://:user_cache_password@redis-master:6379
      - REDIS_USAGE_URL=redis-cluster-node-0:6379,redis-cluster-node-1:6379,redis-cluster-node-2:6379
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - REDIS_MODE=standalone
      - PADDLE_API_KEY=${PADDLE_API_KEY}
      - PADDLE_ENVIRONMENT=sandbox
    ports:
      - "7777:7777"
    volumes:
      - ../../services/workers:/app
      - /app/node_modules
    depends_on:
      rabbitmq:
        condition: service_started

  rabbitmq:
    ports:
      - "5672:5672"
      - "15672:15672"

  document-parser:
    ports:
      - "5001:8000"
    environment:
      - LOG_LEVEL=debug

  postgres-primary:
    ports:
      - "5432:5432"

  postgres-replica:
    ports:
      - "5433:5432"

  redis-master:
    ports:
      - "6379:6379"

  redis-ratelimit:
    ports:
      - "6382:6379"

  redis-sentinel-1:
    ports:
      - "26379:26379"

  redis-cluster-node-0:
    ports:
      - "7000:6379"

  redis-cluster-node-1:
    ports:
      - "7001:6379"

  redis-cluster-node-2:
    ports:
      - "7002:6379"