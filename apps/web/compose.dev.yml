include:
  - path: ./infra/docker/postgres.yml
  - path: ./infra/docker/redis.yml
  - path: ./infra/docker/redis-cluster.yml

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    command: pnpm dev
    restart: no
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - USE_REDIS_CLUSTER=true
      - REDIS_USAGE_URL=redis-cluster-node-0:6379,redis-cluster-node-1:6379,redis-cluster-node-2:6379

  postgres-primary:
    ports:
      - "5432:5432"

  postgres-replica:
    ports:
      - "5433:5432"

  redis-master:
    ports:
      - "6379:6379"

  redis-ratelimit:
    ports:
      - "6382:6379"

  redis-sentinel-1:
    ports:
      - "26379:26379"

  redis-cluster-node-0:
    ports:
      - "7000:6379"

  redis-cluster-node-1:
    ports:
      - "7001:6379"

  redis-cluster-node-2:
    ports:
      - "7002:6379"