name: detect_ai_web

include:
  - path: ../../infra/docker/postgres.yml
  - path: ../../infra/docker/redis.yml
  - path: ../../infra/docker/redis-cluster.yml
  - path: ../../infra/docker/compose.shared.yml
  
  - path: ../../services/document-parser/compose.yml
  - path: ../../services/inference/compose.yml
  - path: ../../services/workers/compose.yml
  - path: ../../services/payments/gateway/compose.yml

networks:
  detectai_net:
    name: detect_ai_network
    external: true

services:
  frontend:
    container_name: detect_ai_frontend
    build: 
      context: .
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - REDIS_SENTINELS=detect_ai_redis_sentinel_1:26379,detect_ai_redis_sentinel_2:26379,detect_ai_redis_sentinel_3:26379
      - REDIS_MASTER_NAME=mymaster
      - USE_REDIS_CLUSTER=true
      - REDIS_USAGE_URL=redis-cluster-node-0:6379,redis-cluster-node-1:6379,redis-cluster-node-2:6379
      - FILE_EXTRACTOR_API_URL=http://document-parser:8000
      - AI_SERVICE_URL=detect_ai_inference:50051
    networks:
      - detectai_net
    depends_on:
      redis-master:
        condition: service_healthy
      postgres-primary:
        condition: service_healthy
      redis-cluster-node-0:
        condition: service_healthy
      document-parser:
        condition: service_started
      ai-service:
        condition: service_started
      payment-gateway:
        condition: service_started