syntax = "proto3";

package aidetection;

service AIService {
  rpc DetectSpark (PredictRequest) returns (PredictResponse) {}
  rpc DetectFlare (PredictRequest) returns (PredictResponse) {}
}

message PredictRequest {
  string text = 1;
}

message PredictResponse {
  string model_name = 1;
  string label = 2;
  bool is_ai_generated = 3;
  float confidence_score = 4;
  float human_confidence = 5;
  float ai_confidence = 6;
}