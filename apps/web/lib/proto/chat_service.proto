syntax = "proto3";

package chat;

service ChatService {
  rpc CreateChat (CreateChatRequest) returns (CreateChatResponse);
  rpc GetChat (GetChatRequest) returns (GetChatResponse);
  rpc GetUserChats (GetUserChatsRequest) returns (GetUserChatsResponse);
  rpc RenameChat (RenameChatRequest) returns (RenameChatResponse);
  rpc DeleteChat (DeleteChatRequest) returns (DeleteChatResponse);
  
  rpc SaveMessage (SaveMessageRequest) returns (SaveMessageResponse);
  rpc GetChatHistory (GetChatHistoryRequest) returns (GetChatHistoryResponse);
}

message CreateChatRequest {
  string user_id = 1;
  string title = 2;
}

message CreateChatResponse {
  string chat_id = 1;
}

message GetChatRequest {
  string chat_id = 1;
}

message GetChatResponse {
  string id = 1;
  string user_id = 2;
  string title = 3;
  int64 created_at = 4;
  int64 updated_at = 5;
}

message GetUserChatsRequest {
  string user_id = 1;
  int32 limit = 2;
}

message ChatSummary {
  string id = 1;
  string title = 2;
  int64 updated_at = 3;
}

message GetUserChatsResponse {
  repeated ChatSummary chats = 1;
}

message RenameChatRequest {
  string chat_id = 1;
  string new_title = 2;
}

message RenameChatResponse {
  bool success = 1;
}

message DeleteChatRequest {
  string chat_id = 1;
}

message DeleteChatResponse {
  bool success = 1;
}

message Analysis {
  double human_score = 1;
  double ai_score = 2;
  string model_name = 3;
  string verdict = 4;
}

message SaveMessageRequest {
  string chat_id = 1;
  string user_id = 2;
  string role = 3;
  string content = 4;
  map<string, string> metadata = 5;
  Analysis analysis = 6;
}

message SaveMessageResponse {
  string message_id = 1;
  int64 timestamp = 2;
}

message GetChatHistoryRequest {
  string chat_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message Message {
  string id = 1;
  string chat_id = 2;
  string user_id = 3;
  string role = 4;
  string content = 5;
  int64 created_at = 6;
  map<string, string> metadata = 7;
  Analysis analysis = 8;
}

message GetChatHistoryResponse {
  repeated Message messages = 1;
  bool has_more = 2;
}