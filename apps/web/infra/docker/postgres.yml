networks:
  detectai_net:
    external: true

services:
  postgres-primary:
    image: postgres:15-alpine
    container_name: detect_ai_pg_primary
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=detect_ai
    networks:
      - detectai_net
    volumes:
      - pg_primary_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d detect_ai"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-replica:
    image: postgres:15-alpine
    container_name: detect_ai_pg_replica
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=detect_ai
    networks:
      - detectai_net
    volumes:
      - pg_replica_data:/var/lib/postgresql/data
    depends_on:
      postgres-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d detect_ai"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg_primary_data:
  pg_replica_data: