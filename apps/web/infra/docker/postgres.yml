networks:
  detectai_net:
    external: true

services:
  postgres-primary:
    image: bitnami/postgresql:15
    container_name: detect_ai_pg_primary
    restart: unless-stopped
    environment:
      - POSTGRESQL_USERNAME=${POSTGRES_USER:-user}
      - POSTGRESQL_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRESQL_DATABASE=detect_ai
      - POSTGRESQL_REPLICATION_MODE=master
      - POSTGRESQL_REPLICATION_USER=repl_user
      - POSTGRESQL_REPLICATION_PASSWORD=repl_password
    networks:
      - detectai_net
    volumes:
      - pg_primary_data:/bitnami/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d detect_ai"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-replica:
    image: bitnami/postgresql:15
    container_name: detect_ai_pg_replica
    restart: unless-stopped
    environment:
      - POSTGRESQL_USERNAME=${POSTGRES_USER:-user}
      - POSTGRESQL_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRESQL_DATABASE=detect_ai
      - POSTGRESQL_REPLICATION_MODE=slave
      - POSTGRESQL_REPLICATION_USER=repl_user
      - POSTGRESQL_REPLICATION_PASSWORD=repl_password
      - POSTGRESQL_MASTER_HOST=postgres-primary
      - POSTGRESQL_MASTER_PORT_NUMBER=5432
    networks:
      - detectai_net
    volumes:
      - pg_replica_data:/bitnami/postgresql
    depends_on:
      postgres-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d detect_ai"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg_primary_data:
  pg_replica_data: