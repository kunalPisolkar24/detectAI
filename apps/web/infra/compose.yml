# Web stack. PREVIEW=true => frontend-only (--no-deps). Datastores via shared atoms.
include:
  - path: ../../../infra/docker/postgres-users/standalone.yml
  - path: ../../../infra/docker/redis-users/standalone.yml
  - path: ../../../infra/docker/rabbitmq/standalone.yml

services:
  db-migrate:
    build:
      context: ..
      dockerfile: Dockerfile
      target: migrate
    restart: "no"
    environment:
      - DATABASE_URL=${DATABASE_URL}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres-users:
        condition: service_healthy

  frontend:
    container_name: detect_ai_frontend
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        PREVIEW: ${PREVIEW:-false}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY}
        NEXT_PUBLIC_PADDLE_CLIENT_TOKEN: ${NEXT_PUBLIC_PADDLE_CLIENT_TOKEN}
    restart: always
    environment:
      # Preview switch (single flick; see header)
      - PREVIEW=${PREVIEW:-false}
      - PREVIEW_MODE=${PREVIEW_MODE:-false}
      - NEXT_PUBLIC_PREVIEW_MODE=${NEXT_PUBLIC_PREVIEW_MODE:-false}
      # Environment
      - NODE_ENV=${NODE_ENV}
      - LOG_LEVEL=${LOG_LEVEL}
      # OAuth
      - GITHUB_ID=${GITHUB_ID}
      - GITHUB_SECRET=${GITHUB_SECRET}
      - GOOGLE_ID=${GOOGLE_ID}
      - GOOGLE_SECRET=${GOOGLE_SECRET}
      # Next Auth
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      # Postgres DB (standalone instance; replica URL points at it too)
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_URL_REPLICA=${DATABASE_URL_REPLICA}
      # Redis user cache (standalone docker or ElastiCache users)
      - REDIS_URL=${REDIS_URL}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      # Cloudflare Turnstile
      - NEXT_PUBLIC_TURNSTILE_SITE_KEY=${NEXT_PUBLIC_TURNSTILE_SITE_KEY}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY}
      # Paddle
      - NEXT_PUBLIC_PADDLE_CLIENT_TOKEN=${NEXT_PUBLIC_PADDLE_CLIENT_TOKEN}
      - PADDLE_WEBHOOK_SECRET=${PADDLE_WEBHOOK_SECRET}
      - PADDLE_API_KEY=${PADDLE_API_KEY}
      # Payment Gateway
      - PAYMENT_GATEWAY_URL=${PAYMENT_GATEWAY_URL}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - PROMETHEUS_WEB_SCRAPE_TOKEN=${PROMETHEUS_WEB_SCRAPE_TOKEN:-}
      # Inference Service
      - AI_SERVICE_URL=${AI_SERVICE_URL}
      - AI_SERVICE_API_KEY=${AI_SERVICE_API_KEY}
      # Chat Service
      - CHAT_SERVICE_URL=${CHAT_SERVICE_URL}
      # File Processing Service
      - FILE_EXTRACTOR_API_URL=${FILE_EXTRACTOR_API_URL}
      # RabbitMQ
      - RABBITMQ_URL=${RABBITMQ_URL}
    ports:
      - "${PORT_FRONTEND:-3000}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      postgres-users:
        condition: service_healthy
      redis-users:
        condition: service_healthy
