# Unified web stack (start-only, no dev/HMR mode).
#
# Preview needs a single flick: PREVIEW=true (see infra/.env.preview and
# `make preview`). The legacy PREVIEW_MODE / NEXT_PUBLIC_PREVIEW_MODE flags
# are derived from PREVIEW at the boundaries; the app treats any of them as
# preview. Preview runs skip backends via `up --no-deps frontend`, so no
# separate compose file is needed.
#
# Datastores (postgres + user redis) are NOT defined here. Either point
# .env at an existing instance, or import the standalone atoms:
#   make start WITH_DATA=1
# which merges the postgres/redis templates into this project.
# NOTE: no depends_on the data services here — `depends_on` requires the
# target to exist in the merged project, so startup ordering with WITH_DATA
# is enforced by the makefile (`up --wait` on healthy datastores first).
services:
  db-migrate:
    build:
      context: ..
      dockerfile: Dockerfile
      target: migrate
    restart: "no"
    environment:
      - DATABASE_URL=${DATABASE_URL}

  frontend:
    container_name: detect_ai_frontend
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        PREVIEW: ${PREVIEW:-false}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY}
        NEXT_PUBLIC_PADDLE_CLIENT_TOKEN: ${NEXT_PUBLIC_PADDLE_CLIENT_TOKEN}
    restart: always
    environment:
      # Preview switch (single flick; see header)
      - PREVIEW=${PREVIEW:-false}
      - PREVIEW_MODE=${PREVIEW_MODE:-false}
      - NEXT_PUBLIC_PREVIEW_MODE=${NEXT_PUBLIC_PREVIEW_MODE:-false}
      # Environment
      - NODE_ENV=${NODE_ENV}
      - LOG_LEVEL=${LOG_LEVEL}
      # OAuth
      - GITHUB_ID=${GITHUB_ID}
      - GITHUB_SECRET=${GITHUB_SECRET}
      - GOOGLE_ID=${GOOGLE_ID}
      - GOOGLE_SECRET=${GOOGLE_SECRET}
      # Next Auth
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      # Postgres DB (standalone instance; replica URL points at it too)
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_URL_REPLICA=${DATABASE_URL_REPLICA}
      # Redis user cache (standalone)
      - REDIS_MODE=${REDIS_MODE:-standalone}
      - REDIS_URL=${REDIS_URL}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_MASTER_NAME=${REDIS_MASTER_NAME:-mymaster}
      - REDIS_SENTINELS=${REDIS_SENTINELS:-redis-sentinel-1:26379}
      # Redis analytics (points at the same standalone instance for now)
      - REDIS_USAGE_MODE=${REDIS_USAGE_MODE}
      - USE_REDIS_CLUSTER=${USE_REDIS_CLUSTER:-false}
      - REDIS_USAGE_URL=${REDIS_USAGE_URL}
      - REDIS_USAGE_PASSWORD=${REDIS_USAGE_PASSWORD}
      # Cloudflare Turnstile
      - NEXT_PUBLIC_TURNSTILE_SITE_KEY=${NEXT_PUBLIC_TURNSTILE_SITE_KEY}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY}
      # Paddle
      - NEXT_PUBLIC_PADDLE_CLIENT_TOKEN=${NEXT_PUBLIC_PADDLE_CLIENT_TOKEN}
      - PADDLE_WEBHOOK_SECRET=${PADDLE_WEBHOOK_SECRET}
      - PADDLE_API_KEY=${PADDLE_API_KEY}
      # Payment Gateway
      - PAYMENT_GATEWAY_URL=${PAYMENT_GATEWAY_URL}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - PROMETHEUS_WEB_SCRAPE_TOKEN=${PROMETHEUS_WEB_SCRAPE_TOKEN:-}
      # Inference Service
      - AI_SERVICE_URL=${AI_SERVICE_URL}
      - AI_SERVICE_API_KEY=${AI_SERVICE_API_KEY}
      # Chat Service
      - CHAT_SERVICE_URL=${CHAT_SERVICE_URL}
      # File Processing Service
      - FILE_EXTRACTOR_API_URL=${FILE_EXTRACTOR_API_URL}
      # RabbitMQ
      - RABBITMQ_URL=${RABBITMQ_URL}
    ports:
      - "${PORT_FRONTEND}:3000"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
