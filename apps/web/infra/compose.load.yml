# Self-contained load-test rig (throwaway postgres/redis, mock-server, k6).
# Isolated from the main stack by design: `make load-test`.
# Datastores come from the shared atoms; their values are fixed inline in
# the makefile (LOAD_ENV) — reproducible, no env file. Keep the hardcoded
# frontend URLs below in sync with LOAD_ENV (db name, redis password).
name: web-load

include:
  - path: ../../../infra/docker/postgres-users/standalone.yml
  - path: ../../../infra/docker/redis-users/standalone.yml
  - path: ../../../infra/docker/rabbitmq/standalone.yml

services:
  db-migrate:
    build:
      context: ..
      dockerfile: Dockerfile
      target: migrate
    restart: "no"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres-users:5432/detectai_load
    depends_on:
      postgres-users:
        condition: service_healthy

  # The accounts the load scripts sign in with. Registration is a server
  # action, not an HTTP route, so the rig has to plant the rows itself.
  load-seed:
    build:
      context: ..
      dockerfile: test/load/seed/Dockerfile
    restart: "no"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres-users:5432/detectai_load
      - LOAD_USER_PASSWORD=LoadTest123!
    depends_on:
      db-migrate:
        condition: service_completed_successfully

  mock-server:
    build:
      context: ..
      dockerfile: test/load/mock-server/Dockerfile
    environment:
      - PROTO_DIR=/app/lib/shared/proto
    ports:
      - "8001:8000"
      - "50052:50051"

  frontend:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        - ENV_TYPE=dev
        - NEXT_PUBLIC_ENV_TYPE=dev
        - NEXT_PUBLIC_TURNSTILE_SITE_KEY=1x00000000000000000000AA
        - NEXT_PUBLIC_PADDLE_CLIENT_TOKEN=load-test-token
    environment:
      - ENV_TYPE=dev
      - NEXT_PUBLIC_ENV_TYPE=dev
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@postgres-users:5432/detectai_load
      - REDIS_URL=redis://:load-redis-password@redis-users:6379
      - REDIS_PASSWORD=load-redis-password
      - NEXTAUTH_SECRET=load-test-secret
      - NEXTAUTH_URL=http://frontend:3000
      - AI_SERVICE_URL=mock-server:50051
      - CHAT_SERVICE_URL=mock-server:50051
      - FILE_EXTRACTOR_API_URL=http://mock-server:8000
      - PAYMENT_GATEWAY_URL=http://mock-server:8000
      - INTERNAL_API_KEY=load-test-key
      # The abuse limiter caps how fast one account may analyze. Every
      # scenario but the rate-limit one runs with it out of the way so a
      # throughput run measures the service, not the limiter. The rate-limit
      # scenario sets its own values (see the makefile).
      - ABUSE_RATE_LIMIT_ANALYZE_MAX=${ABUSE_RATE_LIMIT_ANALYZE_MAX:-10000}
      - ABUSE_RATE_LIMIT_ANALYZE_WINDOW_MS=${ABUSE_RATE_LIMIT_ANALYZE_WINDOW_MS:-60000}
      - NEXT_PUBLIC_TURNSTILE_SITE_KEY=1x00000000000000000000AA
      - NEXT_PUBLIC_PADDLE_CLIENT_TOKEN=load-test-token
      - TURNSTILE_SECRET_KEY=1x0000000000000000000000000000000AA
      - GITHUB_ID=mock-github-client-id-not-configured
      - GITHUB_SECRET=mock-github-client-secret-not-configured
      - GOOGLE_ID=mock-google-client-id-not-configured
      - GOOGLE_SECRET=mock-google-client-secret-not-configured
      - AI_SERVICE_API_KEY=mock-ai-service-api-key-not-configured
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      postgres-users:
        condition: service_healthy
      redis-users:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      load-seed:
        condition: service_completed_successfully
    ports:
      - "3001:3000"

  k6:
    image: grafana/k6
    volumes:
      - ../test/load/scripts:/scripts
      - ../test/load/results:/results
    # Lets the k6 container reach a service published on the Docker host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - BASE_URL=${BASE_URL:-http://frontend:3000}
      # The name the e2e harness uses for the web endpoint. It wins over
      # BASE_URL in the scripts.
      - WEB_BASE_URL=${WEB_BASE_URL:-}
      - INTERNAL_KEY=${INTERNAL_KEY:-load-test-key}
      # The key the deployed frontend checks the internal key against. It wins
      # over INTERNAL_KEY when both are set.
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-}
      # The analyze budget for the target. The rig answers from a mock
      # backend, so its own defaults are milliseconds.
      - WEB_ANALYZE_P95_MS=${WEB_ANALYZE_P95_MS:-}
      - WEB_ANALYZE_P99_MS=${WEB_ANALYZE_P99_MS:-}
      # The chat the requests are addressed to. A real chats service needs
      # one that exists and belongs to the user the request carries.
      - WEB_CHAT_ID=${WEB_CHAT_ID:-}
    depends_on:
      frontend:
        condition: service_started
    # The rig only carries the runner; the makefile starts a script with
    # `compose run`. A command here would start a second, uninvited run of
    # its own on every `compose up`.
    command: ["sleep", "infinity"]
