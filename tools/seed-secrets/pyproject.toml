[tool.poetry]
name = "detectai-seed-secrets"
version = "0.1.0"
description = "Env-driven seeder for app-only Secrets Manager secrets (Floci + real AWS)"
authors = ["DetectAI <hello@detectai.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
boto3 = "^1.35.0"

[tool.poetry.group.dev.dependencies]
pytest = "9.0.2"
pytest-mock = "3.15.1"
ruff = "0.1.15"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E"]
ignore = ["E501"]
