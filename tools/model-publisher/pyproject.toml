[tool.poetry]
name = "detectai-model-publisher"
version = "0.1.0"
description = "Publisher for DetectAI HuggingFace models"
authors = ["DetectAI <hello@detectai.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
huggingface-hub = "1.2.3"
python-dotenv = "1.2.1"
pydantic = "2.12.5"
pydantic-settings = "2.12.0"

[tool.poetry.group.dev.dependencies]
pytest = "9.0.2"
pytest-mock = "3.15.1"
ruff = "0.1.15"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E"]
ignore = ["E501"]
