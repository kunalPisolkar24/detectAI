services:
  prometheus:
    image: prom/prometheus:v3.9.1
    container_name: detect_ai_prometheus
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        printf "%s" "$$PROMETHEUS_WEB_SCRAPE_TOKEN" > /tmp/web_metrics_token
        exec /bin/prometheus \
          --config.file=/etc/prometheus/prometheus.yml \
          --storage.tsdb.path=/prometheus \
          --storage.tsdb.retention.time=$$PROMETHEUS_RETENTION_TIME
    environment:
      - PROMETHEUS_RETENTION_TIME=${PROMETHEUS_RETENTION_TIME:-15d}
      - PROMETHEUS_WEB_SCRAPE_TOKEN=${PROMETHEUS_WEB_SCRAPE_TOKEN}
    volumes:
      - prometheus_data:/prometheus
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "9090"
    networks:
      - detectai_net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  grafana:
    image: grafana/grafana:12.3.1
    container_name: detect_ai_grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - detectai_net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.54.1
    container_name: detect_ai_cadvisor
    restart: unless-stopped
    privileged: true
    command:
      - --docker_only=true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    expose:
      - "8080"
    networks:
      - detectai_net

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.10.2
    container_name: detect_ai_node_exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+)($|/)
    network_mode: host
    pid: host
    volumes:
      - /:/host:ro,rslave

  postgres-exporter-primary:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    container_name: detect_ai_postgres_exporter_primary
    restart: unless-stopped
    environment:
      - DATA_SOURCE_NAME=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-primary:5432/${POSTGRES_DB}?sslmode=disable
    expose:
      - "9187"
    networks:
      - detectai_net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9187/metrics"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  postgres-exporter-replica:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    container_name: detect_ai_postgres_exporter_replica
    restart: unless-stopped
    environment:
      - DATA_SOURCE_NAME=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-replica:5432/${POSTGRES_DB}?sslmode=disable
    expose:
      - "9187"
    networks:
      - detectai_net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9187/metrics"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  rabbitmq-exporter:
    image: kbudde/rabbitmq-exporter:1.0.0-RC21
    container_name: detect_ai_rabbitmq_exporter
    restart: unless-stopped
    environment:
      - RABBIT_URL=http://rabbitmq:15672
      - RABBIT_USER=${RABBITMQ_USER}
      - RABBIT_PASSWORD=${RABBITMQ_PASS}
      - PUBLISH_PORT=9419
    expose:
      - "9419"
    networks:
      - detectai_net

  redis-exporter-master:
    image: oliver006/redis_exporter:v1.80.1
    container_name: detect_ai_redis_exporter_master
    restart: unless-stopped
    environment:
      - REDIS_ADDR=redis://redis-master:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    expose:
      - "9121"
    networks:
      - detectai_net

  redis-exporter-slave-1:
    image: oliver006/redis_exporter:v1.80.1
    container_name: detect_ai_redis_exporter_slave_1
    restart: unless-stopped
    environment:
      - REDIS_ADDR=redis://redis-slave-1:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    expose:
      - "9121"
    networks:
      - detectai_net

  redis-exporter-slave-2:
    image: oliver006/redis_exporter:v1.80.1
    container_name: detect_ai_redis_exporter_slave_2
    restart: unless-stopped
    environment:
      - REDIS_ADDR=redis://redis-slave-2:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    expose:
      - "9121"
    networks:
      - detectai_net

  redis-exporter-ratelimit:
    image: oliver006/redis_exporter:v1.80.1
    container_name: detect_ai_redis_exporter_ratelimit
    restart: unless-stopped
    environment:
      - REDIS_ADDR=redis://redis-ratelimit:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    expose:
      - "9121"
    networks:
      - detectai_net

  redis-exporter-usage-0:
    image: oliver006/redis_exporter:v1.80.1
    container_name: detect_ai_redis_exporter_usage_0
    restart: unless-stopped
    environment:
      - REDIS_ADDR=redis://redis-cluster-node-0:6379
    expose:
      - "9121"
    networks:
      - detectai_net

  redis-exporter-usage-1:
    image: oliver006/redis_exporter:v1.80.1
    container_name: detect_ai_redis_exporter_usage_1
    restart: unless-stopped
    environment:
      - REDIS_ADDR=redis://redis-cluster-node-1:6379
    expose:
      - "9121"
    networks:
      - detectai_net

  redis-exporter-usage-2:
    image: oliver006/redis_exporter:v1.80.1
    container_name: detect_ai_redis_exporter_usage_2
    restart: unless-stopped
    environment:
      - REDIS_ADDR=redis://redis-cluster-node-2:6379
    expose:
      - "9121"
    networks:
      - detectai_net

  redis-exporter-chat-1:
    image: oliver006/redis_exporter:v1.80.1
    container_name: detect_ai_redis_exporter_chat_1
    restart: unless-stopped
    environment:
      - REDIS_ADDR=redis://chat_redis_1:7010
    expose:
      - "9121"
    networks:
      - detectai_net

  redis-exporter-chat-2:
    image: oliver006/redis_exporter:v1.80.1
    container_name: detect_ai_redis_exporter_chat_2
    restart: unless-stopped
    environment:
      - REDIS_ADDR=redis://chat_redis_2:7011
    expose:
      - "9121"
    networks:
      - detectai_net

  redis-exporter-chat-3:
    image: oliver006/redis_exporter:v1.80.1
    container_name: detect_ai_redis_exporter_chat_3
    restart: unless-stopped
    environment:
      - REDIS_ADDR=redis://chat_redis_3:7012
    expose:
      - "9121"
    networks:
      - detectai_net

  mongo-exporter:
    image: percona/mongodb_exporter:0.47.2
    container_name: detect_ai_mongo_exporter
    restart: unless-stopped
    command:
      - --mongodb.uri=mongodb://chat-mongo-router:27017/admin
      - --collector.dbstats
    expose:
      - "9216"
    networks:
      - detectai_net

volumes:
  prometheus_data:
  grafana_data:

networks:
  detectai_net:
    name: ${detect_ai_network}
    external: true
