name: Tools - Seed Secrets

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - staging
    paths:
      - "tools/seed-secrets/**"
      - ".github/workflows/tools-seed-secrets.yaml"
  pull_request:
    branches:
      - main
      - staging
    paths:
      - "tools/seed-secrets/**"
      - ".github/workflows/tools-seed-secrets.yaml"

jobs:
  quality-assurance:
    name: Run Tests & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/seed-secrets

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install Dependencies
        run: poetry install --no-interaction

      - name: Lint with Ruff
        run: poetry run ruff check . --select F,E --ignore E501

      - name: Run Unit Tests & Coverage
        run: poetry run pytest -m "not integration" --cov=src --cov-report=term-missing --cov-fail-under=65 -v

      - name: Run Integration Tests
        run: poetry run pytest -m integration -v
