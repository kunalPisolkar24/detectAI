name: Service - Chats

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - staging
    paths:
      - "services/chats/**"
      - ".github/workflows/service-chats.yaml"
  pull_request:
    branches:
      - main
      - staging
    paths:
      - "services/chats/**"
      - ".github/workflows/service-chats.yaml"

env:
  DOCKER_IMAGE_NAME: kunalpisolkar/detect-ai-chats-service
  SERVICE_PATH: ./services/chats

jobs:
  quality-assurance:
    name: Run Tests & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.SERVICE_PATH }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: ${{ env.SERVICE_PATH }}/go.sum

      - name: Install Dependencies
        run: go mod download

      - name: Verify Code
        run: go vet ./...

      - name: Run Unit Tests
        run: go test $(go list ./... | grep -v '/tests/integration') -v -cover

      - name: Run Integration Tests
        run: go test -tags=integration -timeout=900s ./... -v -cover

  load-test-smoke:
    name: Run Smoke Load Test
    needs: quality-assurance
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.SERVICE_PATH }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create the service env file
        run: make env

      - name: Load rig env file
        run: make load-env

      - name: Start the datastores
        run: |
          make db-up
          make cache-up

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for the smoke rig
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.SERVICE_PATH }}
          file: ${{ env.SERVICE_PATH }}/Dockerfile
          push: false
          load: true
          tags: ${{ env.DOCKER_IMAGE_NAME }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run smoke scenario (service + k6 containers)
        run: |
          docker compose -f infra/compose.load.yml -f infra/compose.ci.yml run --rm k6 run /load/scenarios/smoke.js

      - name: Tear down the rig
        if: always()
        run: docker compose -f infra/compose.load.yml -f infra/compose.ci.yml down -v --remove-orphans

  build-and-push:
    name: Build & Push Docker Image
    needs: [quality-assurance, load-test-smoke]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.SERVICE_PATH }}
          file: ${{ env.SERVICE_PATH }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.DOCKER_IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_IMAGE_NAME }}:buildcache,mode=max
