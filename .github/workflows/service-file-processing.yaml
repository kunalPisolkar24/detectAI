name: Service - File Processing

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - staging
    paths:
      - "services/document-parser/**"
      - ".github/workflows/service-file-processing.yaml"
  pull_request:
    branches:
      - main
      - staging
    paths:
      - "services/document-parser/**"
      - ".github/workflows/service-file-processing.yaml"

jobs:
  quality-assurance:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./services/document-parser

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Lint with Ruff
        run: ruff check . --select F,E --ignore E501

      - name: Run Tests & Coverage
        run: python -m pytest --cov=app --cov-fail-under=80 tests/

  build-and-push:
    needs: quality-assurance
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: kunalpisolkar/detect-ai-file-processor
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: ./services/document-parser
          file: ./services/document-parser/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=kunalpisolkar/detect-ai-file-processor:buildcache
          cache-to: type=registry,ref=kunalpisolkar/detect-ai-file-processor:buildcache,mode=max