name: Service - File Processing

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - staging
    paths:
      - "services/document-parser/**"
      - ".github/workflows/service-file-processing.yaml"
  pull_request:
    branches:
      - main
      - staging
      - dev
    paths:
      - "services/document-parser/**"
      - ".github/workflows/service-file-processing.yaml"

env:
  DOCKER_IMAGE_NAME: kunalpisolkar/detect-ai-file-processor
  SERVICE_PATH: ./services/document-parser

jobs:
  quality-assurance:
    name: Run Tests & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.SERVICE_PATH }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: pipx install poetry

      - name: Install Dependencies
        run: poetry install --no-interaction

      - name: Lint with Ruff
        run: poetry run ruff check . --select F,E --ignore E501

      - name: Run Unit Tests & Coverage
        run: poetry run pytest tests/unit -m "not integration" --cov=app --cov-fail-under=80 -v

      - name: Run Integration Tests
        run: poetry run pytest tests/integration -m integration -v

  build-and-push:
    name: Build & Push Docker Image
    needs: quality-assurance
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.SERVICE_PATH }}
          file: ${{ env.SERVICE_PATH }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.DOCKER_IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_IMAGE_NAME }}:buildcache,mode=max