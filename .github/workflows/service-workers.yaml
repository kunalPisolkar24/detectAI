name: Service - Workers

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - staging
    paths:
      - "services/workers/**"
      - ".github/workflows/service-workers.yaml"
  pull_request:
    branches:
      - main
      - staging
    paths:
      - "services/workers/**"
      - ".github/workflows/service-workers.yaml"

env:
  DOCKER_IMAGE_NAME: kunalpisolkar/detect-ai-workers
  SERVICE_PATH: ./services/workers

jobs:
  quality-assurance:
    name: Run Tests & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.SERVICE_PATH }}

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: detectai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d detectai_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli -a user_cache_password ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      rabbitmq:
        image: rabbitmq:3.12-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
          RABBITMQ_DEFAULT_VHOST: detectai_test
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Dependencies
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/detectai_test
          DATABASE_URL_REPLICA: postgresql://user:password@localhost:5432/detectai_test
        run: bun install --frozen-lockfile

      - name: Run Unit Tests
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/detectai_test
          DATABASE_URL_REPLICA: postgresql://user:password@localhost:5432/detectai_test
        run: bun run test

      - name: Run Schema Migration for Integration Tests
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/detectai_test
          DATABASE_URL_REPLICA: postgresql://user:password@localhost:5432/detectai_test
        run: bunx prisma db push --skip-generate

      - name: Run Integration Tests
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/detectai_test
          DATABASE_URL_REPLICA: postgresql://user:password@localhost:5432/detectai_test
          REDIS_URL: redis://:user_cache_password@localhost:6379
          RABBITMQ_URL: amqp://guest:guest@localhost:5672/detectai_test
        run: bun run test:integration

  build-and-push:
    name: Build & Push Docker Image
    needs: quality-assurance
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.SERVICE_PATH }}
          file: ${{ env.SERVICE_PATH }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.DOCKER_IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_IMAGE_NAME }}:buildcache,mode=max
